<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Daily Tracker</title>
<style>
  :root{--bg:#0f1419;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;--accent:#4ea1ff;--current:#2ea043}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden}

  header{flex:0 0 auto;border-bottom:2px solid var(--line);padding:14px 22px}
  h1{font-size:20px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}

  .stage{flex:1 1 auto;display:flex;min-height:0}            /* the two-pane row */

  .mappane{flex:1 1 auto;position:relative;min-width:0;background:#000}
  .mappane iframe{width:100%;height:100%;border:0;display:block}

  .rightpane{flex:0 0 410px;display:flex;flex-direction:column;
    border-left:1px solid var(--line);background:var(--bg);min-width:0}
  .rightpane .panehead{flex:0 0 auto;padding:12px 16px;border-bottom:1px solid var(--line)}
  .panehead .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--current);display:inline-block}
  .panehead .legend{font-size:12px;color:var(--muted);margin-top:6px}
  .rightpane iframe{flex:1 1 auto;width:100%;border:0;display:block}

  /* Stack to one column on narrow screens */
  @media (max-width:820px){
    body{overflow:auto}
    .stage{flex-direction:column}
    .mappane{flex:0 0 60vh;min-height:380px}
    .rightpane{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
    .rightpane iframe{min-height:80vh}
  }
</style>
</head>
<body>
  <header>
    <h1>Data Center Community Response — Daily Tracker</h1>
    <div class="sub">Communities responding to data center development across the U.S. · Updated daily · Showing June 30, 2026</div>
  </header>

  <div class="stage">
    <div class="mappane">
      <iframe src="map.html" title="Map of data center community activity"></iframe>
    </div>
    <aside class="rightpane">
      <div class="panehead">
        <div class="label"><span class="dot"></span> Full report — every item &amp; source</div>
        <div class="legend">Green = active in the past 24 hours · Amber = older / background. Scroll for all items.</div>
      </div>
      <iframe src="report.html" title="Daily community response report"></iframe>
    </aside>
  </div>
</body>
</html>
