<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map (last 24 hours)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f1419;--card:#1a2129;--ink:#e6edf3;--muted:#9aa7b4;--accent:#4ea1ff;--current:#2ea043;--older:#b08800;--line:#2a333d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .stage{display:flex;height:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}
  .sidebar{flex:0 0 340px;height:100%;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--bg)}
  .sidebar header{flex:0 0 auto;padding:14px 16px;border-bottom:2px solid var(--line)}
  .sidebar h1{font-size:15px;margin:0 0 6px}
  .legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .dot.cur{background:var(--current)}
  .dot.old{background:var(--older)}
  .list{flex:1 1 auto;overflow-y:auto;padding:10px 12px}
  .group-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    margin:14px 4px 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .group-title:first-child{margin-top:2px}
  .row{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:7px;padding:9px 10px;margin:0 0 8px;cursor:pointer;transition:background .15s}
  .row:hover{background:#212a33}
  .row.cur{border-left-color:var(--current)}
  .row.old{border-left-color:var(--older)}
  .row .rloc{font-weight:700;font-size:13px}
  .row .rhead{font-size:12.5px;margin-top:2px}
  .row .rmeta{color:var(--muted);font-size:11px;margin-top:3px}
  .leaflet-popup-content{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:230px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#1a6fd6}
  .tooltip-card{font:12.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:240px}
  .tooltip-card b{font-size:13.5px;display:block;margin-bottom:2px}
  .tooltip-card .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;padding:1px 6px;border-radius:10px;margin-bottom:4px}
  .tooltip-card .badge.cur{background:#2ea043;color:#02160a}
  .tooltip-card .badge.old{background:#b08800;color:#1a1400}
  .tooltip-card .tloc{color:#666;font-size:11.5px;margin:2px 0}
  .tooltip-card .tsrc{color:#777;font-size:11px;margin-top:3px}
  @media (max-width:820px){
    .stage{flex-direction:column}
    #map{flex:0 0 55vh}
    .sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>

  <div id="map"></div>
  <aside class="sidebar">

      <h1>Data Center Community Response — July 23, 2026</h1>

        <span><span class="dot old"></span> Older / Background</span>
      </div>
    </header>
    <div class="list" id="list"></div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  var map = L.map('map').setView([39.5, -96.0], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
  }).addTo(map);

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var markers = [];
  sites.forEach(function(s, i){
    var color = s.current ? '#2ea043' : '#b08800';
    var badge = s.current ? 'CURRENT' : 'OLDER';
    var badgeClass = s.current ? 'cur' : 'old';
    var m = L.circleMarker([s.lat, s.lon], {
      radius: 9, color: color, fillColor: color, fillOpacity: 0.85, weight: 2
    }).addTo(map);

    var tooltipHtml = '<div class="tooltip-card">' +
      '<span class="badge ' + badgeClass + '">' + badge + '</span>' +
      '<b>' + escapeHtml(s.loc) + '</b>' +
      '<div>' + escapeHtml(s.headline) + '</div>' +
      '<div class="tloc">' + escapeHtml(s.loc) + '</div>' +
      '<div>' + escapeHtml(s.desc) + '</div>' +
      '<div class="tsrc">' + escapeHtml(s.source) + ' · ' + escapeHtml(s.date) + '</div>' +
      '</div>';
    m.bindTooltip(tooltipHtml, {direction:'top', offset:[0,-6]});

    var popupHtml = '<b>' + escapeHtml(s.loc) + '</b><br>' +
      '<span class="badge ' + badgeClass + '" style="display:inline-block;font-size:10px;font-weight:700;' +
      'text-transform:uppercase;padding:1px 6px;border-radius:10px;margin:4px 0;background:' + color +
      ';color:' + (s.current ? '#02160a' : '#1a1400') + '">' + badge + '</span><br>' +
      escapeHtml(s.headline) + '<br>' +
      '<div style="margin:4px 0;color:#555">' + escapeHtml(s.desc) + '</div>' +
      '<div style="font-size:12px;color:#777;margin-bottom:4px">' + escapeHtml(s.source) + ' · ' + escapeHtml(s.date) + '</div>' +
      '<a href="' + s.url + '" target="_blank" rel="noopener">Read source →</a>';
    m.bindPopup(popupHtml);

    markers.push(m);
  });

  var listEl = document.getElementById('list');
  function renderGroup(title, items){
    var h = document.createElement('div');
    h.className = 'group-title';
    h.textContent = title;
    listEl.appendChild(h);
    items.forEach(function(idx){
      var s = sites[idx];
      var row = document.createElement('div');
      row.className = 'row ' + (s.current ? 'cur' : 'old');
      row.innerHTML = '<div class="rloc">' + escapeHtml(s.loc) + '</div>' +
        '<div class="rhead">' + escapeHtml(s.headline) + '</div>' +
        '<div class="rmeta">' + escapeHtml(s.source) + ' · ' + escapeHtml(s.date) + '</div>';
      row.addEventListener('click', function(){
        map.flyTo([s.lat, s.lon], 9, {duration: 0.9});
        markers[idx].openPopup();
      });
      listEl.appendChild(row);
    });
  }

  var curIdx = [], oldIdx = [];
  sites.forEach(function(s, i){ (s.current ? curIdx : oldIdx).push(i); });
  renderGroup('Past 24 Hours (Current)', curIdx);
  renderGroup('Older / Background', oldIdx);

  // Official meeting videos: none met the strict official-livestream/recording criterion
  // for this window, so none are plotted or listed as a video item.
</script>
</body>
