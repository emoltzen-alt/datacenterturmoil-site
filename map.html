<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Data Center Community Response — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f1419;--panel:#141b22;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;
        --accent:#4ea1ff;--current:#2ea043;--older:#d29922}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  .wrap{display:flex;height:100vh}
  #map{flex:1 1 auto;height:100%;min-width:0}
  .sidebar{flex:0 0 300px;display:flex;flex-direction:column;border-left:1px solid var(--line);
    background:var(--panel);overflow:hidden}
  .sidebar h1{font-size:14px;margin:0;padding:12px 14px 8px}
  .legend{padding:0 14px 10px;font-size:12px;color:var(--muted);display:flex;gap:14px;border-bottom:1px solid var(--line)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .dot.c{background:var(--current)}
  .dot.o{background:var(--older)}
  .list{flex:1 1 auto;overflow-y:auto;padding:6px 0}
  .group-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    padding:10px 14px 4px}
  .row{padding:8px 14px;cursor:pointer;border-left:3px solid transparent}
  .row:hover{background:rgba(255,255,255,.04)}
  .row.current{border-left-color:var(--current)}
  .row.older{border-left-color:var(--older)}
  .row .place{font-weight:600;font-size:13px}
  .row .headline{color:var(--muted);font-size:12px;margin-top:2px}
  .leaflet-popup-content{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#4ea1ff}
  .tt{font-size:12.5px;max-width:230px}
  .tt b{font-size:13.5px}
  .tt .badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    border-radius:3px;padding:1px 5px;margin-bottom:3px}
  .tt .badge.current{background:rgba(46,160,67,.25);color:#5fd97a}
  .tt .badge.older{background:rgba(210,153,34,.25);color:#e3b341}
  .tt .desc{color:#c9d1d9;margin:3px 0}
  .tt .src{color:#9aa7b4;font-size:11px}
  @media (max-width:820px){
    .wrap{flex-direction:column}
    #map{flex:0 0 55vh}
    .sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="map"></div>
  <div class="sidebar">
    <h1>Data Center Community Response</h1>
    <div class="legend">
      <span><span class="dot c"></span>Current (24h)</span>
      <span><span class="dot o"></span>Older / Background</span>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

var map = L.map('map', {zoomControl:true}).setView([39.5, -96.0], 4.4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

var markers = {};
sites.forEach(function(s, i){
  var color = s.status === 'current' ? '#2ea043' : '#d29922';
  var marker = L.circleMarker([s.lat, s.lon], {
    radius: s.status === 'current' ? 9 : 7,
    color: color, fillColor: color, fillOpacity: 0.85, weight: 2
  }).addTo(map);

  var badge = s.status === 'current'
    ? '<span class="badge current">Current</span>'
    : '<span class="badge older">Older</span>';

  marker.bindTooltip(
    '<div class="tt">' + badge + '<br><b>' + s.place + '</b>' +
    '<div class="desc">' + s.headline + '</div>' +
    '<div class="desc" style="color:#9aa7b4">' + s.desc + '</div>' +
    '<div class="src">' + s.source + ' &middot; ' + s.date + '</div></div>',
    {sticky:true, direction:'top', offset:[0,-6]}
  );

  marker.bindPopup(
    '<b>' + s.place + '</b><br>' + s.headline + '<br>' +
    '<span style="color:#9aa7b4">' + s.desc + '</span><br>' +
    '<span style="color:#9aa7b4">' + s.source + ' &middot; ' + s.date + '</span><br>' +
    '<a href="' + s.url + '" target="_blank" rel="noopener">Read source →</a>'
  );

  markers[i] = marker;
});

var list = document.getElementById('list');
var currentItems = sites.map(function(s,i){return {s:s,i:i};}).filter(function(o){return o.s.status==='current';});
var olderItems = sites.map(function(s,i){return {s:s,i:i};}).filter(function(o){return o.s.status==='older';});

function renderGroup(title, items){
  var h = document.createElement('div');
  h.className = 'group-label';
  h.textContent = title;
  list.appendChild(h);
  items.forEach(function(o){
    var row = document.createElement('div');
    row.className = 'row ' + o.s.status;
    row.innerHTML = '<div class="place">' + o.s.place + '</div><div class="headline">' + o.s.headline + '</div>';
    row.addEventListener('click', function(){
      map.flyTo([o.s.lat, o.s.lon], 7, {duration:0.6});
      markers[o.i].openPopup();
    });
    list.appendChild(row);
  });
}

renderGroup('Past 24 Hours (Current)', currentItems);
renderGroup('Older / Background', olderItems);
</script>
</body>
</html>
