<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f1419;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;--current:#2ea043;--older:#d29922}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  #app{display:flex;height:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}
  #sidebar{flex:0 0 320px;height:100%;overflow-y:auto;border-left:1px solid var(--line);background:#121820}
  .sb-head{position:sticky;top:0;background:#121820;padding:12px 14px;border-bottom:1px solid var(--line);z-index:5}
  .sb-head h2{margin:0 0 4px 0;font-size:14px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .swatch{width:10px;height:10px;border-radius:50%;display:inline-block}
  .grp-title{padding:10px 14px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .row{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:#182130}
  .row .loc{font-weight:600;font-size:13px}
  .row .headline{color:var(--muted);font-size:12.5px;margin-top:2px}
  .row .meta{color:#6d7a87;font-size:11px;margin-top:4px}
  .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600;margin-right:6px}
  .badge.current{background:rgba(46,160,67,.18);color:#3fb950}
  .badge.older{background:rgba(210,153,34,.18);color:#d29922}
  .tt{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .tt b{font-size:13.5px}
  .tt .tbadge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700;margin-bottom:4px}
  .leaflet-popup-content-wrapper{background:#182130;color:var(--ink)}
  .leaflet-popup-tip{background:#182130}
  .leaflet-popup-content{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .leaflet-popup-content a{color:#4ea1ff}
  @media (max-width:820px){
    #app{flex-direction:column}
    #map{flex:0 0 55vh}
    #sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>

var map = L.map('map').setView([39.5, -96.0], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

var listEl = document.getElementById('list');
var markers = [];

function badgeHtml(cur){
  return cur ? '<span class="badge current">CURRENT</span>' : '<span class="badge older">OLDER</span>';
}

function buildTooltip(it){
  return '<div class="tt"><span class="tbadge" style="background:'+(it.current?'rgba(46,160,67,.25);color:#3fb950':'rgba(210,153,34,.25);color:#d29922')+'">'+(it.current?'CURRENT':'OLDER')+'</span>'
    + '<br><b>'+it.loc+'</b>'+(it.isVideo?' 🎥':'')+'<br>'+it.headline
    + '<br><span style="color:#9aa7b4">'+it.desc+'</span>'
    + '<br><span style="color:#6d7a87">'+it.source+' · '+it.date+'</span></div>';
}

function buildPopup(it){
  return '<b>'+it.loc+'</b> '+(it.current?'<span style="color:#3fb950">(current)</span>':'<span style="color:#d29922">(older)</span>')
    + '<br>'+it.headline
    + '<br>'+it.desc
    + '<br>'+it.source+' · '+it.date
    + '<br><a href="'+it.url+'" target="_blank" rel="noopener">Open source →</a>';
}

items.forEach(function(it, idx){
  var color = it.current ? '#2ea043' : '#d29922';
  var marker = L.circleMarker([it.lat, it.lng], {
    radius: 9, color: color, fillColor: color, fillOpacity: 0.85, weight: 2
  }).addTo(map);
  marker.bindTooltip(buildTooltip(it), {direction:'top', sticky:true, opacity:0.97});
  marker.bindPopup(buildPopup(it));
  markers.push(marker);
});

function renderGroup(title, filterFn){
  var groupItems = [];
  items.forEach(function(it, idx){ if (filterFn(it)) groupItems.push(idx); });
  if (!groupItems.length) return;
  var h = document.createElement('div');
  h.className = 'grp-title';
  h.textContent = title;
  listEl.appendChild(h);
  groupItems.forEach(function(idx){
    var it = items[idx];
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = (it.current?badgeHtml(true):badgeHtml(false))
      + (it.isVideo ? '<span class="badge older" style="background:rgba(78,161,255,.18);color:#4ea1ff">VIDEO</span>' : '')
      + '<div class="loc">'+it.loc+'</div>'
      + '<div class="headline">'+it.headline+'</div>'
      + '<div class="meta">'+it.source+' · '+it.date+'</div>';
    row.addEventListener('click', function(){
      map.flyTo([it.lat, it.lng], 8, {duration: 0.8});
      markers[idx].openPopup();
    });
    listEl.appendChild(row);
  });
}

renderGroup('Past 24 Hours (Current)', function(it){ return it.current; });
renderGroup('Older / Background', function(it){ return !it.current; });
