<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#0f1419;--panel:#151b22;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;
    --accent:#4ea1ff;--current:#2ea043;--older:#d29922;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{display:flex;height:100vh;width:100vw;overflow:hidden}
  #map{flex:1 1 auto;height:100%;min-width:0;background:#000}

  .sidebar{flex:0 0 340px;height:100%;display:flex;flex-direction:column;
    border-left:1px solid var(--line);background:var(--panel);overflow:hidden}
  .sidebar header{flex:0 0 auto;padding:14px 16px;border-bottom:1px solid var(--line)}
  .sidebar header h1{font-size:15px;margin:0 0 4px}
  .sidebar header .win{font-size:11.5px;color:var(--muted)}
  .legend{flex:0 0 auto;display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:10px;height:10px;border-radius:50%;display:inline-block}
  .swatch.current{background:var(--current)}
  .swatch.older{background:var(--older)}

  .lists{flex:1 1 auto;overflow-y:auto;padding:6px 0 20px}
  .group-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    padding:12px 16px 6px}
  .row{padding:9px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
  .row:hover{background:rgba(255,255,255,.04)}
  .row .place{font-weight:700;font-size:13px}
  .row .headline{font-size:12.3px;color:#c7d0d9;margin-top:2px}
  .row .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .row .dot.current{background:var(--current)}
  .row .dot.older{background:var(--older)}

  .leaflet-popup-content{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#4ea1ff}
  .tt{font:12.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:230px}
  .tt .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:1px 6px;border-radius:8px;margin-bottom:4px;display:inline-block}
  .tt .badge.current{background:rgba(46,160,67,.2);color:#2ea043}
  .tt .badge.older{background:rgba(210,153,34,.2);color:#d29922}
  .tt .place{font-weight:700;margin:2px 0}
  .tt .headline{margin:2px 0}
  .tt .meta{color:#9aa7b4;font-size:11px;margin-top:3px}

  @media (max-width:820px){
    .wrap{flex-direction:column}
    #map{flex:0 0 55vh}
    .sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="map"></div>
  <aside class="sidebar">
    <header>
      <h1>Data Center Community Response</h1>
      <div class="win">24h window: Sept 20–21, 2026 · click a row to fly to it</div>
    </header>
    <div class="legend">
      <span><span class="swatch current"></span>Past 24 hours (current)</span>
      <span><span class="swatch older"></span>Older / background</span>
    </div>
    <div class="lists" id="lists"></div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var sites = [
    // CURRENT — past 24 hours
    {place:"Aurora, CO", lat:39.7294, lng:-104.8319, status:"current",
     headline:"Colorado's largest data center could rise next to homes — without a public hearing",
     desc:"Vantage Data Centers' proposed 143-acre “Trident” data center sits in an industrial zone that allows administrative approval with no planning-commission or council hearing; neighbors say they learned of it only through news reporting.",
     source:"Colorado Newsline", date:"Sept 21, 2026",
     url:"https://coloradonewsline.com/2026/09/21/colorado-largest-data-center/"},
    {place:"Towson, MD (Baltimore County)", lat:39.4015, lng:-76.6019, status:"current",
     headline:"County council votes on extending data center moratorium",
     desc:"The council is divided over extending the county's data-center construction pause to December 2027; the Planning Board's regulatory study isn't due until Oct. 1.",
     source:"WMAR-2 News / WYPR", date:"Sept 21, 2026",
     url:"https://www.wmar2news.com/news/region/baltimore-county/baltimore-county-council-preparing-for-data-center-moratorium-vote"},
    {place:"Ypsilanti Township, MI", lat:42.2411, lng:-83.6130, status:"current",
     headline:"Rep. Dingell calls for pause on U-M/Los Alamos supercomputing project",
     desc:"U.S. Rep. Debbie Dingell urged a halt to U-M's $1.25B supercomputing data center partnership with Los Alamos National Laboratory, citing insufficient transparency, and requested an environmental review of the site.",
     source:"Planet Detroit / Michigan Advance", date:"Sept 19–21, 2026",
     url:"https://planetdetroit.org/2026/09/data-center-news-dingell-um-ypsilanti/"},
    {place:"Dowagiac, MI", lat:41.9836, lng:-86.1105, status:"current",
     headline:"Residents continue to speak out against data center noise",
     desc:"Neighbors of the Hyperscale Data Inc. facility continue to report round-the-clock cooling-fan noise as high as 78 decibels; the dispute is the subject of an active class-action lawsuit.",
     source:"Detroit News", date:"Sept 21, 2026",
     url:"https://www.detroitnews.com/picture-gallery/news/michigan/2026/09/21/dowagiac-residents-speak-out-against-data-center/91791837007/"},

    // OLDER / BACKGROUND
    {place:"Walnut Cove, NC (Stokes County)", lat:36.2965, lng:-80.1442, status:"older",
     headline:"Commissioners re-approve massive “Project Delta” data center rezoning",
     desc:"Commissioners voted 3-2 — the same split as a January vote later voided by legal challenge — to rezone ~1,800 acres of farmland for a hyperscale data center; another lawsuit is expected.",
     source:"WFDD / WUNC", date:"Sept 14, 2026",
     url:"https://www.wfdd.org/politics-government/2026-09-14/stokes-county-votes-clear-the-way-for-massive-controversial-data-center-in-walnut-cove"},
    {place:"Union, MO (Franklin County)", lat:38.4506, lng:-91.0068, status:"older",
     headline:"Commissioners approve two data center rezonings amid uproar",
     desc:"After a 13-hour hearing, commissioners approved rezoning for the Diamond Farm and Crooked Creek Farm data center projects; residents shouted at commissioners and police escorted officials from the room.",
     source:"KSDK / First Alert 4", date:"Sept 15–16, 2026",
     url:"https://www.ksdk.com/article/news/politics/franklin-county-residents-in-an-uproar-after-commissioners-vote-to-approve-data-center-developments-at-tuesdays-meeting/63-e5c824ff-619b-4bcf-840c-b15501c06e11"},
    {place:"Manassas, VA (Prince William County)", lat:38.7509, lng:-77.4753, status:"older",
     headline:"Board of Supervisors set to vote on ending by-right data center approvals",
     desc:"A public hearing scheduled for Sept. 22 would end the county's policy of allowing data centers to be approved administratively without elected-official review.",
     source:"WJLA", date:"Sept 2026",
     url:"https://wjla.com/news/local/prince-william-county-data-centers-by-right-development-board-supervisors-deshundra-jefferson-virginia-zoning-approval-energy-power-tax-revenue-tuesday-vote"},
    {place:"Woodbury, MN", lat:44.9239, lng:-92.9594, status:"older",
     headline:"City weighs one-year data center moratorium",
     desc:"A draft interim ordinance pausing new data centers and expansions is headed to city council for a vote on Sept. 23, following resident concerns about power and water demand.",
     source:"Local reporting", date:"Sept 2026", url:""},
    {place:"Scranton, PA (Lackawanna County)", lat:41.4090, lng:-75.6624, status:"older",
     headline:"Commissioners hire firm to study health, environmental impact of data centers",
     desc:"After a health-study proposal roiled a commissioners meeting amid a pending buildout of 13 proposed data centers countywide, the county hired a consultant to study impacts.",
     source:"WVIA", date:"Sept 16, 2026",
     url:"https://www.wvia.org/news/local/2026-09-16/lackawanna-county-commissioners-hire-firm-to-study-environmental-and-health-impacts-of-data-centers-and-power-plants"},
    {place:"Stowe Township, PA (Allegheny County)", lat:40.4732, lng:-80.0967, status:"older",
     headline:"Community raises concerns over former railcar plant data center proposal",
     desc:"SunCap Industries pitched converting a former railcar plant into a data center; commissioners and residents questioned power draw and the transparency of the ordinance-change process.",
     source:"WPXI", date:"2026",
     url:"https://www.wpxi.com/news/local/stowe-township-community-expresses-concerns-over-data-center-proposal/F3UN7MXY3RD2DMMTPZDZR6VVXM/"},
    {place:"Washington, NC (Beaufort County)", lat:35.5465, lng:-77.0553, status:"older",
     headline:"Moratorium hearing postponed to Oct. 5",
     desc:"Officials delayed the public hearing and vote on a proposed one-year data-center moratorium to give residents more time to weigh in.",
     source:"WITN", date:"Sept 13, 2026",
     url:"https://www.witn.com/2026/09/13/beaufort-county-data-center-moratorium-hearing-postponed-officials-say/"},
    {place:"Leesburg, VA (Loudoun County)", lat:39.1157, lng:-77.5636, status:"older",
     headline:"Data center noise and fumes flood county with complaints",
     desc:"Residents near Sterling-area data centers describe a constant low-pitched rumble, a high-frequency whine, and fumes; the county has paused some new applications.",
     source:"WJLA / NBC4 Washington", date:"Sept 2026",
     url:"https://wjla.com/news/local/data-center-noise-fumes-create-flood-of-complaints-in-loudoun-county-virginia-board-of-supervisors-sterling"},
    {place:"Independence, MO", lat:39.0911, lng:-94.4155, status:"older",
     headline:"Residents sue city over blocked data center referendum",
     desc:"“Stop the AI Data Center in Independence” sued the city a week after the council approved a tax-incentive package for a proposed Nebius data center.",
     source:"Wire report", date:"2026",
     url:"https://www.aol.com/articles/citizens-file-lawsuit-against-city-212039730.html"},
    {place:"Inver Grove Heights, MN", lat:44.8480, lng:-93.0430, status:"older",
     headline:"City faces lawsuit after passing data center moratorium",
     desc:"The council passed a one-year moratorium on data center construction; the developer threatened, then filed, suit seeking tens of millions in damages.",
     source:"FOX 9 / CBS Minnesota", date:"June–Sept 2026",
     url:"https://www.fox9.com/news/inver-grove-heights-data-center-moratorium-june-26-2026"},
    {place:"Portland, OR", lat:45.5152, lng:-122.6784, status:"older",
     headline:"City council to vote on banning secret NDAs with data center developers",
     desc:"A resolution would bar officials from signing non-disclosure agreements covering potential data center projects, responding to concerns about secrecy in deal-making.",
     source:"KPTV", date:"Sept 14, 2026",
     url:"https://www.kptv.com/2026/09/14/portland-council-vote-ban-secret-ndas-with-data-center-developers/"},
    {place:"Mona, UT (Juab County)", lat:39.8137, lng:-111.8577, status:"older",
     headline:"Residents say $10B data center was waved through after a four-minute hearing",
     desc:"Juab County residents are demanding to know how the project cleared local approval with what they describe as minimal public input.",
     source:"Hoodline", date:"Sept 2026",
     url:"https://hoodline.com/2026/09/mona-residents-say-four-minute-hearing-waved-through-10b-data-center/"},
    {place:"South Whitehall Township, PA", lat:40.6198, lng:-75.5391, status:"older",
     headline:"Residents demand public hearing on hyperscale data center proposal",
     desc:"Hundreds have turned out to community meetings demanding officials hold a formal public hearing before signing off on the project.",
     source:"Hoodline", date:"Sept 2026",
     url:"https://hoodline.com/2026/09/south-whitehall-data-center-fight-grows-as-residents-demand-public-hearing/"},
    {place:"Spokane, WA (Spokane County)", lat:47.6588, lng:-117.4260, status:"older",
     headline:"County commission hearing on West Plains data center descends into pandemonium — again",
     desc:"Speakers repeatedly raised concerns about potential PFAS and other chemical contamination tied to a proposed data center from a company with little public development history.",
     source:"The Spokesman-Review", date:"Sept 15, 2026",
     url:"https://www.spokesman.com/stories/2026/sep/15/spokane-county-commission-meeting-site-of-public-h/"},
    {place:"Pahrump, NV", lat:36.2083, lng:-115.9839, status:"older",
     headline:"Residents protest proposed AI data center over water, utility concerns",
     desc:"Part of a nationwide day of action (142 protests across 42 states); residents cited fears the project would drain the desert community's limited water supply and drive up utility costs.",
     source:"FOX5 Vegas", date:"Jul 20, 2026",
     url:"https://www.fox5vegas.com/2026/07/20/pahrump-residents-protest-proposed-ai-data-center-citing-water-utility-concerns/"}
  ];

  var map = L.map('map', {scrollWheelZoom:true}).setView([39.5, -96.0], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
  }).addTo(map);

  var colors = {current:'#2ea043', older:'#d29922'};
  var markers = [];

  sites.forEach(function(s, i){
    var m = L.circleMarker([s.lat, s.lng], {
      radius: 9, color: colors[s.status], fillColor: colors[s.status], fillOpacity: 0.85, weight: 2
    }).addTo(map);

    var badgeLabel = s.status === 'current' ? 'CURRENT' : 'OLDER';
    var tooltipHtml = '<div class="tt"><span class="badge ' + s.status + '">' + badgeLabel + '</span>' +
      '<div class="place">' + s.place + '</div>' +
      '<div class="headline">' + s.headline + '</div>' +
      '<div class="meta">' + s.desc + '</div>' +
      '<div class="meta">' + s.source + ' · ' + s.date + '</div></div>';
    m.bindTooltip(tooltipHtml, {sticky:true, direction:'top'});

    var linkHtml = s.url ? '<a href="' + s.url + '" target="_blank" rel="noopener">Read source ↗</a>' : '<span style="color:#9aa7b4">No link available</span>';
    var popupHtml = '<b>' + s.place + '</b><br>' + s.headline + '<br><br>' + s.desc + '<br><br>' +
      '<span style="color:#9aa7b4">' + s.source + ' · ' + s.date + '</span><br>' + linkHtml;
    m.bindPopup(popupHtml);

    markers.push(m);
  });

  function flyToSite(i){
    var s = sites[i];
    map.flyTo([s.lat, s.lng], 9, {duration: 0.8});
    markers[i].openPopup();
  }

  var lists = document.getElementById('lists');
  function renderGroup(label, status){
    var groupLabel = document.createElement('div');
    groupLabel.className = 'group-label';
    groupLabel.textContent = label;
    lists.appendChild(groupLabel);
    sites.forEach(function(s, i){
      if (s.status !== status) return;
      var row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span class="dot ' + s.status + '"></span><span class="place">' + s.place + '</span>' +
        '<div class="headline">' + s.headline + '</div>';
      row.addEventListener('click', function(){ flyToSite(i); });
      lists.appendChild(row);
    });
  }
  renderGroup('Past 24 Hours (Current)', 'current');
  renderGroup('Older / Background', 'older');
</script>
</body>
</html>
