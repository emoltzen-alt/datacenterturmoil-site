<style>html,body{margin:0;height:100%;background:#0f1218;color:#e6e8ec;font:14px system-ui,sans-serif}#w{display:flex;height:100%}#s{width:340px;overflow:auto;padding:12px;box-sizing:border-box;background:#151a22}#map{flex:1}

<script>

const map=L.map('map').setView([38.5,-96],4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:18}).addTo(map);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=D.map(x=>{const col=x.cur?'#2ecc71':'#f5a623';
const m=L.circleMarker([x.lat,x.lng],{radius:9,color:'#fff',weight:1,fillColor:col,fillOpacity:.9}).addTo(map);
m.bindTooltip(`<b>${esc(x.place)}</b> <span class="b ${x.cur?'C':'O'}">${x.cur?'CURRENT':'OLDER'}</span><br>${esc(x.headline)}<br>${esc(x.desc)}<br><i>${esc(x.source)}, ${x.date}</i>`,{maxWidth:300});
m.bindPopup(`<b>${esc(x.headline)}</b><br>${esc(x.place)}<br><a href="${x.url}" target="_blank" rel="noopener">${esc(x.source)} (${x.date})</a>`);return m;});
const l=document.getElementById('lst');
[[true,'Past 24 Hours (Current)'],[false,'Older / Background']].forEach(([c,t])=>{l.insertAdjacentHTML('beforeend','<h3>'+t+'</h3>');
D.forEach((x,i)=>{if(x.cur!==c)return;const d=document.createElement('div');d.className='r';d.innerHTML=`<span class="b ${c?'C':'O'}">${c?'CURRENT':'OLDER'}</span> <b>${esc(x.place)}</b><br>${esc(x.headline)}`;d.onclick=()=>{map.flyTo([x.lat,x.lng],7);mk[i].openPopup();};l.appendChild(d);});});
</script></body></html>
