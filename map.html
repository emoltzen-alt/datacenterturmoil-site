<style>

  #app{display:flex;height:100%;width:100%}
  #map{flex:1;height:100%}
  #sidebar{width:340px;min-width:280px;height:100%;overflow-y:auto;background:#151b22;border-left:1px solid #2a333d;box-sizing:border-box}
  #sidebar h1{font-size:15px;margin:0;padding:14px 16px 10px;border-bottom:1px solid #2a333d}
  #sidebar .sub{color:#9aa7b4;font-size:12px;padding:0 16px 12px;border-bottom:1px solid #2a333d}
  #legend{display:flex;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid #2a333d;font-size:12px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .dot.cur{background:#2ea043}
  .dot.old{background:#b08800}
  #sidebar h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#9aa7b4;margin:0;padding:12px 16px 6px}
  .row{padding:9px 16px;border-bottom:1px solid #212932;cursor:pointer}
  .row:hover{background:#1c242d}
  .row .loc{font-weight:700;font-size:13px}
  .row .headline{font-size:12.5px;color:#c7d0d9;margin-top:2px}
  .row .meta{font-size:11px;color:#9aa7b4;margin-top:3px}
  .tooltip-card{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:260px}
  .tooltip-card b{font-size:14px}
  .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:20px;margin-left:6px}
  .badge.cur{background:#2ea043;color:#02160a}
  .badge.old{background:#b08800;color:#1a1400}
  .leaflet-popup-content{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:260px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#4ea1ff}
  @media (max-width:700px){
    #app{flex-direction:column}
    #sidebar{width:100%;height:40%;order:2;border-left:none;border-top:1px solid #2a333d}
    #map{height:60%}
  }
</style>
</head>

var map = L.map('map', {scrollWheelZoom:true}).setView([39.5, -96.0], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

var markers = {};
function colorFor(s){ return s === 'current' ? '#2ea043' : '#b08800'; }

sites.forEach(function(s, i){
  var m = L.circleMarker([s.lat, s.lng], {
    radius: 9, color: colorFor(s.status), fillColor: colorFor(s.status), fillOpacity: 0.85, weight: 2
  }).addTo(map);

  var badgeClass = s.status === 'current' ? 'cur' : 'old';
  var badgeText = s.status === 'current' ? 'CURRENT' : 'OLDER';
  var tooltipHtml = '<div class="tooltip-card"><b>'+s.loc+'</b> <span class="badge '+badgeClass+'">'+badgeText+'</span>'+
    '<div style="margin-top:4px">'+s.headline+'</div>'+
    '<div style="margin-top:4px;color:#9aa7b4">'+s.desc+'</div>'+
    '<div style="margin-top:4px;color:#9aa7b4;font-size:11px">'+s.source+' · '+s.date+'</div></div>';
  m.bindTooltip(tooltipHtml, {sticky:true, direction:'top'});

  var popupHtml = '<b>'+s.loc+'</b> <span class="badge '+badgeClass+'">'+badgeText+'</span><br>'+
    s.headline+'<br><span style="color:#9aa7b4">'+s.desc+'</span><br>'+
    '<span style="color:#9aa7b4;font-size:11px">'+s.source+' · '+s.date+'</span><br>'+
    (s.url ? '<a href="'+s.url+'" target="_blank" rel="noopener">Source link</a>' : '<i>No source link available</i>');
  m.bindPopup(popupHtml);

  markers[i] = m;
});

function buildList(containerId, status){
  var container = document.getElementById(containerId);
  sites.forEach(function(s, i){
    if (s.status !== status) return;
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<div class="loc">'+s.loc+'</div>'+
      '<div class="headline">'+s.headline+'</div>'+
      '<div class="meta">'+s.source+' · '+s.date+'</div>';
    row.addEventListener('click', function(){
      map.flyTo([s.lat, s.lng], 9, {duration: 0.8});
      markers[i].openPopup();
    });
    container.appendChild(row);
  });
}
buildList('list-current', 'current');
buildList('list-older', 'older');

</body>
</html>
