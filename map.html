<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map (last 24 hours)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#0f1419; --card:#1a2129; --ink:#e6edf3; --muted:#9aa7b4;
    --accent:#4ea1ff; --current:#2ea043; --older:#b08800; --line:#2a333d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);}
  #app{display:flex;height:100%;width:100%}
  #sidebar{width:340px;min-width:340px;height:100%;overflow-y:auto;background:var(--bg);
    border-right:1px solid var(--line);padding:16px;box-sizing:border-box}
  #sidebar h1{font-size:16px;margin:0 0 4px}
  #sidebar .sub{color:var(--muted);font-size:12px;margin:0 0 14px}
  #map-wrap{flex:1;position:relative;height:100%}
  #map{height:100%;width:100%}
  .legend{position:absolute;bottom:16px;right:16px;z-index:500;background:rgba(26,33,41,.92);
    border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--ink)}
  .legend .row{display:flex;align-items:center;gap:8px;margin:4px 0}
  .legend .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
  .dot.cur{background:var(--current)}
  .dot.old{background:var(--older)}
  h2.grp{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
  h2.grp:first-of-type{margin-top:0}
  .row-item{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:6px;padding:8px 10px;margin:0 0 8px;cursor:pointer;transition:background .15s}
  .row-item:hover{background:#212a33}
  .row-item.cur{border-left-color:var(--current)}
  .row-item.old{border-left-color:var(--older)}
  .row-item .loc{font-weight:700;font-size:13px}
  .row-item .headline{font-size:12px;margin:2px 0 4px;color:var(--ink)}
  .row-item .meta{font-size:11px;color:var(--muted)}
  .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:1px 6px;border-radius:20px;color:#06120a;margin-right:6px;display:inline-block}
  .badge.cur{background:var(--current);color:#02160a}
  .badge.old{background:var(--older);color:#1a1400}
  .note{color:var(--muted);font-size:11px;font-style:italic;background:var(--card);
    border:1px dashed var(--line);border-radius:6px;padding:8px 10px;margin:8px 0 14px}
  a{color:var(--accent)}
  .leaflet-popup-content{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#111}
  .leaflet-popup-content b{font-size:14px}
  .tt{font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#111;max-width:220px}
  .tt b{font-size:13px;display:block;margin-bottom:2px}
  .tt .tbadge{font-size:9px;font-weight:700;text-transform:uppercase;padding:1px 5px;border-radius:10px;color:#06120a;display:inline-block;margin-bottom:3px}
  .tt .tbadge.cur{background:#2ea043;color:#02160a}
  .tt .tbadge.old{background:#b08800;color:#1a1400}
  @media (max-width:720px){
    #app{flex-direction:column}
    #sidebar{width:100%;min-width:0;height:40%;border-right:none;border-bottom:1px solid var(--line)}
    #map-wrap{height:60%}
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Data Center Community Response</h1>
    <div class="sub">Generated Tuesday, July 21, 2026 &middot; window: prior 24 hours (&approx; July 20&ndash;21, 2026), with older context. Click a row to fly to its pin. <a href="report.html">Full report &rarr;</a></div>
    <div id="list-cur"></div>
    <div id="list-old"></div>
  </div>
  <div id="map-wrap">
    <div id="map"></div>
    <div class="legend">
      <div class="row"><span class="dot cur"></span> Current (past 24h)</div>
      <div class="row"><span class="dot old"></span> Older / background</div>
    </div>
  </div>
</div>

    {loc:"Botetourt County, VA", lat:37.4948, lng:-79.8850, status:"older",
     headline:"Residents rally against Google data center in national protest day",
     desc:"Residents joined a national day of protest against a proposed Google data center, one of more than a dozen coordinated rallies nationwide.",
     source:"WSLS", date:"July 18, 2026",
     url:"https://www.wsls.com/news/local/2026/07/18/botetourt-county-residents-rally-against-google-data-center-amid-national-day-of-protest/"},
    {loc:"Festus, MO", lat:38.2181, lng:-90.3990, status:"older",
     headline:"Developer scales back project after sustained public opposition",
     desc:"Facing sustained resident pushback, a data-center developer agreed to reduce the scope of its Festus-area project.",

     url:"https://www.firstalert4.com/2026/07/01/festus-data-center-developer-scales-back-project-after-public-opposition/"}
  ];

  var map = L.map('map', {scrollWheelZoom:true}).setView([39.0, -95.0], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
  }).addTo(map);

  var markers = {};
  var COLORS = {current:'#2ea043', older:'#b08800'};

  sites.forEach(function(s, i){
    var color = COLORS[s.status];
    var marker = L.circleMarker([s.lat, s.lng], {
      radius: s.status === 'current' ? 9 : 7,
      color: color, fillColor: color, fillOpacity: 0.85, weight: 2
    }).addTo(map);

    var badgeClass = s.status === 'current' ? 'cur' : 'old';
    var badgeText = s.status === 'current' ? 'CURRENT' : 'OLDER';

    marker.bindTooltip(
      '<div class="tt"><span class="tbadge ' + badgeClass + '">' + badgeText + '</span>' +
      '<b>' + s.loc + '</b>' + s.headline + '<br><br>' + s.desc +
      '<br><br><em>' + s.source + ' &middot; ' + s.date + '</em></div>',
      {direction:'top', offset:[0,-6], sticky:false}
    );

    marker.bindPopup(
      '<b>' + s.loc + '</b><br>' + s.headline + '<br>' +
      '<span style="color:#555">' + s.source + ' &middot; ' + s.date + '</span><br>' +
      (s.url ? '<a href="' + s.url + '" target="_blank" rel="noopener">Read source &rarr;</a>' : '<em>No source link</em>')
    );

    markers[i] = marker;
  });

  function buildList(containerId, groupLabel, status){
    var container = document.getElementById(containerId);
    var heading = document.createElement('h2');
    heading.className = 'grp';
    heading.textContent = groupLabel;
    container.appendChild(heading);

    var items = sites.map(function(s,i){return {s:s,i:i};}).filter(function(o){return o.s.status===status;});
    items.forEach(function(o){
      var s = o.s, i = o.i;
      var row = document.createElement('div');
      row.className = 'row-item ' + (status === 'current' ? 'cur' : 'old');
      row.innerHTML =
        '<span class="badge ' + (status === 'current' ? 'cur' : 'old') + '">' + (status === 'current' ? 'Current' : 'Older') + '</span>' +
        '<span class="loc">' + s.loc + '</span>' +
        '<div class="headline">' + s.headline + '</div>' +
        '<div class="meta">' + s.source + ' &middot; ' + s.date + '</div>';
      row.addEventListener('click', function(){
        map.flyTo([s.lat, s.lng], 9, {duration: 0.8});
        markers[i].openPopup();
      });
      container.appendChild(row);
    });

    if (status === 'current') {
      var note = document.createElement('div');
      note.className = 'note';
      note.textContent = 'Official meeting videos: no official government-meeting livestream/recording could be confirmed for this 24-hour window at the required confidence level, so none are plotted or listed.';
      container.appendChild(note);
    }
  }

  buildList('list-cur', 'Past 24 Hours (Current)', 'current');
  buildList('list-old', 'Older / Background', 'older');
</script>
</body>
</html>
