  .dot.amber { background: var(--accent-amber); }

    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s;

    display: flex;
    align-items: center;
    gap: 0.5rem;

  .row .row-top .dot { flex: none; }

    background: var(--bg-card);
    color: var(--text);
    border-radius: 8px;
  }
  .leaflet-popup-tip { background: var(--bg-card); }
  .popup h4 { margin: 0 0 0.3rem; font-size: 0.95rem; }
  .popup .badge {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    display: inline-block;
    margin-bottom: 0.35rem;
  }

  .badge.older { background: rgba(251,191,36,0.15); color: var(--accent-amber); }
  .popup p { margin: 0.3rem 0; font-size: 0.83rem; }
  .popup a { color: var(--link); font-size: 0.8rem; }
  .tooltip-card {

  maxZoom: 19

const markers = {};

function badgeHtml(item) {
  return item.current
    ? '<span class="badge current">Current</span>'
    : '<span class="badge older">Older</span>';
}

ITEMS.forEach(item => {
  const color = item.current ? '#34d399' : '#fbbf24';
  const marker = L.circleMarker([item.lat, item.lon], {
    radius: 8,
    fillColor: color,
    color: '#0b0e14',
    weight: 2,
    fillOpacity: 0.9
  }).addTo(map);

  const tooltipHtml = `
    <div class="tooltip-card">
      ${badgeHtml(item)}
      <h5>${item.place}</h5>
      <div class="loc">${item.location}</div>
      <div class="desc"><strong>${item.headline}</strong></div>
      <div class="desc">${item.desc}</div>
      <div class="src">${item.source} &middot; ${item.date}</div>
    </div>
  `;
  marker.bindTooltip(tooltipHtml, { direction: 'top', offset: [0, -6], opacity: 0.97 });

  const popupHtml = `
    <div class="popup">
      ${badgeHtml(item)}
      <h4>${item.place}</h4>
      <p><em>${item.location}</em></p>
      <p><strong>${item.headline}</strong></p>
      <p>${item.desc}</p>
      <p>${item.source} &middot; ${item.date}</p>
      <p><a href="${item.url}" target="_blank" rel="noopener">Read source →</a></p>
    </div>
  `;
  marker.bindPopup(popupHtml);

  markers[item.id] = marker;
});

function renderList() {
  const listEl = document.getElementById('list');
  const current = ITEMS.filter(i => i.current);
  const older = ITEMS.filter(i => !i.current);

  function rowsHtml(items) {
    return items.map(item => `
      <div class="row" data-id="${item.id}">
        <div class="row-top">
          <span class="dot ${item.current ? 'green' : 'amber'}"></span>
          <h4>${item.place}</h4>
        </div>
        <div class="row-meta">${item.headline}</div>
      </div>
    `).join('');
  }

  listEl.innerHTML = `
    <div class="group-title">Past 24 Hours (Current) — ${current.length}</div>
    ${rowsHtml(current)}
    <div class="group-title">Older / Background — ${older.length}</div>
    ${rowsHtml(older)}
  `;

  listEl.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', () => {
      const item = ITEMS.find(i => i.id === row.dataset.id);
      if (!item) return;
      map.flyTo([item.lat, item.lon], 9, { duration: 0.8 });
      markers[item.id].openPopup();
    });
  });
}

renderList();
</script>

</body>
</html>
