<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f1419;--panel:#161c24;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;
        --current:#2ea043;--older:#d29922;--link:#79c0ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink)}
  #app{display:flex;height:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}
  #sidebar{flex:0 0 340px;height:100%;overflow-y:auto;border-left:1px solid var(--line);
    background:var(--panel)}
  #sidebar .legend{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  #sidebar .legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
  #sidebar h4{margin:14px 14px 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted)}
  .row{margin:0 10px 8px;padding:8px 10px;border:1px solid var(--line);border-left-width:3px;
    border-radius:7px;cursor:pointer;background:#131920}
  .row:hover{background:#1b2330}
  .row.current{border-left-color:var(--current)}
  .row.older{border-left-color:var(--older)}
  .row .place{font-weight:600;font-size:13px}
  .row .headline{font-size:12px;color:#c9d3dc;margin-top:2px}
  .badge{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding:0 6px;border-radius:99px;
    border:1px solid;margin-left:6px;white-space:nowrap}
  .badge.current{color:var(--current);border-color:var(--current)}
  .badge.older{color:var(--older);border-color:var(--older)}
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink)}
  .leaflet-popup-tip{background:var(--panel)}
  .leaflet-popup-content{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    max-width:260px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:var(--link)}
  .tt{font:12.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:230px}
  .tt b{font-size:13px}
  .tt .badge{margin-left:0;margin-bottom:3px;display:inline-block}
  @media (max-width:820px){
    #app{flex-direction:column}
    #map{flex:0 0 55vh}
    #sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>

var COLORS = {current:"#2ea043", older:"#d29922"};

var map = L.map('map', {scrollWheelZoom:true}).setView([39.2, -95.5], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

var markers = {};

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

sites.forEach(function(s, i){
  var color = COLORS[s.status];
  var marker = L.circleMarker([s.lat, s.lon], {
    radius: 9, color: color, fillColor: color, fillOpacity: 0.85, weight: 2
  }).addTo(map);

  var badgeLabel = s.status === 'current' ? 'CURRENT' : 'OLDER';
  var tooltipHtml =
    '<div class="tt"><span class="badge ' + s.status + '">' + badgeLabel + '</span>' +
    '<br><b>' + escapeHtml(s.place) + '</b>' +
    '<div>' + escapeHtml(s.headline) + '</div>' +
    '<div style="color:#9aa7b4;margin-top:3px">' + escapeHtml(s.desc) + '</div>' +
    '<div style="color:#9aa7b4;margin-top:3px;font-size:11px">' + escapeHtml(s.source) + ' &middot; ' + escapeHtml(s.date) + '</div>' +
    '</div>';
  marker.bindTooltip(tooltipHtml, {direction:'top', offset:[0,-6], opacity:0.97, sticky:true});

  var popupHtml =
    '<b>' + escapeHtml(s.place) + '</b><br>' +
    escapeHtml(s.headline) + '<br>' +
    '<div style="margin:4px 0">' + escapeHtml(s.desc) + '</div>' +
    (s.url
      ? '<a href="' + s.url + '" target="_blank" rel="noopener">' + escapeHtml(s.source) + ' &middot; ' + escapeHtml(s.date) + '</a>'
      : escapeHtml(s.source) + ' &middot; ' + escapeHtml(s.date));
  marker.bindPopup(popupHtml);

  markers[i] = marker;
});

function buildRow(s, i){
  var row = document.createElement('div');
  row.className = 'row ' + s.status;
  row.innerHTML =
    '<div class="place">' + escapeHtml(s.place) +
    '<span class="badge ' + s.status + '">' + (s.status === 'current' ? 'Current' : 'Older') + '</span></div>' +
    '<div class="headline">' + escapeHtml(s.headline) + '</div>';
  row.addEventListener('click', function(){
    map.flyTo([s.lat, s.lon], 8, {duration: 0.8});
    markers[i].openPopup();
  });
  return row;
}

var listCurrent = document.getElementById('list-current');
var listOlder = document.getElementById('list-older');
sites.forEach(function(s, i){
  var row = buildRow(s, i);
  if (s.status === 'current') listCurrent.appendChild(row);
  else listOlder.appendChild(row);
});
</script>
