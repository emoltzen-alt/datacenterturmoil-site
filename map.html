<!DOCTYPE html>

<head>

<title>Data Center Community Response — Map, July 17, 2026</title>

<style>
  :root{--bg:#0f1419;--card:#1a2129;--ink:#e6edf3;--muted:#9aa7b4;--accent:#4ea1ff;
    --current:#2ea043;--older:#b08800;--line:#2a333d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  .app{display:flex;height:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}
  .sidebar{flex:0 0 340px;height:100%;display:flex;flex-direction:column;
    border-left:1px solid var(--line);background:var(--bg)}
  .sidebar header{flex:0 0 auto;padding:14px 16px;border-bottom:1px solid var(--line)}
  .sidebar h1{font-size:15px;margin:0 0 4px}
  .sidebar .sub{color:var(--muted);font-size:12px}
  .legend{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .sw.cur{background:var(--current)}
  .sw.old{background:var(--older)}
  .list{flex:1 1 auto;overflow-y:auto;padding:10px 12px}
  .group-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:14px 4px 8px;display:flex;align-items:center;gap:6px}
  .row{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:7px;padding:9px 11px;margin:0 0 8px;cursor:pointer;transition:background .15s}
  .row:hover{background:#212a33}
  .row.cur{border-left-color:var(--current)}
  .row.old{border-left-color:var(--older)}
  .row .rloc{font-weight:700;font-size:13px}
  .row .rhead{color:var(--ink);font-size:12.5px;margin-top:2px}
  .row .rmeta{color:var(--muted);font-size:11px;margin-top:4px}
  .leaflet-popup-content{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#1a73c7}
  .tt{font:12.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:230px}
  .tt b{display:block;font-size:13px;margin-bottom:2px}
  .tt .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
    padding:1px 6px;border-radius:10px;margin-bottom:4px}
  .tt .badge.cur{background:var(--current);color:#02160a}
  .tt .badge.old{background:var(--older);color:#1a1400}
  .tt .desc{margin:3px 0}
  .tt .meta{color:#666;font-size:11px}
  @media (max-width:820px){
    .app{flex-direction:column}
    #map{flex:0 0 55vh}
    .sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>

</div>

}).addTo(map);

var colors = {cur:'#2ea043', old:'#b08800'};
var markers = [];

sites.forEach(function(s, i){
  var m = L.circleMarker([s.lat, s.lng], {
    radius: s.status === 'cur' ? 9 : 7,
    color: colors[s.status], fillColor: colors[s.status],
    fillOpacity: 0.85, weight: 2
  }).addTo(map);

  var badgeLabel = s.status === 'cur' ? 'CURRENT' : 'OLDER';
  var tooltipHtml = '<div class="tt"><span class="badge ' + s.status + '">' + badgeLabel + '</span>' +
    '<b>' + s.headline + '</b>' +
    '<div class="desc">' + s.loc + '</div>' +
    '<div class="desc">' + s.desc + '</div>' +
    '<div class="meta">' + s.source + ' · ' + s.date + '</div></div>';
  m.bindTooltip(tooltipHtml, {direction:'top', offset:[0,-6]});

  var popupHtml = '<b>' + s.loc + '</b><br>' + s.headline + '<br>' +
    '<span style="color:#555">' + s.source + ' · ' + s.date + '</span><br>' +
    '<a href="' + s.url + '" target="_blank" rel="noopener">Read source →</a>';
  m.bindPopup(popupHtml);

  markers.push(m);
});

function renderList(){
  var list = document.getElementById('list');
  var cur = sites.map(function(s,i){return {s:s,i:i};}).filter(function(x){return x.s.status==='cur';});
  var old = sites.map(function(s,i){return {s:s,i:i};}).filter(function(x){return x.s.status==='old';});

  var html = '<div class="group-title"><span class="legend"><span class="sw cur"></span></span>Past 24 Hours (Current)</div>';
  cur.forEach(function(x){ html += rowHtml(x.s, x.i); });
  html += '<div class="group-title"><span class="legend"><span class="sw old"></span></span>Older / Background</div>';
  old.forEach(function(x){ html += rowHtml(x.s, x.i); });
  list.innerHTML = html;

  list.querySelectorAll('.row').forEach(function(row){
    row.addEventListener('click', function(){
      var idx = parseInt(row.getAttribute('data-idx'), 10);
      var s = sites[idx];
      map.flyTo([s.lat, s.lng], 9, {duration: 0.8});
      markers[idx].openPopup();
    });
  });
}

function rowHtml(s, i){
  return '<div class="row ' + s.status + '" data-idx="' + i + '">' +
    '<div class="rloc">' + s.loc + '</div>' +
    '<div class="rhead">' + s.headline + '</div>' +
    '<div class="rmeta">' + s.source + ' · ' + s.date + '</div></div>';
}

renderList();
</script>
