<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map (last 24 hours)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#0f1419; --card:#1a2129; --ink:#e6edf3; --muted:#9aa7b4;
    --accent:#4ea1ff; --current:#2ea043; --older:#b08800; --line:#2a333d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  #app{display:flex;height:100%;width:100%}
  #map{flex:1 1 auto;height:100%}
  #sidebar{
    width:340px;flex:0 0 340px;height:100%;overflow-y:auto;background:var(--card);
    border-right:1px solid var(--line);padding:16px 14px 40px;
  }
  #sidebar h1{font-size:16px;margin:0 0 4px}
  #sidebar .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  #sidebar h2{
    font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px;
  }
  .row{
    background:#161c23;border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:6px;padding:8px 10px;margin-bottom:7px;cursor:pointer;transition:background .15s;
  }
  .row:hover{background:#1f2731}
  .row.cur{border-left-color:var(--current)}
  .row.old{border-left-color:var(--older)}
  .row .loc{font-weight:700;font-size:13px}
  .row .hl{color:var(--muted);font-size:12px;margin-top:2px}
  .legend{
    position:absolute;bottom:20px;left:360px;z-index:1000;background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--ink);
  }
  .legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .dot.cur{background:var(--current)}
  .dot.old{background:var(--older)}
  .tt{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:230px}
  .tt b{font-size:14px}
  .tt .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:1px 6px;border-radius:10px;color:#06120a;margin-left:6px;vertical-align:middle}
  .tt .badge.cur{background:var(--current)}
  .tt .badge.old{background:var(--older);color:#1a1400}
  .tt .loc2{color:#555;font-size:12px}
  .tt .desc2{margin-top:4px}
  .tt .meta2{color:#555;font-size:11px;margin-top:4px}
  .leaflet-popup-content{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#1a6fd1;font-weight:600}
  @media (max-width:720px){
    #app{flex-direction:column}
    #sidebar{width:100%;flex:0 0 40%;order:2}
    #map{flex:1 1 60%;order:1}
    .legend{left:14px;bottom:auto;top:10px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Data Center Community Response</h1>
    <div class="sub">Coverage window: prior 24 hours (≈ Jul 29 – Jul 30, 2026), plus older background. Click a row to fly to its pin.</div>
    <h2>🟢 Past 24 Hours (Current)</h2>
    <div id="list-current"></div>
    <h2>🟡 Older / Background</h2>
    <div id="list-older"></div>
  </div>
  <div id="map"></div>
</div>
<div class="legend">
  <div><span class="dot cur"></span> Current (past 24h)</div>
  <div><span class="dot old"></span> Older / background</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

   url:"https://www.datacenterdynamics.com/en/news/chesapeake-city-council-rejects-land-rezoning-proposal-for-virginia-data-center/"}

var map = L.map('map', {scrollWheelZoom:true}).setView([39.0, -95.5], 4.4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

var listCurrent = document.getElementById('list-current');
var listOlder = document.getElementById('list-older');
var markers = {};

function colorFor(status){ return status === 'current' ? '#2ea043' : '#b08800'; }

sites.forEach(function(s, i){
  var col = colorFor(s.status);
  var marker = L.circleMarker([s.lat, s.lon], {
    radius: 9, color: col, fillColor: col, fillOpacity: 0.85, weight: 2
  }).addTo(map);

  var badgeClass = s.status === 'current' ? 'cur' : 'old';
  var badgeText = s.status === 'current' ? 'CURRENT' : 'OLDER';

  var tooltipHtml =
    '<div class="tt"><b>'+s.loc+'</b><span class="badge '+badgeClass+'">'+badgeText+'</span>' +
    '<div class="loc2">'+s.headline+'</div>' +
    '<div class="desc2">'+s.desc+'</div>' +
    '<div class="meta2">'+s.source+' &middot; '+s.date+'</div></div>';
  marker.bindTooltip(tooltipHtml, {direction:'top', offset:[0,-6]});

  var popupHtml =
    '<b>'+s.loc+'</b><br>'+s.headline+'<br>' +
    '<span style="color:#666">'+s.source+' &middot; '+s.date+'</span><br>' +
    '<a href="'+s.url+'" target="_blank" rel="noopener">Read source &rarr;</a>';
  marker.bindPopup(popupHtml);

  markers[i] = marker;

  var row = document.createElement('div');
  row.className = 'row ' + (s.status === 'current' ? 'cur' : 'old');
  row.innerHTML = '<div class="loc">'+s.loc+'</div><div class="hl">'+s.headline+'</div>';
  row.addEventListener('click', function(){
    map.flyTo([s.lat, s.lon], 8, {duration: 0.8});
    marker.openPopup();
  });
  (s.status === 'current' ? listCurrent : listOlder).appendChild(row);
});
</script>
</body>
</html>
