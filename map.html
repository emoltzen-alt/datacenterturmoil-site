<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map (last 24 hours)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f1419;--card:#1a2129;--ink:#e6edf3;--muted:#9aa7b4;--accent:#4ea1ff;
    --current:#2ea043;--older:#b08800;--line:#2a333d;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  #app{display:flex;height:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}
  #sidebar{flex:0 0 360px;height:100%;display:flex;flex-direction:column;
    border-left:1px solid var(--line);background:var(--bg)}
  #sidebar header{flex:0 0 auto;padding:14px 16px;border-bottom:1px solid var(--line)}
  #sidebar h1{font-size:16px;margin:0 0 4px}
  #sidebar .sub{color:var(--muted);font-size:12px}
  .legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .dot.cur{background:var(--current)}
  .dot.old{background:var(--older)}
  #list{flex:1 1 auto;overflow-y:auto;padding:10px}
  .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:14px 6px 6px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .grp:first-child{margin-top:2px}
  .row{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:7px;padding:9px 11px;margin:0 0 8px;cursor:pointer;transition:border-color .15s}
  .row:hover{border-color:var(--accent)}
  .row.cur{border-left-color:var(--current)}
  .row.old{border-left-color:var(--older)}
  .row .loc{font-weight:700;font-size:13px}
  .row .headline{color:var(--muted);font-size:12px;margin-top:2px}
  .row .meta{color:var(--muted);font-size:11px;margin-top:4px}

  /* Leaflet dark tweaks */
  .leaflet-container{background:#0a0d11}
  .leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .leaflet-popup-tip{background:var(--card)}
  .leaflet-popup-content{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:10px 12px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:var(--accent)}
  .tt{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    color:var(--ink);font:12px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .tt b{font-size:13px}
  .tt .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;padding:1px 7px;border-radius:20px;margin-left:6px;vertical-align:middle}
  .tt .badge.cur{background:var(--current);color:#02160a}
  .tt .badge.old{background:var(--older);color:#1a1400}
  .tt .loc2{color:var(--muted);font-size:11px;margin:2px 0 4px}
  .tt .src2{color:var(--muted);font-size:11px;margin-top:4px}
  .leaflet-tooltip{background:transparent;border:0;box-shadow:none;padding:0}

  @media (max-width:820px){
    #app{flex-direction:column}
    #map{flex:0 0 55vh}
    #sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="sidebar">
    <header>
      <h1>Data Center Community Response</h1>
      <div class="sub">Updated Saturday, August 1, 2026 · prior 24 hours + background</div>
      <div class="legend">
        <span><i class="dot cur"></i> Past 24 hours (current)</span>
        <span><i class="dot old"></i> Older / background</span>
      </div>
    </header>
    <div id="list"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

  // CURRENT — past 24 hours

  // OLDER / background
  {status:"old", loc:"Martinsville / Henry County, VA", lat:36.6912, lng:-79.8722,

   source:"Cardinal News", date:"Jul 29, 2026",

  {status:"old", loc:"Santa Teresa / Doña Ana County, NM", lat:31.8456, lng:-106.6631,
   headline:"Project Jupiter meeting erupts, 3 arrested",
   desc:"A commissioners' meeting on the Oracle/OpenAI-linked data center devolved into shouting and a scuffle after public comment was cut off; three arrested.",
   source:"KVIA", date:"Jul 29, 2026",
   url:"https://kvia.com/news/business-technology/2026/07/28/project-jupiter-meeting-draws-strong-reactions-from-dona-ana-county-residents/"},
  {status:"old", loc:"St. Louis, MO", lat:38.6270, lng:-90.1994,
   headline:"Board upholds $3B Armory-district data center permit",
   desc:"After an 11-hour hearing, the Board of Adjustment unanimously denied residents' appeals, upholding a conditional-use permit for a 120MW facility.",
   source:"KSDK", date:"Jul 30, 2026",
   url:"https://www.ksdk.com/article/news/local/st-louis-board-denies-appeal-conditional-use-permit-armory-adjacent-data-center/63-e9bc6e1a-41e4-439c-af0f-9dc88008a7e5"},
  {status:"old", loc:"Colorado Springs, CO", lat:38.8339, lng:-104.8214,
   headline:"Appeal fails, Project Taurus data center moves ahead",
   desc:"Planning commissioners voted 6-2 to deny an appeal after hours of testimony on noise, water and utility-rate concerns.",
   source:"CPR News", date:"Jul 24, 2026",
   url:"https://www.cpr.org/2026/07/24/project-taurus-appeal-fails/"},
  {status:"old", loc:"Indianapolis, IN", lat:39.7684, lng:-86.1581,
   headline:"East-side data center wins approval despite protest",
   desc:"Dozens of protestors gathered outside the City-County Building as the Metropolitan Development Commission approved an east-side data center.",
   source:"WFYI", date:"Jul 15, 2026",
   url:"https://www.wfyi.org/wfyi-news/2026-07-15/east-side-data-center-wins-approval-despite-community-opposition"},
  {status:"old", loc:"Howell Township, MI", lat:42.6073, lng:-83.9294,
   headline:"Planning commission denies data center recommendation",
   desc:"Hundreds of residents packed a meeting; after hours of public comment the commission voted to deny a recommendation favoring the project.",
   source:"CBS News Detroit", date:"late Jul 2026",
   url:"https://www.cbsnews.com/amp/detroit/news/residents-voice-concern-proposal-data-center-howell-township"},
  {status:"old", loc:"Charlotte, NC", lat:35.2271, lng:-80.8431,
   headline:"Council weighs moratorium amid water, power concerns",
   desc:"Council is pursuing a temporary moratorium after staff reported one facility under construction could use 1.2M gallons of water/day in summer.",
   source:"WFAE", date:"2026",
   url:"https://www.wfae.org/politics/2026-05-12/charlotte-city-council-weighs-data-center-moratorium-amid-water-power-concerns"},
  {status:"old", loc:"Tucson, AZ", lat:32.2226, lng:-110.9747,
   headline:"Council unanimously rejects Project Blue",
   desc:"The City Council rejected any city involvement with the Project Blue data center complex, citing water and electricity concerns.",
   source:"The Cool Down", date:"2026",
   url:"https://www.thecooldown.com/green-tech/data-centers-water-power-lubbock-concerns/"},

   source:"Newsweek", date:"late Jul 2026",
   url:"https://www.newsweek.com/michigan-residents-sue-ai-data-center-noise-not-alone-12254427"},
  {status:"old", loc:"Mount Pleasant, WI", lat:42.7180, lng:-87.8834,
   headline:"Neighbors sue over Microsoft Fairwater noise",
   desc:"A proposed class action alleges excessive cooling-system and generator noise audible more than a mile past the property line.",
   source:"Tom's Hardware", date:"late Jul 2026",
   url:"https://www.tomshardware.com/tech-industry/data-centers/it-sounds-like-someone-set-up-a-vacuum-like-in-your-living-room-michigan-residents-sue-ai-data-center-emitting-noise-24-7-company-fined-for-industrial-noise-ordinance-violations-offers-to-buy-homes-from-residents"},
  {status:"old", loc:"Rockville / Montgomery County, MD", lat:39.0840, lng:-77.1528,
   headline:"Council approves 18-month moratorium",
   desc:"The County Council unanimously approved an 18-month moratorium and new limitations on data-center development.",
   source:"Montgomery County, MD", date:"Jul 28, 2026",
   url:"https://www.montgomerycountymd.gov/news/council-approves-18-month-data-center-moratorium-places-limitations-data-center-development"},
  {status:"old", loc:"Bradenton / Manatee County, FL", lat:27.4989, lng:-82.5748,
   headline:"Commissioners move toward moratorium",
   desc:"Commissioners voted unanimously to direct staff to draft a resolution pausing new data-center applications.",
   source:"Business Observer", date:"Jul 28–29, 2026",
   url:"https://www.businessobserverfl.com/news/2026/jul/29/manatee-county-data-center-moratorium/"},
  {status:"old", loc:"Albany, GA", lat:31.5785, lng:-84.1557,
   headline:"City enacts 12-month development pause",
   desc:"Commissioners unanimously approved a temporary halt on new data-center development to allow time to write regulations.",
   source:"WALB", date:"Jul 28–29, 2026",
   url:"https://www.walb.com/2026/07/29/data-center-developments-paused-12-months-albany-following-commission-vote/?outputType=amp"},
  {status:"old", loc:"Newnan / Coweta County, GA", lat:33.3809, lng:-84.7997,
   headline:"County passes 180-day moratorium",
   desc:"Commissioners passed a 180-day moratorium on new data-center proposals, calling development “on our doorstep.”",
   source:"Yahoo News", date:"late Jul 2026",
   url:"https://www.yahoo.com/news/doorstep-coweta-county-passes-180-175558126.html"},
  {status:"old", loc:"Salem, OR", lat:44.9429, lng:-123.0351,
   headline:"Council votes to explore NDA ban, forms task force",
   desc:"Council voted 8-0 on two measures after residents packed chambers, vowing they “won't back down.”",
   source:"Salem Reporter", date:"Jul 27–28, 2026",
   url:"https://www.salemreporter.com/2026/07/27/city-council-live-residents-pack-city-council-meeting-to-voice-frustration-over-proposed-data-center/"},
  {status:"old", loc:"Dallas / Paulding County, GA", lat:33.9223, lng:-84.8402,
   headline:"Meetings overflow as residents fight zoning changes",
   desc:"Public meetings have repeatedly overflowed with residents opposing zoning changes over electric rates, noise, and ecological damage.",
   source:"FOX 5 Atlanta", date:"late Jul 2026",
   url:"https://www.fox5atlanta.com/news/paulding-public-meetings-overflow-residents-fight-data-centers"}
];

var map = L.map('map', {zoomControl:true}).setView([39.5, -96.0], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

var colors = {cur: getComputedColor('--current'), old: getComputedColor('--older')};
function getComputedColor(varName){
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || (varName==='--current' ? '#2ea043' : '#b08800');
}

var markers = [];

function tooltipHtml(s){
  var badge = s.status === 'cur' ? '<span class="badge cur">Current</span>' : '<span class="badge old">Older</span>';
  return '<div class="tt"><b>'+s.loc+'</b>'+badge+
    '<div class="loc2">'+s.headline+'</div>' +
    '<div>'+s.desc+'</div>' +
    '<div class="src2">'+s.source+' &middot; '+s.date+'</div></div>';
}

function popupHtml(s){
  var badge = s.status === 'cur' ? '<span class="badge cur">Current</span>' : '<span class="badge old">Older</span>';
  return '<b>'+s.loc+'</b>'+badge+'<br>'+
    '<div style="margin:4px 0">'+s.headline+'</div>' +
    '<div style="color:var(--muted);margin-bottom:6px">'+s.desc+'</div>' +
    '<div style="font-size:12px;color:var(--muted)">'+s.source+' &middot; '+s.date+'</div>' +
    '<div style="margin-top:6px"><a href="'+s.url+'" target="_blank" rel="noopener">Read source →</a></div>';
}

sites.forEach(function(s, i){
  var color = colors[s.status];
  var m = L.circleMarker([s.lat, s.lng], {
    radius: 9, color: color, fillColor: color, fillOpacity: 0.85, weight: 2
  }).addTo(map);
  m.bindTooltip(tooltipHtml(s), {direction:'top', offset:[0,-8], opacity:1});
  m.bindPopup(popupHtml(s));
  markers.push(m);
});

// Sidebar list
var listEl = document.getElementById('list');
var curItems = sites.filter(function(s){return s.status==='cur'});
var oldItems = sites.filter(function(s){return s.status==='old'});

function renderGroup(title, items, offset){
  var grp = document.createElement('div');
  grp.className = 'grp';
  grp.textContent = title;
  listEl.appendChild(grp);
  items.forEach(function(s, idx){
    var globalIdx = sites.indexOf(s);
    var row = document.createElement('div');
    row.className = 'row ' + s.status;
    row.innerHTML = '<div class="loc">'+s.loc+'</div>' +
      '<div class="headline">'+s.headline+'</div>' +
      '<div class="meta">'+s.source+' &middot; '+s.date+'</div>';
    row.addEventListener('click', function(){
      var m = markers[globalIdx];
      map.flyTo(m.getLatLng(), 8, {duration:0.8});
      setTimeout(function(){ m.openPopup(); }, 850);
    });
    listEl.appendChild(row);
  });
}

renderGroup('Past 24 Hours (Current)', curItems);
renderGroup('Older / Background', oldItems);

if (!curItems.length){
  var none = document.createElement('div');
  none.className = 'grp';
  none.textContent = 'No genuinely new items in the past 24 hours';
  listEl.insertBefore(none, listEl.firstChild);
}
</script>
</body>
</html>
