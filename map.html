  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
    flex: none;
  }
  header h1 {
    margin: 0 0 2px 0;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  header .sub {
    color: var(--muted);
    font-size: 0.82rem;
  }
  .legend {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    font-size: 0.78rem;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.current { background: var(--current); box-shadow: 0 0 6px var(--current); }
  .dot.older { background: var(--older); box-shadow: 0 0 6px var(--older); }
  .layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #map { flex: 1; background: #0b0e14; }
  #sidebar {
    width: 340px;
    flex: none;
    background: var(--panel);
    border-left: 1px solid var(--panel-border);
    overflow-y: auto;
    padding: 12px;
  }
  #sidebar h2 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 18px 0 8px 0;
    padding-top: 8px;
    border-top: 1px solid var(--panel-border);
  }
  #sidebar h2:first-of-type { margin-top: 0; border-top: none; padding-top: 0; }
  .row {
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    border: 1px solid transparent;
    transition: background 0.12s, border-color 0.12s;
  }
  .row:hover {
    background: #1a2030;
    border-color: var(--panel-border);
  }
  .row .place {
    font-weight: 600;
    font-size: 0.86rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .row .headline {
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 2px;
    line-height: 1.3;
  }
  .empty-note {
    color: var(--muted);
    font-size: 0.8rem;
    padding: 8px 10px;
    font-style: italic;
  }
  a { color: var(--accent); }
  .tooltip-card {
    font-family: inherit;
    max-width: 240px;
  }
  .tooltip-card .badge {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 4px;
  }
  .tooltip-card .badge.current { background: rgba(52,211,153,0.18); color: var(--current); }
  .tooltip-card .badge.older { background: rgba(242,184,75,0.18); color: var(--older); }
  .tooltip-card .t-place { font-weight: 700; font-size: 0.85rem; margin: 2px 0; }
  .tooltip-card .t-headline { font-size: 0.78rem; margin-bottom: 3px; }
  .tooltip-card .t-desc { font-size: 0.72rem; color: #333; margin-bottom: 3px; }
  .tooltip-card .t-source { font-size: 0.68rem; color: #555; }
  .popup-card { font-family: inherit; max-width: 240px; }
  .popup-card a { color: #2563eb; font-weight: 600; }
  .leaflet-popup-content-wrapper { border-radius: 10px; }

  .leaflet-tooltip.dctm-tooltip {
    background: #fff;
    color: #111;
    border: none;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    padding: 8px 10px;
  }
  .leaflet-tooltip.dctm-tooltip::before { display: none; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    #sidebar { width: 100%; height: 40%; border-left: none; border-top: 1px solid var(--panel-border); }
    #map { height: 60%; }
  }
</style>

  const YOUTUBE_NOTE = "Only one item in today's search met the bar for an official government meeting livestream/recording (Alamance County, NC). Several other counties (Calvert County MD, Snohomish County WA) stream hearings live on their own official government YouTube channels, but a specific archived video URL for the relevant hearing could not be confirmed in this run, so they are omitted here rather than guessed.";

  const map = L.map('map', { zoomControl: true }).setView([39.5, -96], 4.4);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  const markers = {};

  function colorFor(status) {
    return status === 'current' ? '#34d399' : '#f2b84b';
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  DATA.forEach(item => {
    const marker = L.circleMarker([item.lat, item.lng], {
      radius: 8,
      fillColor: colorFor(item.status),
      color: '#0b0e14',
      weight: 1.5,
      fillOpacity: 0.9
    }).addTo(map);

    const badgeLabel = item.status === 'current' ? 'CURRENT' : 'OLDER';
    const badgeClass = item.status;

    marker.bindTooltip(
      `<div class="tooltip-card">
        <span class="badge ${badgeClass}">${badgeLabel}</span>
        <div class="t-place">${escapeHtml(item.place)}</div>
        <div class="t-headline">${escapeHtml(item.headline)}</div>
        <div class="t-desc">${escapeHtml(item.description)}</div>
        <div class="t-source">${escapeHtml(item.source)} &middot; ${escapeHtml(item.date)}</div>
      </div>`,
      { className: 'dctm-tooltip', direction: 'top', offset: [0, -6] }
    );

    marker.bindPopup(
      `<div class="popup-card">
        <span class="badge ${badgeClass}">${badgeLabel}</span>
        <div class="t-place">${escapeHtml(item.place)}</div>
        <div class="t-headline">${escapeHtml(item.headline)}</div>
        <div class="t-desc">${escapeHtml(item.description)}</div>
        <div class="t-source">${escapeHtml(item.source)} &middot; ${escapeHtml(item.date)}</div>
        <div style="margin-top:6px;"><a href="${item.url}" target="_blank" rel="noopener">Read source &rarr;</a></div>
      </div>`
    );

    markers[item.id] = marker;
  });

  function flyTo(item) {
    map.flyTo([item.lat, item.lng], 8, { duration: 0.8 });
    markers[item.id].openPopup();
  }

  const sidebar = document.getElementById('sidebar');

  function buildSection(title, items) {
    let html = `<h2>${title}</h2>`;
    if (items.length === 0) {
      html += `<div class="empty-note">Nothing genuinely new in the past 24 hours.</div>`;
    } else {
      items.forEach(item => {
        const dotClass = item.status;
        html += `<div class="row" data-id="${item.id}">
          <div class="place"><span class="dot ${dotClass}"></span>${escapeHtml(item.place)}</div>
          <div class="headline">${escapeHtml(item.headline)}</div>
        </div>`;
      });
    }
    return html;
  }

  const current = DATA.filter(d => d.status === 'current');
  const older = DATA.filter(d => d.status === 'older');

  sidebar.innerHTML =
    buildSection('Past 24 Hours (Current)', current) +
    buildSection('Older / Background', older) +
    `<h2>Official Meeting Videos</h2><div class="empty-note">${escapeHtml(YOUTUBE_NOTE)}</div>`;

  sidebar.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', () => {
      const item = DATA.find(d => d.id == row.dataset.id);
      if (item) flyTo(item);
    });
  });
</script>
