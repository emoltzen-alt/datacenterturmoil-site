<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map (last 24 hours)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f1419;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;--accent:#4ea1ff;--current:#2ea043;--older:#d29922;--card:#161c24}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{display:flex;height:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}
  .sidebar{flex:0 0 320px;height:100%;overflow-y:auto;border-left:1px solid var(--line);background:var(--bg)}
  .sidebar h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:0;padding:12px 14px 8px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line)}
  .row{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:var(--card)}
  .row .rt{font-size:13px;font-weight:600;margin-bottom:2px}
  .row .rl{font-size:12px;color:var(--accent)}
  .row .rd{font-size:11.5px;color:var(--muted);margin-top:2px}
  .legend{position:absolute;bottom:18px;left:18px;z-index:1000;background:var(--card);border:1px solid var(--line);
    border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .legend .lrow{display:flex;align-items:center;gap:8px;margin:3px 0}
  .legend .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .dot.current{background:var(--current)}
  .dot.older{background:var(--older)}
  .leaflet-tooltip.dc-tip{background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    max-width:260px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  .leaflet-tooltip.dc-tip .tt-badge{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
    font-weight:700;padding:1px 6px;border-radius:20px;margin-bottom:4px}
  .tt-badge.current{background:rgba(46,160,67,.25);color:#4fd672}
  .tt-badge.older{background:rgba(210,153,34,.25);color:#e3b341}
  .leaflet-tooltip.dc-tip b{font-size:14px;display:block;margin-bottom:2px}
  .leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border-radius:8px}
  .leaflet-popup-tip{background:var(--card)}
  .leaflet-popup-content{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:12px 14px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#7cc4ff}
  @media (max-width:820px){
    .wrap{flex-direction:column}
    .sidebar{flex:1 1 auto;width:100%;border-left:0;border-top:1px solid var(--line);max-height:45vh}
    #map{flex:0 0 55vh}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="map"></div>
  <aside class="sidebar" id="sidebar"></aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  {place:"Richmond County, NC", lat:34.9401, lng:-79.7648, status:"older",

var map = L.map('map', {zoomControl:true}).setView([39.5, -96.0], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19, subdomains: 'abcd'
}).addTo(map);

var markers = {};

function colorFor(status){ return status === 'current' ? '#2ea043' : '#d29922'; }

items.forEach(function(it, i){
  var m = L.circleMarker([it.lat, it.lng], {
    radius: 9, color: colorFor(it.status), fillColor: colorFor(it.status), fillOpacity: 0.85, weight: 2
  }).addTo(map);

  var badgeClass = it.status === 'current' ? 'current' : 'older';
  var badgeText = it.status === 'current' ? 'CURRENT' : 'OLDER';
  var tipHtml = '<span class="tt-badge ' + badgeClass + '">' + badgeText + '</span>' +
    '<b>' + it.place + '</b>' + it.headline +
    '<div style="margin-top:4px;color:#9aa7b4">' + it.desc + '</div>' +
    '<div style="margin-top:4px;color:#9aa7b4;font-size:11.5px">' + it.source + ' · ' + it.date + '</div>';
  m.bindTooltip(tipHtml, {direction:'top', offset:[0,-6], className:'dc-tip', sticky:true});

  var popupHtml = '<b>' + it.place + '</b><br>' + it.headline + '<br>' +
    '<a href="' + it.url + '" target="_blank" rel="noopener">' + it.source + ' — ' + it.date + '</a>';
  m.bindPopup(popupHtml);

  markers[i] = m;
});

// Sidebar
var sidebar = document.getElementById('sidebar');
function buildGroup(title, status){
  var html = '<h2>' + title + '</h2>';
  items.forEach(function(it, i){
    if (it.status !== status) return;
    html += '<div class="row" data-idx="' + i + '">' +
      '<div class="rt">' + it.place + '</div>' +
      '<div class="rl">' + it.headline + '</div>' +
      '<div class="rd">' + it.source + ' · ' + it.date + '</div>' +
      '</div>';
  });
  return html;
}
sidebar.innerHTML = buildGroup('Past 24 Hours (Current)', 'current') + buildGroup('Older / Background', 'older');

sidebar.querySelectorAll('.row').forEach(function(row){
  row.addEventListener('click', function(){
    var idx = row.getAttribute('data-idx');
    var it = items[idx];
    map.flyTo([it.lat, it.lng], 8, {duration: 0.8});
    markers[idx].openPopup();
  });
});

// Legend
var legend = L.control({position:'bottomleft'});
legend.onAdd = function(){
  var div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<div class="lrow"><span class="dot current"></span> Past 24 Hours (Current)</div>' +
    '<div class="lrow"><span class="dot older"></span> Older / Background</div>';
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
