<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{--bg:#0f1419;--panel:#141b22;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;
        --accent:#4ea1ff;--current:#2ea043;--older:#d29922}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{display:flex;height:100vh;min-height:100%}
  #mapwrap{flex:1 1 auto;position:relative;min-width:0}
  #map{width:100%;height:100%;background:#0b0e12}

  #legend{position:absolute;bottom:16px;left:16px;z-index:1000;background:rgba(20,27,34,.92);
    border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12.5px;
    backdrop-filter:blur(2px)}
  #legend .row{display:flex;align-items:center;gap:8px;margin:3px 0}
  #legend .sw{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  #legend .sw.current{background:var(--current);box-shadow:0 0 0 2px rgba(46,160,67,.25)}
  #legend .sw.older{background:var(--older);box-shadow:0 0 0 2px rgba(210,153,34,.25)}

  #sidebar{flex:0 0 380px;display:flex;flex-direction:column;border-left:1px solid var(--line);
    background:var(--bg);min-width:0}
  #sidebar header{flex:0 0 auto;padding:14px 16px;border-bottom:1px solid var(--line)}
  #sidebar header h1{font-size:15px;margin:0 0 4px}
  #sidebar header .sub{color:var(--muted);font-size:12px}
  #list{flex:1 1 auto;overflow-y:auto;padding:10px 12px}

  .grouplabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    display:flex;align-items:center;gap:6px;margin:14px 4px 8px}
  .grouplabel:first-child{margin-top:2px}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .dot.current{background:var(--current)}
  .dot.older{background:var(--older)}

  .row{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:border-color .12s,transform .12s}
  .row:hover{border-color:var(--accent);transform:translateX(2px)}
  .row .place{font-weight:600;font-size:13px}
  .row .headline{color:var(--muted);font-size:12px;margin-top:2px}
  .row.selected{border-color:var(--accent);background:#182430}

  /* Leaflet popup / tooltip theming */
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);
    border:1px solid var(--line)}
  .leaflet-popup-content{margin:11px 13px;font-size:12.5px;line-height:1.5}
  .leaflet-popup-content a{color:var(--accent)}
  .pcard .place{font-weight:700;font-size:13px;margin-bottom:2px}
  .pcard .badge{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;
    padding:1px 6px;border-radius:999px;margin-bottom:6px}
  .badge.current{background:rgba(46,160,67,.18);color:#4bd166;border:1px solid rgba(46,160,67,.4)}
  .badge.older{background:rgba(210,153,34,.16);color:#e3b341;border:1px solid rgba(210,153,34,.4)}
  .pcard .headline{font-weight:600;margin:2px 0 5px}
  .pcard .desc{opacity:.9;margin-bottom:6px}
  .pcard .src{color:var(--muted);font-size:11.5px}

  .tipcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:7px 9px;font-size:12px;max-width:230px;color:var(--ink)}
  .tipcard .place{font-weight:700}
  .tipcard .headline{margin-top:3px;font-weight:600}
  .tipcard .desc{margin-top:3px;opacity:.85}
  .leaflet-tooltip.dctt{background:transparent;border:0;box-shadow:none;padding:0}
  .leaflet-tooltip.dctt::before{display:none}

  @media (max-width:820px){
    #app{flex-direction:column}
    #mapwrap{flex:0 0 55vh;min-height:340px}
    #sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>

    <div id="legend">

    </div>
  </div>
  <aside id="sidebar">
    <header>

      <div class="sub">24h window: Aug 25 – Aug 26, 2026 · click a row to fly to it</div>
    </header>
    <div id="list"></div>
  </aside>
</div>

const map = L.map('map', {zoomControl:true, worldCopyJump:true})
  .setView([39.5, -98.35], 5);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const markers = [];

function colorFor(item){ return item.status === 'current' ? '#2ea043' : '#d29922'; }

ITEMS.forEach((item, i) => {
  const c = colorFor(item);
  const marker = L.circleMarker([item.lat, item.lon], {
    radius: item.status === 'current' ? 9 : 7,
    weight: 2,
    color: c,
    fillColor: c,
    fillOpacity: 0.55,
    opacity: 0.95
  }).addTo(map);

  const tip = document.createElement('div');
  tip.className = 'tipcard';
  tip.innerHTML = `
    <div class="place">${item.place}</div>
    <span class="badge ${item.status}" style="display:inline-block;font-size:9.5px;text-transform:uppercase;
      letter-spacing:.04em;padding:1px 5px;border-radius:999px;margin-top:3px;
      background:${item.status==='current'?'rgba(46,160,67,.18)':'rgba(210,153,34,.16)'};
      color:${item.status==='current'?'#4bd166':'#e3b341'};
      border:1px solid ${item.status==='current'?'rgba(46,160,67,.4)':'rgba(210,153,34,.4)'}">${item.status}</span>
    <div class="headline">${item.headline}</div>
    <div class="desc">${item.desc}</div>
    <div class="src" style="color:#9aa7b4;margin-top:3px">${item.source} · ${item.date}</div>
  `;
  marker.bindTooltip(tip, {direction:'top', offset:[0,-6], className:'dctt', opacity:1});

  const popup = document.createElement('div');
  popup.className = 'pcard';
  popup.innerHTML = `
    <div class="place">${item.place}</div>
    <span class="badge ${item.status}">${item.status === 'current' ? 'Current' : 'Older'}</span>
    <div class="headline">${item.headline}</div>
    <div class="desc">${item.desc}</div>
    <div class="src">${item.source} · ${item.date}</div>
    <div style="margin-top:6px"><a href="${item.url}" target="_blank" rel="noopener">Read source →</a></div>
  `;
  marker.bindPopup(popup);

  markers.push(marker);
});

// ---- Sidebar ----
const list = document.getElementById('list');

function buildGroup(label, statusKey){
  const items = ITEMS.map((it,i)=>({...it, idx:i})).filter(it => it.status === statusKey);
  if (!items.length) return;
  const head = document.createElement('div');
  head.className = 'grouplabel';
  head.innerHTML = `<span class="dot ${statusKey}"></span>${label} (${items.length})`;
  list.appendChild(head);
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="place">${item.place}</div><div class="headline">${item.headline}</div>`;
    row.addEventListener('click', () => {
      document.querySelectorAll('.row.selected').forEach(r=>r.classList.remove('selected'));
      row.classList.add('selected');
      map.flyTo([item.lat, item.lon], 10, {duration:0.6});
      markers[item.idx].openPopup();
    });
    list.appendChild(row);
  });
}

buildGroup('Past 24 Hours (Current)', 'current');
buildGroup('Older / Background', 'older');
