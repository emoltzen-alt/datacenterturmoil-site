  html,body{margin:0;height:100%;background:var(--bg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  #app{display:flex;height:100%}
  #map{flex:1 1 auto;height:100%;min-width:0;background:#000}

  #sidebar{flex:0 0 340px;display:flex;flex-direction:column;border-left:1px solid var(--line);
    background:#12181f;min-width:0}
  #sidebar .head{flex:0 0 auto;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  #sidebar h1{font-size:15px;margin:0 0 4px}
  #sidebar .sub{color:var(--muted);font-size:11.5px}
  .legend{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .swatch{width:9px;height:9px;border-radius:50%;display:inline-block}
  .sw-current{background:var(--current)}
  .sw-older{background:var(--older)}

  #list{flex:1 1 auto;overflow-y:auto;padding:6px 0 20px}
  .group-title{position:sticky;top:0;background:#12181f;color:var(--muted);font-size:11px;
    text-transform:uppercase;letter-spacing:.06em;padding:10px 16px 6px;border-bottom:1px solid var(--line)}
  .row{padding:9px 16px;border-bottom:1px solid #1b232c;cursor:pointer}
  .row:hover{background:#1a2230}
  .row .rtitle{font-size:12.5px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:6px}
  .row .rloc{color:var(--muted);font-size:11px;margin-bottom:3px}
  .row .rdesc{color:#c3ccd6;font-size:11.5px;line-height:1.4}
  .row .rmeta{color:var(--muted);font-size:10.5px;margin-top:4px}
  .badge{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:9px;flex:0 0 auto}
  .badge-current{background:rgba(46,160,67,.18);color:#5fd67f;border:1px solid rgba(46,160,67,.4)}
  .badge-older{background:rgba(212,146,42,.18);color:#f0b95a;border:1px solid rgba(212,146,42,.4)}
  .video-tag{color:#7db8ff;font-size:10.5px}

  .leaflet-popup-content{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#4ea1ff}
  .tt{font:12px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:230px}
  .tt b{font-size:13px}
  .tt .ttbadge{display:inline-block;font-size:9px;text-transform:uppercase;padding:1px 5px;border-radius:8px;margin-bottom:3px}
  .tt .ttloc{color:#666;font-size:11px;margin:2px 0}
  .tt .ttmeta{color:#777;font-size:10.5px;margin-top:3px}

  @media (max-width:760px){
    #app{flex-direction:column}
    #map{flex:0 0 46vh}
    #sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>

function badgeHtml(s){
  return s.status === 'current'
    ? '<span class="ttbadge" style="background:rgba(46,160,67,.85);color:#fff">CURRENT</span>'
    : '<span class="ttbadge" style="background:rgba(212,146,42,.85);color:#fff">OLDER</span>';
}

SITES.forEach(function(s, i){
  var color = s.status === 'current' ? '#2ea043' : '#d4922a';
  var m = L.circleMarker([s.lat, s.lon], {
    radius: s.status === 'current' ? 9 : 7,
    color: color, fillColor: color, fillOpacity: 0.88, weight: 2
  }).addTo(map);

  var tooltip = '<div class="tt">' + badgeHtml(s) +
    '<div><b>' + s.name + '</b></div>' +
    '<div class="ttloc">' + s.headline + '</div>' +
    '<div>' + s.desc.slice(0, 140) + (s.desc.length > 140 ? '…' : '') + '</div>' +
    '<div class="ttmeta">' + s.source + ' · ' + s.date + '</div></div>';
  m.bindTooltip(tooltip, {direction: 'top', offset: [0, -6], opacity: 0.97});

  var popup = '<b>' + s.name + '</b><br>' + s.headline + '<br><br>' + s.desc +
    '<br><br><i>' + s.source + ' · ' + s.date + '</i>' +
    '<br><a href="' + s.url + '" target="_blank" rel="noopener">Read source →</a>';
  m.bindPopup(popup, {maxWidth: 300});

  markers[i] = m;

        (s.isVideo ? '<span class="video-tag">▶ official video</span>' : '') +
      '</div>' +
      '<div class="rloc"><b>' + s.name + '</b></div>' +
      '<div class="rdesc"><b>' + s.headline + '</b><br>' + s.desc + '</div>' +
      '<div class="rmeta">' + s.source + ' · ' + s.date + '</div>';
    row.addEventListener('click', function(){
      map.flyTo([s.lat, s.lon], 8, {duration: 0.9});
      markers[i].openPopup();
    });
    list.appendChild(row);
  });
}

renderGroup('Past 24 Hours (Current)', current);
renderGroup('Older / Background', older);
</script>
</body>
</html>
