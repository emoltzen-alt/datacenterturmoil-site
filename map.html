<html lang="en">
<head>

<title>Data Center Community Response — Map (last 24 hours)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f1419;--card:#1a2129;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;
    --accent:#4ea1ff;--current:#2ea043;--older:#b08800}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  .layout{display:flex;height:100%;width:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}
  .sidebar{flex:0 0 340px;height:100%;overflow-y:auto;background:var(--bg);
    border-left:1px solid var(--line)}
  .sidebar .head{padding:14px 16px;border-bottom:1px solid var(--line)}
  .sidebar h1{font-size:15px;margin:0 0 6px}
  .legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:10px;height:10px;border-radius:50%;display:inline-block}
  .swatch.cur{background:var(--current)}
  .swatch.old{background:var(--older)}
  .group h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    margin:0;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
  .row{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:var(--card)}
  .row .rloc{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
  .row .rloc .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .row .rloc .dot.cur{background:var(--current)}
  .row .rloc .dot.old{background:var(--older)}
  .row .rhead{font-size:12.5px;color:var(--ink);margin:3px 0 2px}
  .row .rmeta{font-size:11.5px;color:var(--muted)}
  .leaflet-popup-content{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#4ea1ff}
  .tt{font-size:12.5px;line-height:1.4;max-width:230px}
  .tt b{display:block;font-size:13.5px;margin-bottom:2px}
  .tt .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;padding:1px 6px;border-radius:10px;margin-bottom:4px}
  .tt .badge.cur{background:#2ea043;color:#02160a}
  .tt .badge.old{background:#b08800;color:#1a1400}
  @media (max-width:820px){
    .layout{flex-direction:column}
    #map{flex:0 0 55vh}
    .sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>

    <div id="list-cur"></div>
    <div class="group"><h2>🟡 Older / Background</h2></div>
    <div id="list-old"></div>

</div>

  var map = L.map('map', {scrollWheelZoom:true}).setView([39.0, -94.0], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
  }).addTo(map);

  var markers = {};
  var colors = {cur:'#2ea043', old:'#b08800'};

  function popupHtml(s){
    var badge = s.status === 'cur' ? 'CURRENT' : 'OLDER';
    return '<b>'+s.loc+'</b><br>'+
      '<span style="color:'+colors[s.status]+';font-weight:700;font-size:11px;text-transform:uppercase;">'+badge+'</span><br>'+
      s.headline+'<br>'+s.desc+'<br>'+
      '<span style="color:#9aa7b4">'+s.source+' · '+s.date+'</span><br>'+
      '<a href="'+s.url+'" target="_blank" rel="noopener">Read source →</a>';
  }

  function tooltipHtml(s){
    var badge = s.status === 'cur' ? 'cur' : 'old';
    var badgeText = s.status === 'cur' ? 'CURRENT' : 'OLDER';
    return '<div class="tt"><span class="badge '+badge+'">'+badgeText+'</span>'+
      '<b>'+s.loc+'</b>'+s.headline+'<br>'+s.desc+
      '<br><span style="color:#9aa7b4">'+s.source+' · '+s.date+'</span></div>';
  }

  sites.forEach(function(s, i){
    var m = L.circleMarker([s.lat, s.lon], {
      radius: 8, color: colors[s.status], fillColor: colors[s.status], fillOpacity: 0.85, weight: 2
    }).addTo(map);
    m.bindTooltip(tooltipHtml(s), {direction:'top', offset:[0,-6]});
    m.bindPopup(popupHtml(s));
    markers[i] = m;
  });

  function buildList(containerId, status){
    var el = document.getElementById(containerId);
    sites.forEach(function(s, i){
      if (s.status !== status) return;
      var row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<div class="rloc"><span class="dot '+status+'"></span>'+s.loc+'</div>'+
        '<div class="rhead">'+s.headline+'</div>'+
        '<div class="rmeta">'+s.source+' · '+s.date+'</div>';
      row.addEventListener('click', function(){
        map.flyTo([s.lat, s.lon], 9, {duration: 0.8});
        markers[i].openPopup();
      });
      el.appendChild(row);
    });
  }
  buildList('list-cur', 'cur');
  buildList('list-old', 'old');
</script>

</html>
