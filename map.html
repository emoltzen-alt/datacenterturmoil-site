<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{--bg:#0f1419;--panel:#141b22;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;
        --accent:#4ea1ff;--current:#2ea043;--older:#e3b341}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{display:flex;height:100vh;overflow:hidden}
  #mapwrap{flex:1 1 auto;position:relative;min-width:0}
  #map{width:100%;height:100%;background:#0b0e11}

  .legend{position:absolute;bottom:16px;left:16px;z-index:1000;background:rgba(20,27,34,.92);
    border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--ink)}
  .legend .row{display:flex;align-items:center;gap:8px;margin:3px 0}
  .legend .sw{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
  .legend .sw.current{background:var(--current)}
  .legend .sw.older{background:var(--older)}

  #sidebar{flex:0 0 380px;display:flex;flex-direction:column;border-left:1px solid var(--line);
    background:var(--bg);overflow:hidden}
  #sidebar .head{flex:0 0 auto;padding:14px 16px;border-bottom:1px solid var(--line)}
  #sidebar .head h1{font-size:15px;margin:0 0 4px}
  #sidebar .head .sub{color:var(--muted);font-size:12px}
  #sidebar .scroll{flex:1 1 auto;overflow-y:auto;padding:10px 12px}

  .sechead{display:flex;align-items:center;gap:7px;font-size:12px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--muted);margin:14px 4px 8px}
  .sechead .dot{width:9px;height:9px;border-radius:50%}
  .sechead .dot.current{background:var(--current)}
  .sechead .dot.older{background:var(--older)}

  .row-item{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
    border-radius:7px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:background .12s}
  .row-item:hover{background:#1b232c}
  .row-item.current{border-left-color:var(--current)}
  .row-item.older{border-left-color:var(--older)}
  .row-item .loc{font-weight:600;font-size:13px}
  .row-item .headline{color:var(--muted);font-size:12px;margin-top:2px}

  .note{color:var(--muted);font-size:12px;padding:8px 4px;border:1px dashed var(--line);
    border-radius:7px;margin:4px 0 12px}

  /* tooltip / popup card styling */
  .leaflet-tooltip.dc-tip{background:#141b22;color:#e6edf3;border:1px solid #2a333d;
    border-radius:8px;padding:8px 10px;font-size:12.5px;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .leaflet-tooltip.dc-tip::before{display:none}
  .dc-tip .badge{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
    padding:1px 6px;border-radius:10px;margin-bottom:4px;color:#0b0e11;font-weight:700}
  .dc-tip .badge.current{background:#2ea043;color:#eafff0}
  .dc-tip .badge.older{background:#e3b341;color:#1a1400}
  .dc-tip .h{font-weight:600;margin:2px 0}
  .dc-tip .l{color:#9aa7b4;font-size:11.5px}

  .leaflet-popup-content-wrapper{background:#141b22;color:#e6edf3;border:1px solid #2a333d;border-radius:8px}
  .leaflet-popup-tip{background:#141b22}
  .leaflet-popup-content a{color:#4ea1ff}

  @media (max-width:820px){
    #app{flex-direction:column}
    #sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
    #mapwrap{flex:0 0 55vh}
  }
</style>
</head>
<body>
<div id="app">

    <div id="map"></div>
    <div class="legend">
      <div class="row"><span class="sw current"></span> Past 24 hours (current)</div>
      <div class="row"><span class="sw older"></span> Older / background</div>
    </div>
  </div>
  <aside id="sidebar">
    <div class="head">
      <h1>Data Center Community Response</h1>
      <div class="sub">Window: July 21–22, 2026 · Click a row to fly to its pin</div>
    </div>
    <div class="scroll" id="scroll"></div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

const map = L.map('map', {worldCopyJump:false, minZoom:3, maxZoom:12})
  .setView([39.5, -98.35], 4);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const markers = {};

function makeIcon(status){
  const color = status === 'current' ? '#2ea043' : '#e3b341';
  return L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};
      border:2px solid #0f1419;box-shadow:0 0 0 2px rgba(0,0,0,.35)"></div>`,
    iconSize: [16,16],
    iconAnchor: [8,8]
  });
}

items.forEach((it, i) => {
  const marker = L.marker([it.lat, it.lon], {icon: makeIcon(it.status)}).addTo(map);

  const badge = it.status === 'current' ? 'CURRENT' : 'OLDER';
  const badgeClass = it.status;

  marker.bindTooltip(
    `<span class="badge ${badgeClass}">${badge}</span>
     <div class="h">${it.place}</div>
     <div class="h" style="font-weight:500">${it.headline}</div>
     <div class="l">${it.desc}</div>
     <div class="l" style="margin-top:4px">${it.source} · ${it.date}</div>`,
    {className: 'dc-tip', direction: 'top', offset: [0,-8], sticky: true}
  );

  marker.bindPopup(
    `<div style="min-width:200px">
       <div style="font-weight:600;margin-bottom:4px">${it.place}</div>
       <div style="margin-bottom:6px">${it.headline}</div>
       <div style="color:#9aa7b4;font-size:12px;margin-bottom:8px">${it.source} · ${it.date}</div>
       <a href="${it.url}" target="_blank" rel="noopener">Read source →</a>
     </div>`
  );

  markers[i] = marker;
});

function buildSidebar(){
  const scroll = document.getElementById('scroll');
  const current = items.map((it,i)=>({...it,i})).filter(it=>it.status==='current');
  const older = items.map((it,i)=>({...it,i})).filter(it=>it.status==='older');

  let html = `<div class="sechead"><span class="dot current"></span>Past 24 Hours (Current) &middot; ${current.length}</div>`;
  current.forEach(it => {
    html += `<div class="row-item current" data-i="${it.i}">
      <div class="loc">${it.place}</div>
      <div class="headline">${it.headline}</div>
    </div>`;
  });

  html += `<div class="note">Official meeting videos: no verified official government livestream/recording from within the past 24 hours qualified for inclusion (see report.html for details).</div>`;

  html += `<div class="sechead"><span class="dot older"></span>Older / Background &middot; ${older.length}</div>`;
  older.forEach(it => {
    html += `<div class="row-item older" data-i="${it.i}">
      <div class="loc">${it.place}</div>
      <div class="headline">${it.headline}</div>
    </div>`;
  });

  scroll.innerHTML = html;

  scroll.querySelectorAll('.row-item').forEach(row => {
    row.addEventListener('click', () => {
      const i = row.getAttribute('data-i');
      const it = items[i];
      map.flyTo([it.lat, it.lon], 9, {duration:0.8});
      markers[i].openPopup();
    });
  });
}

buildSidebar();
</script>
</body>
</html>
