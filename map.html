<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#0f1419; --card:#1a2129; --ink:#e6edf3; --muted:#9aa7b4;
    --accent:#4ea1ff; --current:#2ea043; --older:#b08800; --line:#2a333d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  #app{display:flex;height:100%;width:100%}
  #sidebar{width:340px;min-width:280px;max-width:40%;height:100%;overflow-y:auto;
    background:var(--bg);border-right:1px solid var(--line);flex-shrink:0}
  #map{flex:1;height:100%}
  .sb-header{padding:16px 16px 10px;border-bottom:2px solid var(--line)}
  .sb-header h1{font-size:16px;margin:0 0 4px}
  .sb-header .sub{color:var(--muted);font-size:12px}
  .legend{display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .dot.cur{background:var(--current)}
  .dot.old{background:var(--older)}
  h2.grp{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    margin:16px 0 6px;padding:0 16px}
  .row{padding:9px 16px;border-left:3px solid transparent;cursor:pointer}
  .row:hover{background:var(--card)}
  .row.cur{border-left-color:var(--current)}
  .row.old{border-left-color:var(--older)}
  .row .loc{font-weight:700;font-size:13px}
  .row .headline{color:var(--muted);font-size:12px;margin-top:2px}
  .leaflet-popup-content-wrapper{background:var(--card);color:var(--ink)}
  .leaflet-popup-tip{background:var(--card)}
  .leaflet-popup-content{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:260px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:var(--accent)}
  .tt-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    max-width:260px;font-size:12px;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .tt-card .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;padding:1px 7px;border-radius:20px;margin-bottom:5px}
  .tt-card .badge.cur{background:var(--current);color:#02160a}
  .tt-card .badge.old{background:var(--older);color:#1a1400}
  .tt-card .h{font-weight:700;font-size:13px;margin:2px 0 3px}
  .tt-card .loc2{color:var(--muted);margin-bottom:4px}
  .tt-card .src2{color:var(--muted);font-size:11px;margin-top:5px}
  .leaflet-tooltip{background:transparent;border:none;box-shadow:none;padding:0}
  footer.credit{position:absolute;bottom:6px;right:10px;color:var(--muted);font-size:10px;z-index:500;
    background:rgba(15,20,25,.6);padding:2px 6px;border-radius:4px}
</style>

// No YouTube livestream/recording items met the "official, verified, meeting-specific" bar for this window — see report.html.

var map = L.map('map', {zoomControl:true}).setView([39.5, -96.0], 4.3);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19, subdomains:'abcd'
}).addTo(map);

var colors = {cur:'#2ea043', old:'#b08800'};
var markers = {};

function ttHtml(s){
  var badge = s.status==='cur' ? 'CURRENT' : 'OLDER';
  return '<div class="tt-card">'+
    '<span class="badge '+s.status+'">'+badge+'</span>'+
    '<div class="h">'+s.headline+'</div>'+
    '<div class="loc2">'+s.loc+'</div>'+
    '<div>'+s.desc+'</div>'+
    '<div class="src2">'+s.source+' · '+s.date+'</div>'+
  '</div>';
}
function popupHtml(s){
  var badge = s.status==='cur' ? 'CURRENT' : 'OLDER';
  return '<b>'+s.loc+'</b> <span style="font-size:10px;color:'+colors[s.status]+';font-weight:700">['+badge+']</span>'+
    '<br>'+s.headline+
    '<br><span style="color:#9aa7b4">'+s.source+' · '+s.date+'</span>'+
    '<br><a href="'+s.url+'" target="_blank" rel="noopener">Read source →</a>';
}

sites.forEach(function(s, i){
  var m = L.circleMarker([s.lat, s.lon], {
    radius: 9, color: colors[s.status], fillColor: colors[s.status], fillOpacity: 0.85, weight: 2
  }).addTo(map);
  m.bindTooltip(ttHtml(s), {direction:'top', offset:[0,-6], opacity:1, sticky:true});
  m.bindPopup(popupHtml(s));
  markers[i] = m;
});

function makeRow(s, i){
  var row = document.createElement('div');
  row.className = 'row ' + s.status;
  row.innerHTML = '<div class="loc">'+s.loc+'</div><div class="headline">'+s.headline+'</div>';
  row.addEventListener('click', function(){
    map.flyTo([s.lat, s.lon], 9, {duration:0.8});
    markers[i].openPopup();
  });
  return row;
}

var listCur = document.getElementById('list-cur');
var listOld = document.getElementById('list-old');
sites.forEach(function(s, i){
  var row = makeRow(s, i);
  if(s.status === 'cur') listCur.appendChild(row);
  else listOld.appendChild(row);
});
</script>
