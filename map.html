  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  #app{display:flex;height:100%;width:100%}
  #sidebar{
    width:380px;min-width:300px;max-width:42vw;height:100%;overflow-y:auto;
    background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;flex-shrink:0;
  }
  #map{flex:1 1 auto;height:100%;min-width:0}
  header.top{
    padding:16px 16px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;
    background:var(--panel);z-index:5;
  }
  header.top h1{font-size:16px;margin:0 0 4px;font-weight:700;letter-spacing:.2px}
  header.top p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
  .legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .dot.current{background:var(--current);box-shadow:0 0 0 2px rgba(46,160,67,.25)}
  .dot.older{background:var(--older);box-shadow:0 0 0 2px rgba(217,164,65,.25)}
  .dot.video{background:var(--accent);box-shadow:0 0 0 2px rgba(77,163,255,.25)}
  .section-title{
    padding:12px 16px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);font-weight:700;background:var(--panel);position:sticky;top:76px;z-index:4;
    border-bottom:1px solid var(--border);
  }
  .row{
    padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;
  }
  .row:hover{background:var(--panel2)}
  .row.active{background:var(--panel2);border-left:3px solid var(--accent)}
  .row-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:3px}
  .badge{
    flex-shrink:0;margin-top:3px;width:9px;height:9px;border-radius:50%;
  }
  .badge.current{background:var(--current)}
  .badge.older{background:var(--older)}
  .row-place{font-size:12.5px;font-weight:700;color:var(--text)}
  .row-headline{font-size:12.5px;color:var(--muted);line-height:1.4;margin-left:17px}
  .video-tag{
    display:inline-block;margin-left:17px;margin-top:4px;font-size:10px;color:var(--accent);
    border:1px solid rgba(77,163,255,.4);border-radius:3px;padding:1px 5px;letter-spacing:.03em;
  }
  .empty-note{padding:14px 16px;font-size:12.5px;color:var(--muted);font-style:italic}
  /* Leaflet tooltip / popup theming */
  .leaflet-popup-content-wrapper{background:#1c2430;color:var(--text);border-radius:8px}
  .leaflet-popup-tip{background:#1c2430}
  .leaflet-popup-content{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:12px 14px}
  .leaflet-popup-content a{color:var(--accent)}
  .pop-badge{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:3px;margin-bottom:6px;
  }
  .pop-badge.current{background:rgba(46,160,67,.2);color:#5fd576;border:1px solid rgba(95,213,118,.4)}
  .pop-badge.older{background:rgba(217,164,65,.2);color:#e8bf6a;border:1px solid rgba(232,191,106,.4)}
  .pop-headline{font-weight:700;margin:0 0 4px;font-size:13.5px}
  .pop-place{color:var(--muted);font-size:12px;margin-bottom:6px}
  .pop-desc{margin:0 0 8px;font-size:12.5px}
  .pop-meta{color:var(--muted);font-size:11.5px}
  .tt{
    background:#1c2430;color:var(--text);border:1px solid var(--border);border-radius:6px;
    font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

  }
  .tt b{font-size:12.5px}
  .tt .tt-badge{font-size:9.5px;font-weight:700;letter-spacing:.04em;margin-right:6px}
  .tt .tt-badge.current{color:#5fd576}
  .tt .tt-badge.older{color:#e8bf6a}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-thumb{background:#2a3542;border-radius:4px}
  @media (max-width:700px){
    #app{flex-direction:column}
    #sidebar{width:100%;max-width:100%;height:45%;order:2;border-right:none;border-top:1px solid var(--border)}

</style>

// ---- Map setup ----
const map = L.map('map', { zoomControl: true }).setView([39.5, -98.0], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19, subdomains: 'abcd'
}).addTo(map);

const markerById = {};

function colorFor(item){ return item.status === 'current' ? '#2ea043' : '#d9a441'; }

ITEMS.forEach(function(item){
  if (item.lat == null || item.lon == null) return; // national items have no pin
  const color = colorFor(item);
  const marker = L.circleMarker([item.lat, item.lon], {
    radius: item.status === 'current' ? 10 : 7,
    color: color, fillColor: color, fillOpacity: 0.85, weight: 2
  }).addTo(map);

  const badgeLabel = item.status === 'current' ? 'CURRENT · past 24h' : 'OLDER · background';
  const videoNote = item.type === 'video' ? ' <span style="color:#4da3ff">▶ official meeting video</span>' : '';

  marker.bindTooltip(
    '<div class="tt"><span class="tt-badge ' + item.status + '">' + badgeLabel + '</span>' + videoNote + '<br>' +
    '<b>' + item.place + (item.state ? ', ' + item.state : '') + '</b><br>' +
    item.headline + '<br>' +
    '<span style="color:#93a4b8">' + item.source + ' · ' + item.date + '</span></div>',
    { direction: 'top', offset: [0, -8], opacity: 1, className: 'tt-wrap', sticky: false }
  );

  marker.bindPopup(
    '<span class="pop-badge ' + item.status + '">' + badgeLabel + '</span>' + videoNote +
    '<p class="pop-headline">' + item.headline + '</p>' +
    '<p class="pop-place">' + item.place + (item.state ? ', ' + item.state : '') + '</p>' +
    '<p class="pop-desc">' + item.desc + '</p>' +
    '<p class="pop-meta">' + item.source + ' · ' + item.date + '<br><a href="' + item.url + '" target="_blank" rel="noopener">Read source →</a></p>'
  );

  markerById[item.id] = marker;
});

// ---- Sidebar ----
const list = document.getElementById('list');

function renderSection(title, items){
  if (!items.length) return;
  const secTitle = document.createElement('div');
  secTitle.className = 'section-title';
  secTitle.textContent = title;
  list.appendChild(secTitle);

  items.forEach(function(item){
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<div class="row-top"><span class="badge ' + item.status + '"></span>' +
      '<span class="row-place">' + item.place + (item.state ? ', ' + item.state : '') + '</span></div>' +
      '<div class="row-headline">' + item.headline + '</div>' +
      (item.type === 'video' ? '<div class="video-tag">▶ official meeting video</div>' : '');
    row.addEventListener('click', function(){
      document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
      row.classList.add('active');
      if (item.lat != null && item.lon != null){
        map.flyTo([item.lat, item.lon], 9, { duration: 0.9 });
        const m = markerById[item.id];
        if (m) setTimeout(() => m.openPopup(), 500);
      }
    });
    list.appendChild(row);
  });
}

const current = ITEMS.filter(i => i.status === 'current');
const older = ITEMS.filter(i => i.status === 'older');

renderSection('Past 24 Hours (Current)', current);
if (!current.some(i => i.lat != null)) {
  const note = document.createElement('div');
  note.className = 'empty-note';
  note.textContent = 'No newly-located current items beyond those listed above.';
  list.appendChild(note);
}
renderSection('Older / Background', older);
</script>
