<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map (last 24 hours)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f1419;--card:#1a2129;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;--accent:#4ea1ff;--current:#2ea043;--older:#b08800}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  .app{display:flex;height:100vh;width:100vw;overflow:hidden}
  #map{flex:1 1 auto;height:100%;min-width:0;background:#000}

  .sidebar{flex:0 0 340px;display:flex;flex-direction:column;border-left:1px solid var(--line);
    background:var(--bg);overflow:hidden}
  .sidehead{flex:0 0 auto;padding:14px 16px;border-bottom:1px solid var(--line)}
  .sidehead h1{font-size:15px;margin:0 0 4px}
  .sidehead .win{color:var(--muted);font-size:12px}
  .legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .sw.cur{background:var(--current)}
  .sw.old{background:var(--older)}

  .list{flex:1 1 auto;overflow-y:auto;padding:10px 12px}
  .grouptitle{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:14px 4px 6px;display:flex;align-items:center;gap:6px}
  .row{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:7px;padding:9px 11px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
  .row:hover{background:#212a33;border-color:#3a4756}
  .row.cur{border-left-color:var(--current)}
  .row.old{border-left-color:var(--older)}
  .row .loc{font-weight:700;font-size:13px}
  .row .head{color:var(--muted);font-size:12px;margin-top:2px}
  .row .meta{color:#6f7c89;font-size:11px;margin-top:4px}

  .leaflet-popup-content{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:230px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#4ea1ff}
  .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:1px 7px;border-radius:20px;margin-bottom:4px}
  .badge.cur{background:var(--current);color:#02160a}
  .badge.old{background:var(--older);color:#1a1400}

  .tt{font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:220px}
  .tt b{font-size:13px}

  @media (max-width:820px){
    .app{flex-direction:column}
    #map{flex:0 0 55vh}
    .sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="app">
  <div id="map"></div>
  <aside class="sidebar">
    <div class="sidehead">
      <h1>Data Center Community Response</h1>
      <div class="win">Window: prior 24 hours (July 4–5, 2026), with older context</div>
      <div class="legend">
        <span><span class="sw cur"></span>Past 24 hours</span>
        <span><span class="sw old"></span>Older / background</span>
      </div>
    </div>
    <div class="list" id="list"></div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var sites = [
  {loc:"Prince William County (Manassas), VA", lat:38.7509, lng:-77.4753, status:"cur",
    headline:"World's largest planned data center campus near Manassas Battlefield is dead",
    desc:"QTS Data Centers withdrew its Virginia Supreme Court appeal, ending the litigation and killing the 2,100-acre, 37-building 'PW Digital Gateway' project after years of homeowner and preservationist opposition.",
    source:"Tech Times", date:"July 4, 2026",
    url:"https://www.techtimes.com/articles/319715/20260704/ai-data-center-backlash-zoning-notice-rule-kills-worlds-largest-planned-campus.htm"},
  {loc:"Union County / Central Pennsylvania, PA", lat:40.9231, lng:-77.0011, status:"cur",
    headline:"Central Pennsylvania residents push back as data center proposals spread",
    desc:"Communities in Tioga, Jefferson and Mifflin counties, plus Gregg Township in Union County, are opposing new data center proposals; a zoning/conditional-use hearing on one project is set for July 20.",
    source:"WITF", date:"July 4, 2026",
    url:"https://www.witf.org/2026/07/04/possibility-of-data-centers-in-central-pa-sparks-public-pushback/"},

  {loc:"Nottingham, NH", lat:43.1042, lng:-71.0987, status:"old",
    headline:"Nottingham's 12-month data center moratorium heads to town vote",
    desc:"The planning board voted unanimously for a 12-month construction moratorium after a developer withdrew a proposal amid backlash; a special town meeting will let residents vote on it.",
    source:"New Hampshire Public Radio", date:"July 3, 2026",
    url:"https://www.nhpr.org/environment/2026-07-03/nottingham-data-center-moratorium-town-meeting-nh"},
  {loc:"East Fishkill, NY", lat:41.5245, lng:-73.8465, status:"old",
    headline:"East Fishkill freezes large data centers until 2029",
    desc:"The Town Board approved a three-year moratorium on data centers over 20MW after residents chanting \"We can't drink data\" packed a hearing, citing power bills and nearby Superfund sites.",
    source:"Highlands Current", date:"July 3, 2026",
    url:"https://highlandscurrent.org/2026/07/03/data-centers-face-backlash/"},
  {loc:"Frederick County, MD", lat:39.4143, lng:-77.4105, status:"old",
    headline:"Frederick County Council limits new data centers to a single zone",
    desc:"The council voted 5-2 to confine development to about 2,600 acres north of Adamstown after 21,000+ residents petitioned against a larger zone, days after the state Supreme Court blocked a referendum.",
    source:"WYPR", date:"July 2, 2026",
    url:"https://www.wypr.org/wypr-news/2026-07-02/frederick-county-will-limit-new-data-center-development"},
  {loc:"Washington County, MD", lat:39.6418, lng:-77.7200, status:"old",
    headline:"Washington County commissioners approve yearlong data center moratorium",
    desc:"Commissioners voted for a one-year pause on new applications, joining a wave of Maryland jurisdictions restricting development pending study of power and water impacts.",
    source:"Maryland Daily Record", date:"July 1, 2026",
    url:"https://thedailyrecord.com/2026/07/01/washington-county-approves-yearlong-data-center-moratorium/"},
  {loc:"Linn County, IA", lat:41.9779, lng:-91.6656, status:"old",
    headline:"Linn County supervisors approve 18-month data center moratorium",
    desc:"Supervisors voted 2-1 to pause new rezoning applications for large-scale data centers in unincorporated areas through Jan. 1, 2028, after resident concern over resource impacts.",
    source:"CBS2 Iowa", date:"July 1, 2026",
    url:"https://cbs2iowa.com/news/local/linn-county-bos-approve-18-month-moratorium-on-new-data-centers-in-unincorporated-areas"},
  {loc:"Prince George's County, MD", lat:38.8162, lng:-76.7497, status:"old",
    headline:"Prince George's County debates two-year data center moratorium amid dueling protests",
    desc:"About 75 residents rallied for a two-year development pause proposed by Council Chair Krystal Oriadha, citing air and water concerns, ahead of a scheduled council vote.",
    source:"WUSA9", date:"early July 2026",
    url:"https://www.wusa9.com/article/news/local/data/prince-georges-county-debates-2-year-data-center-development-moratorium/65-56745783-fb15-4ef1-9751-6769eecd091d"},
  {loc:"Minneapolis, MN", lat:44.9778, lng:-93.2650, status:"old",
    headline:"Minneapolis City Council approves 5-month data center development pause",
    desc:"Council passed an ordinance blocking new data-center permits above 350,000 sq ft outside downtown for several months, citing equity and community-impact concerns.",
    source:"CBS Minnesota", date:"late June 2026",
    url:"https://www.cbsnews.com/minnesota/news/minneapolis-city-council-data-center-pause/"},
  {loc:"Union County, AR", lat:33.2073, lng:-92.6663, status:"old",
    headline:"Union County Quorum Court approves one-year moratorium on data center expansion",
    desc:"The court voted unanimously for a one-year pause, calling it the largest crowd it has ever hosted, after word spread of a possible large-scale expansion of a cryptomining facility.",
    source:"KTVE / myarklamiss.com", date:"early July 2026",
    url:"https://www.myarklamiss.com/news/union-county-quorum-court-approves-moratorium-on-proposed-paradox-data-center/"},
  {loc:"Imperial County, CA", lat:32.7920, lng:-115.5631, status:"old",
    headline:"Imperial County passes temporary data center moratorium after months of pressure",
    desc:"Supervisors approved a temporary moratorium on new data centers following sustained public pressure over water use, in a county where one complex alone was projected to need 750,000 gallons/day.",
    source:"KPBS", date:"June 17, 2026",
    url:"https://www.kpbs.org/news/politics/2026/06/17/after-months-of-public-pressure-imperial-county-passes-temporary-moratorium-on-data-centers"},
  {loc:"Douglas County, GA", lat:33.7515, lng:-84.7477, status:"old",
    headline:"Douglas County residents push back on 700-acre data center proposal",
    desc:"Residents oppose a five-building complex near Liberty Road, arguing the county's 11 existing data centers are already more than its fair share of noise, water and utility strain.",
    source:"FOX 5 Atlanta", date:"late June 2026",
    url:"https://www.fox5atlanta.com/news/douglas-county-data-center-sparks-resident-pushback"},
  {loc:"Springfield, MO", lat:37.2090, lng:-93.2923, status:"old",
    headline:"Springfield City Council passes 120-day data center moratorium",
    desc:"Council voted 8-0 for a moratorium on new applications, giving staff time to study water/energy use, noise and zoning standards; set to expire Nov. 17, 2026.",
    source:"KY3", date:"June 29, 2026",
    url:"https://www.ky3.com/2026/06/29/springfield-city-council-passes-120-day-moratorium-data-centers-heres-what-happens-next/"},
  {loc:"Nashville, TN", lat:36.1627, lng:-86.7816, status:"old",
    headline:"Nashville planning commission meeting becomes a referendum on data centers",
    desc:"More than 150 residents denounced planned projects and backed proposed zoning restrictions, some waiting up to five hours in 90-degree heat to speak.",
    source:"Nashville Banner", date:"June 12, 2026",
    url:"https://nashvillebanner.com/2026/06/12/nashville-data-centers-planning-commission-meeting/"},
  {loc:"Monterey Park, CA", lat:34.0625, lng:-118.1228, status:"old",
    headline:"Monterey Park voters approve first voter-enacted municipal data center ban",
    desc:"A ballot measure prohibiting data centers within city limits passed with 86% support, believed to be the first voter-enacted municipal ban on data center development in the U.S.",
    source:"The Cool Down", date:"June 2026",
    url:"https://www.thecooldown.com/green-tech/data-center-opposition-across-the-nation/"},
  {loc:"Dowagiac, MI", lat:41.9836, lng:-86.1103, status:"old",
    headline:"Residents sue Michigan data center over 'excessive' noise",
    desc:"A class action lawsuit claims a hyperscale data center's cooling systems and onsite power supply produce unreasonable, excessive noise.",
    source:"WWMT", date:"May 2026",
    url:"https://wwmt.com/news/local/lawsuit-hyperscale-data-center-dowagiac-noise-class-action-business-center-legal-osha-decibels-contained-digital-asset-mining-facility-rural-southwest-michigan-infrastructure"},
  {loc:"Cumberland County (Vineland), NJ", lat:39.4864, lng:-75.0257, status:"old",
    headline:"Cumberland County residents file class action over data center 'humming' noise",
    desc:"Neighbors of a massive AI data center claim in federal court that an 'annoying' industrial hum can be heard day and night.",
    source:"Government Technology", date:"May 2026",
    url:"https://www.govtech.com/artificial-intelligence/new-jersey-neighbors-sue-over-humming-noise-from-data-center"}
];

var map = L.map('map', {zoomControl:true}).setView([39.5, -95.5], 4.4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

var markers = [];
sites.forEach(function(s, i){
  var color = s.status === 'cur' ? '#2ea043' : '#b08800';
  var m = L.circleMarker([s.lat, s.lng], {
    radius: s.status === 'cur' ? 10 : 8,
    color: color, fillColor: color, fillOpacity: 0.85, weight: 2
  }).addTo(map);

  var badge = s.status === 'cur' ? '<span class="badge cur">Current</span>' : '<span class="badge old">Older</span>';
  m.bindTooltip(
    '<div class="tt">'+badge+'<br><b>'+s.loc+'</b><br>'+s.headline+'<br><span style="color:#9aa7b4">'+s.desc+'</span><br>'+
    '<span style="color:#6f7c89">'+s.source+' · '+s.date+'</span></div>',
    {direction:'top', offset:[0,-6], opacity:0.97}
  );
  m.bindPopup(
    '<div>'+badge+'<br><b>'+s.loc+'</b><br>'+s.headline+'<br>'+
    '<a href="'+s.url+'" target="_blank" rel="noopener">'+s.source+' · '+s.date+' &rarr;</a></div>'
  );
  markers.push(m);
});

var list = document.getElementById('list');
function renderGroup(title, status){
  var h = document.createElement('div');
  h.className = 'grouptitle';
  h.innerHTML = (status==='cur' ? '<span class="sw cur"></span>' : '<span class="sw old"></span>') + title;
  list.appendChild(h);
  sites.forEach(function(s, i){
    if (s.status !== status) return;
    var row = document.createElement('div');
    row.className = 'row ' + status;
    row.innerHTML = '<div class="loc">'+s.loc+'</div><div class="head">'+s.headline+'</div>'+
      '<div class="meta">'+s.source+' · '+s.date+'</div>';
    row.addEventListener('click', function(){
      map.flyTo([s.lat, s.lng], 8, {duration: 0.8});
      markers[i].openPopup();
    });
    list.appendChild(row);
  });
}
renderGroup('Past 24 Hours (Current)', 'cur');
renderGroup('Older / Background', 'old');
</script>
</body>
</html>
