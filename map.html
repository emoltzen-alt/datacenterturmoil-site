<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map (last 24 hours)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#0f1419;--panel:#151b22;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;
    --accent:#4ea1ff;--current:#2ea043;--older:#d29922;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  #app{display:flex;height:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}
  #sidebar{flex:0 0 320px;height:100%;overflow-y:auto;border-left:1px solid var(--line);
    background:var(--panel);display:flex;flex-direction:column}
  #sidebar h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    margin:0;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
  .legend{font-size:11px;color:var(--muted);padding:8px 14px;border-bottom:1px solid var(--line);display:flex;gap:14px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend .sw{width:9px;height:9px;border-radius:50%;display:inline-block}
  .legend .sw.c{background:var(--current)}
  .legend .sw.o{background:var(--older)}
  .grouplabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    padding:10px 14px 4px}
  .row{padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:#1c242c}
  .row .name{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
  .row .name .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .row .headline{color:var(--muted);font-size:12px;margin-top:2px}
  .leaflet-popup-content-wrapper{background:#1c242c;color:var(--ink);border:1px solid var(--line)}
  .leaflet-popup-tip{background:#1c242c}
  .leaflet-popup-content{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:10px 12px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:var(--accent)}
  .pop-badge{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;
    padding:1px 6px;border-radius:4px;margin-bottom:4px}
  .pop-badge.current{background:rgba(46,160,67,.18);color:#4fd97a;border:1px solid rgba(46,160,67,.5)}
  .pop-badge.older{background:rgba(210,153,34,.18);color:#e8b84b;border:1px solid rgba(210,153,34,.5)}
  .tt{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:220px}
  .tt b{display:block;font-size:13.5px;margin-bottom:2px}
  .tt .m{color:#aab4bf;font-size:11.5px;margin-top:3px}
  @media (max-width:820px){
    #app{flex-direction:column}
    #map{flex:0 0 55vh}
    #sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>

    <div class="legend">

      <span><i class="sw o"></i>Older / background</span>
    </div>
    <div id="list"></div>
  </div>
</div>

// ---- Map setup ----
var map = L.map('map', {scrollWheelZoom:true}).setView([39.5, -96.0], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

var COLORS = {current:'#2ea043', older:'#d29922'};
var markers = [];

items.forEach(function(it, idx){
  var color = COLORS[it.status];
  var marker = L.circleMarker([it.lat, it.lng], {
    radius: it.status === 'current' ? 9 : 7,
    color: color, fillColor: color, fillOpacity: 0.85, weight: 2
  }).addTo(map);

  var tooltipHtml = '<div class="tt"><b>'+it.loc+'</b>'
    + '<div>'+(it.status==='current' ? 'CURRENT (past 24h)' : 'OLDER / background')+'</div>'
    + '<div>'+it.headline+'</div>'
    + '<div class="m">'+it.desc+'</div>'
    + '<div class="m">'+it.source+' · '+it.date+'</div></div>';
  marker.bindTooltip(tooltipHtml, {direction:'top', offset:[0,-6]});

  var popupHtml = '<span class="pop-badge '+it.status+'">'+(it.status==='current'?'Current':'Older')+'</span>'
    + '<br><b>'+it.loc+'</b>'
    + '<div style="margin:4px 0">'+it.headline+'</div>'
    + '<div style="color:#aab4bf">'+it.desc+'</div>'
    + '<div style="margin-top:6px">'+it.source+' · '+it.date+'</div>'
    + '<div style="margin-top:4px"><a href="'+it.url+'" target="_blank" rel="noopener">Read source →</a></div>';
  marker.bindPopup(popupHtml);

  markers.push(marker);
});

// ---- Sidebar ----
var listEl = document.getElementById('list');

function renderGroup(title, status){
  var groupItems = items.map(function(it,i){return {it:it, idx:i};}).filter(function(o){return o.it.status===status;});
  var label = document.createElement('div');
  label.className = 'grouplabel';
  label.textContent = title + ' (' + groupItems.length + ')';
  listEl.appendChild(label);

  groupItems.forEach(function(o){
    var it = o.it, idx = o.idx;
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<div class="name"><span class="dot" style="background:'+COLORS[it.status]+'"></span>'+it.loc+'</div>'
      + '<div class="headline">'+it.headline+'</div>';
    row.addEventListener('click', function(){
      map.flyTo([it.lat, it.lng], 9, {duration:0.8});
      markers[idx].openPopup();
    });
    listEl.appendChild(row);
  });
}

renderGroup('Past 24 Hours (Current)', 'current');
renderGroup('Older / Background', 'older');
