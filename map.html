<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0f1419; --panel:#141b22; --ink:#e6edf3; --muted:#9aa7b4; --faint:#6b7885;
    --line:#2a333d; --accent:#4ea1ff; --current:#2ea043; --current-bg:#12271a;
    --older:#d29922; --older-bg:#2a2210;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg)}
  body{
    color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; height:100vh; overflow:hidden;
  }

  #mapwrap{flex:1 1 auto; position:relative; min-width:0}
  #map{width:100%; height:100%; background:#0b0e12}

  .legend-box{
    position:absolute; bottom:16px; left:16px; z-index:500;
    background:rgba(20,27,34,.92); border:1px solid var(--line); border-radius:8px;
    padding:10px 14px; font-size:12.5px; color:var(--ink); backdrop-filter:blur(2px);
  }
  .legend-box .row{display:flex; align-items:center; gap:8px; margin-bottom:4px}
  .legend-box .row:last-child{margin-bottom:0}
  .legend-box .sw{width:12px; height:12px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 2px rgba(0,0,0,.35)}
  .legend-box .sw.current{background:var(--current)}
  .legend-box .sw.older{background:var(--older)}
  .legend-box .title{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:6px}

  #sidebar{
    flex:0 0 380px; display:flex; flex-direction:column; background:var(--bg);
    border-left:1px solid var(--line); min-width:0;
  }
  #sidebar .head{flex:0 0 auto; padding:14px 16px 10px; border-bottom:1px solid var(--line)}
  #sidebar .head h1{font-size:15px; margin:0 0 3px}
  #sidebar .head .sub{color:var(--muted); font-size:11.5px}
  #sidebar .scroll{flex:1 1 auto; overflow-y:auto; padding:10px 12px}

  .group-title{
    display:flex; align-items:center; gap:7px; font-size:11.5px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--muted); margin:14px 4px 8px; padding-bottom:5px;
    border-bottom:1px solid var(--line);
  }
  .group-title:first-child{margin-top:2px}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex:0 0 auto}
  .dot.current{background:var(--current)}
  .dot.older{background:var(--older)}

  .row-item{
    display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line);
    border-left:3px solid var(--older); border-radius:7px; padding:8px 10px; margin-bottom:7px;
    cursor:pointer; color:var(--ink); font-family:inherit;
  }
  .row-item.current{border-left-color:var(--current)}
  .row-item:hover{border-color:#3a4553; background:#171f28}
  .row-item.active{outline:2px solid var(--accent); outline-offset:-1px}
  .row-item .place{font-weight:600; font-size:13px}
  .row-item .headline{color:#c3cdd6; font-size:12px; margin-top:2px}
  .row-item .meta{color:var(--faint); font-size:10.5px; margin-top:4px}

  .empty-note{color:var(--muted); font-size:12.5px; font-style:italic; padding:6px 4px 12px}

  /* Leaflet dark tweaks */
  .leaflet-popup-content-wrapper{background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px}
  .leaflet-popup-tip{background:var(--panel); border:1px solid var(--line)}
  .leaflet-popup-content{margin:10px 12px; font-size:12.5px; line-height:1.5}
  .leaflet-popup-content a{color:var(--accent); font-weight:600}
  .leaflet-container a.leaflet-popup-close-button{color:var(--muted)}

  .tt-card{font-size:12px; line-height:1.4; max-width:230px}
  .tt-card .badge{
    display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em;
    padding:1px 6px; border-radius:20px; margin-bottom:4px; font-weight:700;
  }
  .tt-card .badge.current{background:var(--current-bg); color:#5fd47c; border:1px solid #245c33}
  .tt-card .badge.older{background:var(--older-bg); color:#e8bb52; border:1px solid #5c4a17}
  .tt-card .place{font-weight:700; font-size:12.5px; margin-bottom:2px}
  .tt-card .headline{color:#dfe6ec; margin-bottom:3px}
  .tt-card .desc{color:#a9b4bf; margin-bottom:3px}
  .tt-card .src{color:#8894a1; font-size:11px}

  @media (max-width:820px){
    body{flex-direction:column; overflow:auto; height:auto}
    #mapwrap{height:60vh; flex:0 0 60vh}
    #sidebar{flex:1 1 auto; border-left:0; border-top:1px solid var(--line)}
  }
</style>
</head>
<body>

<div id="mapwrap">
  <div id="map"></div>
  <div class="legend-box">
    <div class="title">Legend</div>
    <div class="row"><span class="sw current"></span> Past 24 Hours (Current)</div>
    <div class="row"><span class="sw older"></span> Older / Background</div>
  </div>
</div>

<div id="sidebar">
  <div class="head">
    <h1>Data Center Community Response</h1>
    <div class="sub">Click a row to fly to its pin · 24h window: Aug 14–15, 2026</div>
  </div>
  <div class="scroll" id="scroll"></div>
</div>

  {id:17, place:"Southaven, MS", state:"MS", lat:34.9890, lon:-90.0126, status:"OLDER",

  {id:27, place:"Guadalupe County, TX", state:"TX", lat:29.5688, lon:-97.9647, status:"OLDER",
   headline:"Group sues county and commissioners court over data centers",

   source:"Seguin Gazette", date:"Aug 2026", url:"https://seguingazette.com/alert/group-sues-guadalupe-county-commissioners-court-over-data-centers/article_700bc7f0-a473-4258-bcb8-c68994aeccc3.html"},

// ---- Map init ----
const map = L.map('map', {zoomControl:true, minZoom:3, maxZoom:12}).setView([39.5, -96.5], 4);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const COLOR = {CURRENT:'#2ea043', OLDER:'#d29922'};
const markers = {};

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

ITEMS.forEach(item => {
  const color = COLOR[item.status];
  const marker = L.circleMarker([item.lat, item.lon], {
    radius: item.status === 'CURRENT' ? 8 : 7,
    fillColor: color,
    color: '#0b0e12',
    weight: 2,
    fillOpacity: 0.92
  }).addTo(map);

  const badgeClass = item.status === 'CURRENT' ? 'current' : 'older';
  const badgeLabel = item.status === 'CURRENT' ? 'Current' : 'Older';

  const tooltipHtml = `
    <div class="tt-card">
      <span class="badge ${badgeClass}">${badgeLabel}</span>
      <div class="place">${escapeHtml(item.place)}</div>
      <div class="headline">${escapeHtml(item.headline)}</div>
      <div class="desc">${escapeHtml(item.desc)}</div>
      <div class="src">${escapeHtml(item.source)} · ${escapeHtml(item.date)}</div>
    </div>`;
  marker.bindTooltip(tooltipHtml, {direction:'top', offset:[0,-6], opacity:1, className:'tt-wrap', sticky:false});

  const popupHtml = `
    <div class="tt-card">
      <span class="badge ${badgeClass}">${badgeLabel}</span>
      <div class="place">${escapeHtml(item.place)}</div>
      <div class="headline">${escapeHtml(item.headline)}</div>
      <div class="desc">${escapeHtml(item.desc)}</div>
      <div class="src">${escapeHtml(item.source)} · ${escapeHtml(item.date)}</div>
      <div style="margin-top:6px"><a href="${item.url}" target="_blank" rel="noopener">Read source →</a></div>
    </div>`;
  marker.bindPopup(popupHtml);

  markers[item.id] = marker;
});

// ---- Sidebar ----
const scrollEl = document.getElementById('scroll');
const current = ITEMS.filter(i => i.status === 'CURRENT');
const older = ITEMS.filter(i => i.status === 'OLDER');

function rowHtml(item){
  const cls = item.status === 'CURRENT' ? 'current' : '';
  return `<button class="row-item ${cls}" data-id="${item.id}">
      <div class="place">${escapeHtml(item.place)}</div>
      <div class="headline">${escapeHtml(item.headline)}</div>
      <div class="meta">${escapeHtml(item.source)} · ${escapeHtml(item.date)}</div>
    </button>`;
}

let html = '';
html += `<div class="group-title"><span class="dot current"></span> Past 24 Hours (Current)</div>`;
html += current.length ? current.map(rowHtml).join('') : `<div class="empty-note">Nothing genuinely new in this window beyond the items listed.</div>`;
html += `<div class="group-title"><span class="dot older"></span> Older / Background</div>`;
html += older.length ? older.map(rowHtml).join('') : `<div class="empty-note">No background items.</div>`;
scrollEl.innerHTML = html;

scrollEl.querySelectorAll('.row-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const id = Number(btn.getAttribute('data-id'));
    const item = ITEMS.find(i => i.id === id);
    if(!item) return;
    scrollEl.querySelectorAll('.row-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    map.flyTo([item.lat, item.lon], 8, {duration:0.8});
    const m = markers[id];
    if(m){ setTimeout(() => m.openPopup(), 500); }
  });
});
</script>
</body>
</html>
