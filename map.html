<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map (last 24 hours)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f1419;--card:#1a2129;--ink:#e6edf3;--muted:#9aa7b4;--accent:#4ea1ff;
    --current:#2ea043;--older:#b08800;--line:#2a333d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .app{display:flex;height:100%;width:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}
  .sidebar{flex:0 0 380px;display:flex;flex-direction:column;border-left:1px solid var(--line);
    background:var(--bg);height:100%;overflow:hidden}
  .sidebar header{flex:0 0 auto;padding:14px 16px;border-bottom:1px solid var(--line)}
  .sidebar h1{font-size:16px;margin:0 0 4px}
  .sidebar .range{color:var(--muted);font-size:12px}
  .legend{display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;flex:0 0 auto}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:10px;height:10px;border-radius:50%;display:inline-block}
  .sw.cur{background:var(--current)}
  .sw.old{background:var(--older)}
  .list{flex:1 1 auto;overflow-y:auto;padding:8px 10px}
  .grouplabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:14px 6px 6px;padding-top:6px}
  .row{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:7px;padding:9px 11px;margin:0 0 8px;cursor:pointer;transition:background .15s}
  .row:hover{background:#212a33}
  .row.cur{border-left-color:var(--current)}
  .row.old{border-left-color:var(--older)}
  .row .place{font-weight:700;font-size:13px}
  .row .headline{color:var(--muted);font-size:12px;margin-top:3px}
  .row .meta{color:var(--muted);font-size:11px;margin-top:4px}
  .video-badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
    background:#5b3fd6;color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
  .leaflet-popup-content{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#2b6fd4}
  .tt{font:12px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:230px}
  .tt b{font-size:13px;display:block;margin-bottom:2px}
  .tt .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
    border-radius:4px;padding:1px 6px;margin-bottom:4px}
  .tt .badge.cur{background:var(--current);color:#02160a}
  .tt .badge.old{background:var(--older);color:#1a1400}
  .tt .loc{color:#bcc6cf;font-size:11px;margin:2px 0}
  .tt .src{color:#8b98a5;font-size:11px;margin-top:3px}
  @media (max-width:820px){
    .app{flex-direction:column}
    #map{flex:0 0 55vh}
    .sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="app">
  <div id="map"></div>
  <div class="sidebar">
    <header>
      <h1>Data Center Community Response</h1>
      <div class="range">Window: prior 24 hours (Sept 24–25, 2026), plus older background</div>
    </header>
    <div class="legend">
      <span><span class="sw cur"></span>Current (24h)</span>
      <span><span class="sw old"></span>Older / Background</span>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

var map = L.map('map').setView([39.5, -96.5], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

var markers = [];
sites.forEach(function(s, i){
  var color = s.current ? '#2ea043' : '#b08800';
  var m = L.circleMarker([s.lat, s.lon], {
    radius: s.current ? 9 : 7, color: color, fillColor: color, fillOpacity: 0.85, weight: 2
  }).addTo(map);

  var badgeClass = s.current ? 'cur' : 'old';
  var badgeText = s.current ? 'CURRENT' : 'OLDER';
  var ttHtml = '<div class="tt"><span class="badge '+badgeClass+'">'+badgeText+'</span>'+
    '<b>'+s.headline+'</b>'+
    '<div class="loc">'+s.place+'</div>'+
    '<div>'+s.desc+'</div>'+
    '<div class="src">'+s.source+' · '+s.date+'</div></div>';
  m.bindTooltip(ttHtml, {direction:'top', offset:[0,-6]});

  var popupHtml = '<b>'+s.place+'</b><br>'+s.headline+'<br>'+
    '<a href="'+s.url+'" target="_blank" rel="noopener">'+s.source+' — '+s.date+'</a>';
  m.bindPopup(popupHtml);

  markers.push(m);
});

var list = document.getElementById('list');
function addGroup(label, filterCurrent){
  var g = document.createElement('div');
  g.className = 'grouplabel';
  g.textContent = label;
  list.appendChild(g);
  sites.forEach(function(s, i){
    if (s.current !== filterCurrent) return;
    var row = document.createElement('div');
    row.className = 'row ' + (s.current ? 'cur' : 'old');
    row.innerHTML = '<div class="place">'+s.place+'</div>'+
      '<div class="headline">'+s.headline+'</div>'+
      '<div class="meta">'+s.source+' · '+s.date+'</div>';
    row.addEventListener('click', function(){
      map.flyTo([s.lat, s.lon], 9, {duration: 0.8});
      markers[i].openPopup();
    });
    list.appendChild(row);
  });
}
addGroup('Past 24 Hours (Current)', true);
addGroup('Older / Background', false);
</script>
</body>
</html>
