<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0f1419; --panel:#161d26; --ink:#e6edf3; --muted:#9aa7b4; --line:#2a333d;
    --current:#2ea043; --current-bg:#12301c; --older:#d29922; --older-bg:#3a2c0f; --link:#7cc4ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg)}
  body{
    color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; height:100vh; overflow:hidden;
  }
  #map{flex:1 1 auto; min-width:0; height:100%; background:#0b0f14}

  #sidebar{
    flex:0 0 320px; height:100%; overflow-y:auto; background:var(--panel);
    border-left:1px solid var(--line);
  }
  #sidebar .head{padding:14px 16px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:5}
  #sidebar h1{font-size:14.5px; margin:0 0 4px}
  #sidebar .sub{color:var(--muted); font-size:11.5px}
  .legend-row{display:flex; gap:14px; margin-top:8px; font-size:11.5px; color:var(--muted)}
  .legend-row span{display:flex;align-items:center;gap:5px}
  .swatch{width:10px;height:10px;border-radius:50%;display:inline-block}
  .swatch.current{background:var(--current)}
  .swatch.older{background:var(--older)}

  .group-label{
    padding:10px 16px 6px; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); display:flex; align-items:center; gap:7px;
  }
  .row{
    padding:8px 16px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .row:hover{background:#1d2733}
  .row .rp{font-weight:600; font-size:12.5px}
  .row .rh{font-size:12px; color:#c3cbd4; margin-top:2px}
  .row .rm{font-size:10.5px; color:var(--muted); margin-top:3px}

  /* Leaflet dark tweaks */
  .leaflet-container{background:#0b0f14}
  .leaflet-popup-content-wrapper{background:var(--panel); color:var(--ink); border:1px solid var(--line)}
  .leaflet-popup-tip{background:var(--panel)}
  .popup-place{font-weight:700; font-size:13px; margin-bottom:2px}
  .popup-badge{font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; padding:1px 6px; border-radius:20px; margin-left:6px}
  .popup-badge.current{background:var(--current-bg); color:#4fd67a}
  .popup-badge.older{background:var(--older-bg); color:#e8b84b}
  .popup-headline{font-weight:600; font-size:12.5px; margin:6px 0 4px}
  .popup-desc{font-size:12px; color:#c3cbd4; margin-bottom:6px}
  .popup-meta{font-size:11px; color:var(--muted)}
  .popup-meta a{color:var(--link)}

  .tt-card{
    background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px;
    padding:8px 10px; font-size:12px; max-width:230px; box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .tt-place{font-weight:700; font-size:12.5px}
  .tt-badge{font-size:9.5px; text-transform:uppercase; font-weight:700; padding:1px 5px; border-radius:20px; margin-left:5px}
  .tt-badge.current{background:var(--current-bg); color:#4fd67a}
  .tt-badge.older{background:var(--older-bg); color:#e8b84b}
  .tt-headline{font-weight:600; margin:4px 0 2px}
  .tt-desc{color:#c3cbd4; margin-bottom:3px}
  .tt-meta{color:var(--muted); font-size:10.5px}
  .leaflet-tooltip{background:transparent; border:0; box-shadow:none; padding:0}
  .leaflet-tooltip:before{display:none}

  @media (max-width:760px){
    body{flex-direction:column}
    #map{flex:0 0 55vh}
    #sidebar{flex:1 1 auto; border-left:0; border-top:1px solid var(--line)}
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="sidebar">
  <div class="head">
    <h1>Data Center Community Response</h1>
    <div class="sub">24h window: Aug 16–17, 2026 · Click a pin or a row</div>
    <div class="legend-row">
      <span><span class="swatch current"></span>Current (past 24h)</span>
      <span><span class="swatch older"></span>Older / background</span>
    </div>
  </div>
  <div id="list"></div>
</div>

const map = L.map('map', {zoomControl:true}).setView([39.5, -97.5], 4.6);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// Custom legend control
const legend = L.control({position:'bottomleft'});
legend.onAdd = function(){
  const div = L.DomUtil.create('div');
  div.style.background = 'var(--panel)';
  div.style.border = '1px solid var(--line)';
  div.style.borderRadius = '8px';
  div.style.padding = '8px 12px';
  div.style.color = 'var(--ink)';
  div.style.fontSize = '12px';
  div.style.lineHeight = '1.8';
  div.innerHTML = `
    <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#2ea043;margin-right:6px"></span>Current (past 24h)</div>
    <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#d29922;margin-right:6px"></span>Older / background</div>
  `;
  return div;
};
legend.addTo(map);

function makeIcon(status){
  const color = status === 'current' ? '#2ea043' : '#d29922';
  const glow = status === 'current' ? 'rgba(46,160,67,.55)' : 'rgba(210,153,34,.55)';
  return L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid #0f1419;box-shadow:0 0 0 4px ${glow}"></div>`,
    iconSize: [16,16],
    iconAnchor: [8,8]
  });
}

const markers = [];

items.forEach((item, i) => {
  const marker = L.marker([item.lat, item.lon], {icon: makeIcon(item.status)}).addTo(map);

  const badgeClass = item.status === 'current' ? 'current' : 'older';
  const badgeLabel = item.status === 'current' ? 'CURRENT' : 'OLDER';

  marker.bindTooltip(`
    <div class="tt-card">
      <div><span class="tt-place">${item.place}</span><span class="tt-badge ${badgeClass}">${badgeLabel}</span></div>
      <div class="tt-headline">${item.headline}</div>
      <div class="tt-desc">${item.desc}</div>
      <div class="tt-meta">${item.source} · ${item.date}</div>
    </div>
  `, {direction:'top', offset:[0,-10], opacity:1, sticky:false});

  marker.bindPopup(`
    <div class="popup-place">${item.place}<span class="popup-badge ${badgeClass}">${badgeLabel}</span></div>
    <div class="popup-headline">${item.headline}${item.type==='video' ? ' 🎥' : ''}</div>
    <div class="popup-desc">${item.desc}</div>
    <div class="popup-meta">${item.source} · ${item.date}<br><a href="${item.url}" target="_blank" rel="noopener">Open source →</a></div>
  `);

  markers.push(marker);
});

// Sidebar list, grouped
const list = document.getElementById('list');

function renderGroup(status, label){
  const group = items.map((it, i) => ({...it, idx:i})).filter(it => it.status === status);
  const wrap = document.createElement('div');
  const gl = document.createElement('div');
  gl.className = 'group-label';
  gl.innerHTML = `<span class="swatch ${status}"></span>${label} (${group.length})`;
  wrap.appendChild(gl);

  group.forEach(it => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="rp">${it.place}${it.type==='video' ? ' 🎥' : ''}</div>
      <div class="rh">${it.headline}</div>
      <div class="rm">${it.source} · ${it.date}</div>
    `;
    row.addEventListener('click', () => {
      map.flyTo([it.lat, it.lon], 9, {duration: 0.8});
      markers[it.idx].openPopup();
    });
    wrap.appendChild(row);
  });
  list.appendChild(wrap);
}

renderGroup('current', 'Past 24 Hours (Current)');
renderGroup('older', 'Older / Background');
</script>
</body>
</html>
