<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map (last 24 hours)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#0f1419; --panel:#141a21; --ink:#e6edf3; --muted:#9aa7b4; --line:#2a333d;
    --current:#2ea043; --older:#d29922; --link:#79c0ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  #app{display:flex;height:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}

  #sidebar{width:340px;flex:0 0 340px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;height:100%}
  #sidebar .head{padding:12px 14px;border-bottom:1px solid var(--line)}
  #sidebar h1{font-size:14px;margin:0 0 4px}
  #sidebar .sub{font-size:11.5px;color:var(--muted)}
  .legend{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:5px}
  .swatch{width:10px;height:10px;border-radius:50%;display:inline-block}
  .swatch.current{background:var(--current)}
  .swatch.older{background:var(--older)}

  #list{flex:1 1 auto;overflow-y:auto}
  .group-title{position:sticky;top:0;background:var(--panel);z-index:2;
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    padding:8px 14px;border-bottom:1px solid var(--line)}
  .row{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
  .row:hover{background:#1b232c}
  .row .rtop{display:flex;align-items:center;gap:7px}
  .row .place{font-weight:600;font-size:13px}
  .row .headline{font-size:12px;color:#c9d4de;margin-top:2px}
  .row .meta{font-size:11px;color:var(--muted);margin-top:2px}

  /* hover tooltip card */
  .leaflet-tooltip.dc-tip{
    background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; font-size:12.5px; max-width:260px; box-shadow:0 6px 18px rgba(0,0,0,.5);
  }
  .dc-tip .badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;padding:1px 6px;border-radius:20px;margin-bottom:4px}
  .dc-tip .badge.current{background:var(--current);color:#eafff1}
  .dc-tip .badge.older{background:var(--older);color:#241900}
  .dc-tip .place{font-weight:700;font-size:13px;margin-bottom:2px}
  .dc-tip .headline{font-style:italic;color:#c9d4de;margin-bottom:3px}
  .dc-tip .desc{color:var(--ink)}
  .dc-tip .src{color:var(--muted);font-size:11px;margin-top:4px}

  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .leaflet-popup-tip{background:var(--panel)}
  .leaflet-popup-content{font-size:13px;line-height:1.5;margin:10px 12px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:var(--link)}

  @media (max-width:820px){
    #app{flex-direction:column}
    #map{flex:0 0 55vh}
    #sidebar{width:100%;flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>

  <div id="map"></div>
  <aside id="sidebar">
    <div class="head">
      <h1>Data Center Community Response</h1>

      <div class="legend">
        <span><i class="swatch current"></i> Current (24h)</span>
        <span><i class="swatch older"></i> Older / Background</span>
      </div>
    </div>
    <div id="list"></div>
  </aside>
</div>

var map = L.map('map', {zoomControl:true}).setView([39.5, -95.5], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19, subdomains:'abcd'
}).addTo(map);

var COLORS = {current:'#2ea043', older:'#d29922'};
var markers = [];

sites.forEach(function(s, i){
  var color = COLORS[s.status];
  var marker = L.circleMarker([s.lat, s.lng], {
    radius: s.status === 'current' ? 9 : 7,
    color: color, fillColor: color, fillOpacity: 0.85, weight: 2
  }).addTo(map);

  var badgeLabel = s.status === 'current' ? 'CURRENT' : 'OLDER';
  var tipHtml =
    '<div class="badge ' + s.status + '">' + badgeLabel + (s.type === 'video' ? ' · VIDEO' : '') + '</div>' +
    '<div class="place">' + s.place + '</div>' +
    '<div class="headline">' + s.headline + '</div>' +
    '<div class="desc">' + s.desc + '</div>' +
    '<div class="src">' + s.source + ' · ' + s.date + '</div>';
  marker.bindTooltip(tipHtml, {className:'dc-tip', direction:'top', offset:[0,-4], opacity:1});

  var popupHtml =
    '<b>' + s.place + '</b><br>' + s.headline + '<br><br>' + s.desc +
    '<br><br><a href="' + s.url + '" target="_blank" rel="noopener">' + s.source + ' →</a>';
  marker.bindPopup(popupHtml);

  markers.push(marker);
});

// ---- sidebar ----
var listEl = document.getElementById('list');

function rowHtml(s, idx){
  var dotColor = COLORS[s.status];
  return '<div class="row" data-idx="' + idx + '">' +
    '<div class="rtop"><i class="swatch" style="background:' + dotColor + '"></i>' +
    '<span class="place">' + s.place + (s.type === 'video' ? ' 🎥' : '') + '</span></div>' +
    '<div class="headline">' + s.headline + '</div>' +
    '<div class="meta">' + s.source + ' · ' + s.date + '</div>' +
    '</div>';
}

var currentItems = [], olderItems = [];
sites.forEach(function(s, i){
  (s.status === 'current' ? currentItems : olderItems).push({s:s, idx:i});
});

var html = '';
html += '<div class="group-title">Past 24 Hours (Current) — ' + currentItems.length + '</div>';
currentItems.forEach(function(o){ html += rowHtml(o.s, o.idx); });
html += '<div class="group-title">Older / Background — ' + olderItems.length + '</div>';
olderItems.forEach(function(o){ html += rowHtml(o.s, o.idx); });
listEl.innerHTML = html;

listEl.querySelectorAll('.row').forEach(function(row){
  row.addEventListener('click', function(){
    var idx = parseInt(row.getAttribute('data-idx'), 10);
    var s = sites[idx];
    map.flyTo([s.lat, s.lng], 8, {duration: 0.8});
    markers[idx].openPopup();
  });
});
</script>
