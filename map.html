<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Data Center Turmoil — Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bg:#0b0d12; --panel:#12151c; --panel2:#171b24; --border:#262b36;
    --text:#e8eaf0; --muted:#9aa3b2; --green:#57d38c; --amber:#f5b942; --link:#7db9ff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    padding:14px 20px; border-bottom:1px solid var(--border); background:var(--panel);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; z-index:1000;
  }
  header h1{font-size:1.1rem; margin:0;}
  header .win{font-size:0.8rem; color:var(--muted);}
  .legend-inline{display:flex; gap:16px; align-items:center; font-size:0.82rem; color:var(--muted);}
  .legend-inline .sw{width:11px; height:11px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:middle;}
  .app{flex:1; display:flex; min-height:0;}
  #sidebar{
    width:340px; min-width:280px; max-width:40vw; overflow-y:auto; background:var(--panel);
    border-right:1px solid var(--border);
  }
  #map{flex:1; min-width:0;}
  .sb-section h2{
    font-size:0.78rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted);
    margin:0; padding:14px 16px 8px; position:sticky; top:0; background:var(--panel); z-index:2;
  }
  .row{
    padding:10px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s;
  }
  .row:hover{background:var(--panel2);}
  .row .rp{font-weight:600; font-size:0.88rem; display:flex; align-items:center; gap:6px;}
  .row .rp .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .row .rh{font-size:0.8rem; color:#c3c9d6; margin-top:3px;}
  .row .rm{font-size:0.72rem; color:var(--muted); margin-top:3px;}
  .empty-note{padding:12px 16px; font-size:0.82rem; color:var(--muted);}
  .leaflet-popup-content-wrapper{background:#171b24; color:var(--text); border:1px solid var(--border);}
  .leaflet-popup-tip{background:#171b24;}
  .popup h3{margin:0 0 6px; font-size:0.95rem;}
  .popup p{margin:0 0 8px; font-size:0.85rem; color:#c3c9d6;}
  .popup .pmeta{font-size:0.75rem; color:var(--muted); margin-bottom:6px;}
  .popup a{color:var(--link); font-size:0.82rem;}
  .tooltip-card{font-size:0.8rem; line-height:1.4; max-width:220px;}
  .tooltip-card b{display:block; margin-bottom:2px;}
  .tt-badge{
    display:inline-block; font-size:0.62rem; font-weight:700; text-transform:uppercase;
    padding:1px 6px; border-radius:999px; margin-bottom:4px;
  }
  .badge-current{background:rgba(87,211,140,0.18); color:var(--green);}
  .badge-older{background:rgba(245,185,66,0.16); color:var(--amber);}
  .leaflet-tooltip.dc-tooltip{background:#171b24; color:var(--text); border:1px solid var(--border);}
</style>
</head>

  </div>
</header>

// No official meeting livestream/recording could be verified within the review window — see report.html.
const YOUTUBE_ITEMS = [];

const map = L.map('map', { zoomControl: true }).setView([39.5, -95.0], 4.4);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const COLORS = { current: '#57d38c', older: '#f5b942' };

function makeIcon(status){
  const c = COLORS[status];
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${c};border:2px solid rgba(0,0,0,0.6);box-shadow:0 0 6px ${c};"></div>`,
    iconSize: [14,14],
    iconAnchor: [7,7]
  });
}

const markers = {};

ITEMS.forEach((item, idx) => {
  const marker = L.marker([item.lat, item.lon], { icon: makeIcon(item.status) }).addTo(map);

  const badgeClass = item.status === 'current' ? 'badge-current' : 'badge-older';
  const badgeLabel = item.status === 'current' ? 'CURRENT' : 'OLDER';

  marker.bindTooltip(
    `<div class="tooltip-card">
       <span class="tt-badge ${badgeClass}">${badgeLabel}</span>
       <b>${item.place}</b>
       ${item.headline}<br/>
       <span style="color:#9aa3b2">${item.desc}</span><br/>
       <span style="color:#9aa3b2">${item.source} · ${item.date}</span>
     </div>`,
    { direction: 'top', offset: [0,-8], className: 'dc-tooltip', opacity: 0.97 }
  );

  marker.bindPopup(
    `<div class="popup">
       <span class="tt-badge ${badgeClass}">${badgeLabel}</span>
       <h3>${item.place}</h3>
       <div class="pmeta">${item.source} · ${item.date}</div>
       <p><strong>${item.headline}</strong><br/>${item.desc}</p>
       <a href="${item.url}" target="_blank" rel="noopener">Read source ↗</a>
     </div>`
  );

  markers[idx] = marker;
});

function buildSidebar(){
  const currentWrap = document.getElementById('sb-current');
  const olderWrap = document.getElementById('sb-older');
  const currentItems = ITEMS.filter(i => i.status === 'current');
  const olderItems = ITEMS.filter(i => i.status === 'older');

  if (currentItems.length === 0){
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'No genuinely new (past-24h) items met the bar for this window — see report.html for details.';
    currentWrap.appendChild(note);
  }

  ITEMS.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'row';
    const dotColor = COLORS[item.status];
    row.innerHTML = `
      <div class="rp"><span class="dot" style="background:${dotColor}"></span>${item.place}</div>
      <div class="rh">${item.headline}</div>
      <div class="rm">${item.source} · ${item.date}</div>
    `;
    row.addEventListener('click', () => {
      map.flyTo([item.lat, item.lon], 9, { duration: 0.9 });
      markers[idx].openPopup();
    });
    (item.status === 'current' ? currentWrap : olderWrap).appendChild(row);
  });

  if (YOUTUBE_ITEMS.length === 0){
    const olderHeader = document.createElement('div');
    olderHeader.className = 'empty-note';
    olderHeader.innerHTML = '<strong>Official Meeting Videos:</strong> none could be verified as an authentic, date-matched government livestream/recording for this window — excluded rather than guessed at.';
    olderWrap.appendChild(olderHeader);
  }
}

buildSidebar();
</script>
