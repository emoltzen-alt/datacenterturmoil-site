  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  #app{display:flex;height:100%;width:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}

  #sidebar{flex:0 0 340px;height:100%;display:flex;flex-direction:column;
    background:var(--panel);border-left:1px solid var(--line)}
  #sidebar h1{font-size:15px;margin:0;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  #sidebar h1 span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;font-weight:400}

  .legend{display:flex;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}

  .sections{flex:1 1 auto;overflow-y:auto}
  .section-label{position:sticky;top:0;background:var(--panel);padding:10px 16px 6px;
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);z-index:5}
  .row{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .row:hover{background:#1c242d}
  .row .badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .badge.current{background:rgba(46,160,67,.18);color:#5fd67a}
  .badge.older{background:rgba(210,153,34,.18);color:#e3b341}
  .row .place{font-weight:600;font-size:13px}
  .row .headline{color:var(--muted);font-size:12.5px;margin-top:3px}
  .row .meta{color:#6e7a86;font-size:11px;margin-top:4px}

  .tt{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:260px}
  .tt b{font-size:13.5px}
  .tt .b{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:3px;margin-bottom:4px}
  .tt .b.current{background:rgba(46,160,67,.22);color:#5fd67a}
  .tt .b.older{background:rgba(210,153,34,.22);color:#e3b341}
  .tt .loc{color:#9aa7b4;font-size:11.5px;margin:2px 0 4px}
  .tt .desc{color:#c7d0d9}
  .tt .src{color:#7d8791;font-size:11px;margin-top:4px}

  .leaflet-popup-content-wrapper{background:#151b22;color:var(--ink)}
  .leaflet-popup-tip{background:#151b22}
  .leaflet-popup-content a{color:var(--accent)}

  @media (max-width:820px){
    #app{flex-direction:column}
    #map{flex:0 0 55vh}
    #sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>

    '<div class="src">' + it.source + ' · ' + it.date + '</div></div>';
  m.bindTooltip(tooltipHtml, {direction:'top', offset:[0,-6]});

  const popupHtml =
    '<b>' + it.place + '</b><br>' + it.headline + '<br>' +
    '<a href="' + it.url + '" target="_blank" rel="noopener">' + it.source + ' (' + it.date + ') &rarr;</a>';
  m.bindPopup(popupHtml);

  markers[it.id] = m;
});

function buildSection(title, items){
  let html = '<div class="section-label">' + title + ' (' + items.length + ')</div>';
  items.forEach(function(it){
    const badgeClass = it.status === 'CURRENT' ? 'current' : 'older';
    html += '<div class="row" data-id="' + it.id + '">' +
      '<span class="badge ' + badgeClass + '">' + it.status + '</span>' +
      (it.type === 'video' ? '<span class="badge older" style="background:rgba(78,161,255,.18);color:#7cb8ff">VIDEO</span>' : '') +
      '<div class="place">' + it.place + '</div>' +
      '<div class="headline">' + it.headline + '</div>' +
      '<div class="meta">' + it.source + ' · ' + it.date + '</div>' +
      '</div>';
  });
  return html;
}

const current = ITEMS.filter(function(i){ return i.status === 'CURRENT'; });
const older = ITEMS.filter(function(i){ return i.status === 'OLDER'; });

document.getElementById('sections').innerHTML =
  buildSection('Past 24 Hours (Current)', current) +
  buildSection('Older / Background', older);

document.querySelectorAll('.row').forEach(function(row){
  row.addEventListener('click', function(){
    const id = row.getAttribute('data-id');
    const it = ITEMS.find(function(i){ return i.id === id; });
    const m = markers[id];
    if (it && m) {
      map.flyTo([it.lat, it.lon], 9, {duration: 0.8});
      m.openPopup();
    }
  });
});
</script>
</body>
</html>
