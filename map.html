<style>
  :root{
    --bg:#0b0e14; --panel:#131722; --panel2:#181d2b; --border:#262c3d;
    --text:#e8ebf3; --muted:#9aa3b8; --accent:#5ec6ff;
    --current:#3ddc84; --older:#f2b544;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  #app{display:flex; height:100vh; width:100vw;}

  #sidebar{
    width:360px; min-width:300px; max-width:40vw;
    background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #sidebar header{
    padding:1rem 1.1rem .8rem; border-bottom:1px solid var(--border);
  }
  #sidebar h1{font-size:1.05rem; margin:0 0 .25rem; letter-spacing:-0.01em;}
  #sidebar .sub{font-size:.75rem; color:var(--muted);}
  #legend{
    display:flex; gap:1rem; padding:.7rem 1.1rem; border-bottom:1px solid var(--border);
    font-size:.78rem; color:var(--muted); align-items:center; flex-wrap:wrap;
  }
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:.35rem; vertical-align:middle;}
  .dot.current{background:var(--current); box-shadow:0 0 6px rgba(61,220,132,.7);}
  .dot.older{background:var(--older); box-shadow:0 0 6px rgba(242,181,68,.6);}

  #list{flex:1; overflow-y:auto; padding:.5rem 0 2rem;}
  .group-label{
    padding:.7rem 1.1rem .3rem; font-size:.72rem; text-transform:uppercase;
    letter-spacing:.06em; color:var(--muted); font-weight:700;
  }
  .row{
    padding:.55rem 1.1rem; cursor:pointer; border-left:3px solid transparent;
    font-size:.85rem;
  }
  .row:hover{background:var(--panel2);}
  .row.active{background:var(--panel2); border-left-color:var(--accent);}
  .row.current{border-left-color:var(--current);}
  .row.older{border-left-color:var(--older);}
  .row .rh{font-weight:600; margin-bottom:.15rem;}
  .row .rl{color:var(--muted); font-size:.75rem;}

  #map{flex:1; height:100%;}

  .leaflet-popup-content-wrapper{
    background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:10px;
  }
  .leaflet-popup-tip{background:var(--panel); border:1px solid var(--border);}
  .leaflet-popup-content{margin:.8rem 1rem; font-size:.85rem; line-height:1.45;}
  .leaflet-popup-content a{color:var(--accent);}
  .popup-badge{
    display:inline-block; font-size:.65rem; text-transform:uppercase; font-weight:700;
    padding:.1rem .45rem; border-radius:5px; margin-bottom:.35rem; letter-spacing:.03em;
  }
  .popup-badge.current{background:var(--current); color:#062f16;}
  .popup-badge.older{background:var(--older); color:#3a2600;}
  .popup-h{font-weight:700; margin:.1rem 0 .3rem;}
  .popup-loc{color:var(--accent); font-size:.78rem; margin-bottom:.35rem;}
  .popup-meta{color:var(--muted); font-size:.72rem; margin-top:.4rem;}

  .tt-card{
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:.55rem .7rem; font-size:.75rem; max-width:230px; line-height:1.4;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .tt-card .popup-badge{margin-bottom:.25rem;}
  .tt-h{font-weight:700; margin-bottom:.15rem;}
  .tt-loc{color:var(--accent); font-size:.7rem; margin-bottom:.25rem;}

  @media (max-width: 720px){
    #sidebar{position:absolute; z-index:1000; height:45vh; width:100%; max-width:100%; bottom:0; top:auto; border-right:none; border-top:1px solid var(--border);}
    #map{height:100vh;}
  }
</style>

// ---- Map setup -------------------------------------------------------------
const map = L.map('map', { zoomControl:true, minZoom:3 }).setView([39.5, -98.35], 5);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const markers = {};

function colorFor(status){ return status === 'current' ? '#3ddc84' : '#f2b544'; }

ITEMS.forEach(item => {
  const color = colorFor(item.status);
  const marker = L.circleMarker([item.lat, item.lon], {
    radius: item.status === 'current' ? 9 : 7,
    color: color,
    weight: 2,
    fillColor: color,
    fillOpacity: 0.85,
    className: 'dc-marker'
  }).addTo(map);

  const tooltipHtml = `
    <div class="tt-card">
      <span class="popup-badge ${item.status}">${item.status === 'current' ? 'Current' : 'Older'}</span>
      <div class="tt-h">${item.place}</div>
      <div class="tt-loc">${item.location}</div>
      <div>${item.headline}</div>
      <div style="margin-top:.3rem; color:#9aa3b8;">${item.desc}</div>
      <div style="margin-top:.3rem; color:#9aa3b8;">${item.source} · ${item.date}</div>
    </div>`;
  marker.bindTooltip(tooltipHtml, { direction:'top', offset:[0,-6], opacity:1, className:'tt-wrap', sticky:true });

  const popupHtml = `
    <span class="popup-badge ${item.status}">${item.status === 'current' ? 'Current' : 'Older'}</span>
    <div class="popup-h">${item.headline}</div>
    <div class="popup-loc">${item.location}</div>
    <div>${item.desc}</div>
    <div class="popup-meta">${item.source} · ${item.date}</div>
    <div style="margin-top:.5rem;"><a href="${item.url}" target="_blank" rel="noopener">Read source →</a></div>`;
  marker.bindPopup(popupHtml);

  markers[item.id] = marker;
});

// ---- Sidebar ----------------------------------------------------------------
const listEl = document.getElementById('list');

function renderGroup(title, status){
  const group = ITEMS.filter(i => i.status === status);
  const label = document.createElement('div');
  label.className = 'group-label';
  label.textContent = `${title} (${group.length})`;
  listEl.appendChild(label);

  group.forEach(item => {
    const row = document.createElement('div');
    row.className = `row ${status}`;
    row.dataset.id = item.id;
    row.innerHTML = `<div class="rh">${item.place}</div><div class="rl">${item.headline}</div>`;
    row.addEventListener('click', () => {
      document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
      row.classList.add('active');
      map.flyTo([item.lat, item.lon], 9, { duration: 0.9 });
      markers[item.id].openPopup();
    });
    listEl.appendChild(row);
  });
}

renderGroup('Past 24 Hours (Current)', 'current');
renderGroup('Older / Background', 'older');
