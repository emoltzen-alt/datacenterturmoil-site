<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map (last 24 hours)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#0f1419; --card:#1a2129; --ink:#e6edf3; --muted:#9aa7b4;
    --accent:#4ea1ff; --current:#2ea043; --older:#b08800; --line:#2a333d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .layout{display:flex;height:100%;width:100%}
  #map{flex:1 1 auto;height:100%}
  #sidebar{width:340px;flex:0 0 340px;height:100%;overflow-y:auto;background:var(--card);
    border-left:1px solid var(--line);padding:16px}
  #sidebar h1{font-size:16px;margin:0 0 4px}
  #sidebar .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  .legend{display:flex;gap:16px;align-items:center;margin-bottom:16px;font-size:12px;color:var(--muted)}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .dot.cur{background:var(--current)}
  .dot.old{background:var(--older)}
  h2.group{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .row{background:#141a21;border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:6px;padding:8px 10px;margin-bottom:8px;cursor:pointer;transition:background .15s}
  .row:hover{background:#1f2732}
  .row.cur{border-left-color:var(--current)}
  .row.old{border-left-color:var(--older)}
  .row .place{font-weight:700;font-size:13px}
  .row .headline{font-size:12px;color:var(--muted);margin-top:2px}
  a{color:var(--accent)}
  .leaflet-popup-content{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-tooltip.card{background:#1a2129;color:#e6edf3;border:1px solid #2a333d;border-radius:6px;
    padding:8px 10px;max-width:260px;font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .leaflet-tooltip.card .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;padding:1px 6px;border-radius:20px;margin-bottom:4px}
  .badge.cur{background:#2ea043;color:#02160a}
  .badge.old{background:#b08800;color:#1a1400}
  @media (max-width:760px){
    .layout{flex-direction:column}
    #sidebar{width:100%;flex:0 0 40%;order:2;border-left:none;border-top:1px solid var(--line)}
    #map{flex:1 1 60%;order:1}
  }
</style>
</head>
<body>
<div class="layout">
  <div id="map"></div>
  <div id="sidebar">
    <h1>Data Center Community Response</h1>
    <div class="sub">Prior 24 hours ≈ July 8–9, 2026, plus older background context</div>
    <div class="legend">
      <span><span class="dot cur"></span>Past 24 Hours (Current)</span>
      <span><span class="dot old"></span>Older / Background</span>
    </div>
    <h2 class="group">🟢 Past 24 Hours (Current)</h2>
    <div id="list-cur"></div>
    <h2 class="group">🟡 Older / Background</h2>
    <div id="list-old"></div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

     headline:"Residents organize against proposed data center",
     desc:"Residents are organizing against a proposed data center, citing water, power and property-value concerns common to rural Texas siting fights.",
     source:"FOX San Antonio", date:"background",
     url:"https://foxsanantonio.com/newsletter-daily/atascosa-county-residents-fight-proposed-data-center"},
    {place:"Imperial County, CA", lat:32.7920, lon:-115.5631, status:"old",
     headline:"Temporary moratorium passed after months of pressure",
     desc:"Board passed a temporary moratorium on new data centers pending further study of water and power impacts in the Imperial Valley.",
     source:"KPBS", date:"June 17, 2026",
     url:"https://www.kpbs.org/news/politics/2026/06/17/after-months-of-public-pressure-imperial-county-passes-temporary-moratorium-on-data-centers"},
    {place:"Pasco County, FL", lat:28.3672, lon:-82.1943, status:"old",
     headline:"First hearing held on proposed one-year moratorium",
     desc:"County held its first scheduled public hearing on a proposed one-year data center moratorium, an early step in Florida's statewide pattern of pauses.",

  ];

  var map = L.map('map').setView([39.5, -96.0], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
  }).addTo(map);

  var colors = { cur: '#2ea043', old: '#b08800' };
  var markers = [];

  sites.forEach(function(s, i){
    var color = colors[s.status];
    var marker = L.circleMarker([s.lat, s.lon], {
      radius: 9, color: color, fillColor: color, fillOpacity: 0.85, weight: 2
    }).addTo(map);

    var badgeLabel = s.status === 'cur' ? 'CURRENT' : 'OLDER';
    var tooltipHtml =
      '<span class="badge ' + s.status + '">' + badgeLabel + '</span><br>' +
      '<b>' + s.place + '</b><br>' +
      s.headline + '<br>' +
      '<span style="color:#9aa7b4">' + s.desc + '</span><br>' +
      '<span style="color:#9aa7b4">' + s.source + ' &middot; ' + s.date + '</span>';
    marker.bindTooltip(tooltipHtml, {className: 'card', direction: 'top', offset: [0, -8]});

    var popupHtml =
      '<b>' + s.place + '</b><br>' +
      s.headline + '<br>' +
      s.desc + '<br>' +
      '<em>' + s.source + ' &middot; ' + s.date + '</em><br>' +
      (s.url ? '<a href="' + s.url + '" target="_blank" rel="noopener">Source link</a>' : '');
    marker.bindPopup(popupHtml);

    markers.push(marker);

    var row = document.createElement('div');
    row.className = 'row ' + s.status;
    row.innerHTML = '<div class="place">' + s.place + '</div><div class="headline">' + s.headline + '</div>';
    row.addEventListener('click', function(){
      map.flyTo([s.lat, s.lon], 8, {duration: 0.8});
      marker.openPopup();
    });
    document.getElementById(s.status === 'cur' ? 'list-cur' : 'list-old').appendChild(row);
  });
</script>
</body>
</html>
