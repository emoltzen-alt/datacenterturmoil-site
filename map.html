<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Turmoil — Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0b0e13;
    --panel: #12161e;
    --panel-border: #22283533;
    --border: #232a36;
    --text: #e7ebf2;
    --muted: #93a0b4;
    --current: #35d07f;
    --older: #e8a33d;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    display: flex;
    height: 100vh;
    width: 100vw;
  }
  #sidebar {
    width: 380px;
    min-width: 300px;
    max-width: 45vw;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sidebar header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #sidebar header h1 {
    font-size: 17px;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  #sidebar header p {
    margin: 0;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.4;
  }
  #legend {
    display: flex;
    gap: 14px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
  }
  #legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 2px #0006; }
  .dot.current { background: var(--current); }
  .dot.older { background: var(--older); }
  #list { overflow-y: auto; flex: 1; }
  .group-title {
    position: sticky; top: 0;
    background: var(--panel);
    padding: 10px 18px 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    z-index: 2;
  }
  .row {
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .row:hover { background: #ffffff08; }
  .row .place {
    font-size: 13.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .row .headline {
    font-size: 12.5px;
    color: #c7cee0;
    margin-top: 3px;
    line-height: 1.35;
  }
  .row .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .badge {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 1px 6px;
    border-radius: 3px;
    text-transform: uppercase;
  }
  .badge.current { background: #35d07f22; color: var(--current); border: 1px solid #35d07f55; }
  .badge.older { background: #e8a33d22; color: var(--older); border: 1px solid #e8a33d55; }
  .badge.video { background: #6ea8fe22; color: var(--accent); border: 1px solid #6ea8fe55; }
  #map { flex: 1; height: 100%; }

  .lf-tooltip {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12.5px;
    max-width: 260px;
    box-shadow: 0 6px 24px #000a;
  }
  .lf-tooltip .tt-place { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .lf-tooltip .tt-headline { color: #c7cee0; margin-bottom: 4px; line-height: 1.35; }
  .lf-tooltip .tt-desc { color: var(--muted); margin-bottom: 4px; line-height: 1.35; }
  .lf-tooltip .tt-meta { color: var(--muted); font-size: 11px; }

  .leaflet-popup-content-wrapper {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .leaflet-popup-tip { background: var(--panel); }
  .popup-place { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .popup-headline { color: #c7cee0; font-size: 12.5px; margin-bottom: 6px; line-height: 1.4; }
  .popup-desc { color: var(--muted); font-size: 12px; margin-bottom: 6px; line-height: 1.4; }
  .popup-meta { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .popup-link {
    display: inline-block;
    color: var(--accent);
    font-size: 12px;
    text-decoration: none;
    border: 1px solid #6ea8fe55;
    padding: 3px 9px;
    border-radius: 5px;
  }
  .popup-link:hover { background: #6ea8fe1a; }

  #empty-video-note {
    padding: 8px 18px 14px;
    font-size: 11.5px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a3242; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 720px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; max-width: 100%; height: 45%; border-right: none; border-bottom: 1px solid var(--border); }
    #map { height: 55%; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <header>
      <h1>Data Center Turmoil — U.S. Map</h1>
      <p>Local community response to data center development. Green = past 24 hours. Amber = older / background context. Click a row to fly to its pin.</p>
    </header>
    <div id="legend">
      <span><i class="dot current"></i>Current (24h)</span>
      <span><i class="dot older"></i>Older / background</span>
    </div>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

  // ---------------- OLDER / BACKGROUND ----------------
  {
    id: "stlouis-mo",
    status: "older",
    kind: "web",
    place: "St. Louis County, MO",
    region: "Clayton, Missouri",
    lat: 38.6403, lon: -90.3226,
    headline: "'We don't want them': residents push back on zoning rules for data centers",

    date: "2026-08-11",
    url: "https://www.stlpr.org/government-politics-issues/2026-08-11/we-dont-want-them-st-louis-county-residents-push-back-on-zoning-rules-data-center-projects"
  },
  {

    lat: 32.7555, lon: -97.3308,
    headline: "City Council unanimously advances data center moratorium",
    desc: "Council voted unanimously on first procedural steps toward a data center moratorium; most public speakers at the hearing favored a pause.",
    source: "Fort Worth Report",
    date: "2026-08-12",
    url: "https://fortworthreport.org/2026/08/12/data-center-moratorium-takes-first-steps-after-fort-worth-city-councils-unanimous-vote/"
  },
  {
    id: "leavenworth-ks",
    status: "older",
    kind: "web",
    place: "Leavenworth County, KS",
    region: "near Tonganoxie, Kansas",
    lat: 39.1114, lon: -95.0930,
    headline: "Commission lifts moratorium 3-2, clearing path for large data center",
    desc: "A push to extend the county's data center moratorium failed on a 3-2 vote, opening the way for a large data center proposed south of Tonganoxie over some residents' objections.",
    source: "Tonganoxie Mirror",
    date: "2026-08-12",

  },
  {
    id: "effingham-ga",
    status: "older",
    kind: "web",
    place: "Effingham County, GA",
    region: "Springfield, Georgia",
    lat: 32.3616, lon: -81.3129,
    headline: "Commissioners plan public forum on OpenAI's $20B 'Project Camellia'",
    desc: "Amid growing opposition over water, power and noise concerns, commissioners are planning a dedicated Saturday public forum (tentatively Aug. 22 or 29, to be livestreamed) on OpenAI's proposed data center campus, alongside discussion of a possible moratorium.",
    source: "Effingham Herald",
    date: "2026-08-17",
    url: "https://www.effinghamherald.net/data-centers/project-camellia-effingham-plans-openai-data-center-forum-public-meeting/"
  },
  {
    id: "washington-pa",
    status: "older",
    kind: "web",
    place: "Washington County, PA",
    region: "Hanover Township, Pennsylvania",
    lat: 40.2984, lon: -80.3323,

    date: "2026-08-05",
    url: "https://www.cbsnews.com/pittsburgh/news/public-hearing-data-center-hanover-township-washington-county/"
  },
  {
    id: "indianapolis-in",
    status: "older",
    kind: "web",
    place: "Indianapolis, IN",
    region: "Marion County, Indiana",
    lat: 39.7684, lon: -86.1581,
    headline: "City-County Council votes 23-1 for moratorium through end of 2027",

  },
  {
    id: "forsyth-nc",
    status: "older",
    kind: "web",
    place: "Forsyth County, NC",
    region: "Rural Hall, North Carolina",
    lat: 36.2957, lon: -80.2917,
    headline: "Commissioners vote down hyperscale data center rezoning, 5-2",
    desc: "The Forsyth County Board of Commissioners rejected a rezoning application that would have allowed a hyperscale data center near Rural Hall.",
    source: "WFDD",
    date: "2026-07-30",
    url: "https://www.wfdd.org/politics-government/2026-07-30/forsyth-commission-votes-down-rural-hall-data-center-proposal"
  },
  {
    id: "coweta-ga",
    status: "older",
    kind: "web",
    place: "Coweta County, GA",
    region: "Newnan, Georgia",
    lat: 33.3807, lon: -84.7997,
    headline: "Commissioners pass 180-day moratorium on data center proposals",
    desc: "Citing being 'on our doorstep' of rapid data center growth nearby, commissioners approved a 180-day pause on new data center proposals.",
    source: "Local wire via Yahoo News",
    date: "2026-08-04",
    url: "https://www.yahoo.com/news/doorstep-coweta-county-passes-180-175558126.html"
  }
];

const NO_OTHER_VIDEOS_NOTE = "No other official government meeting livestreams/recordings met the bar for this window — several county channels (e.g. Snohomish County, Knox County NE) had not posted an archived hearing video at the time of this report; only clips or third-party news video existed, which are excluded.";

// ---------------------------------------------------------------------
// MAP
// ---------------------------------------------------------------------
const map = L.map('map', { zoomControl: true, minZoom: 3 }).setView([39.5, -98.35], 5);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const markersById = {};

function colorFor(status) {
  return status === 'current' ? '#35d07f' : '#e8a33d';
}

function makeIcon(item) {
  const color = colorFor(item.status);
  const ring = item.kind === 'video' ? '#6ea8fe' : '#0b0e13';
  return L.divIcon({
    className: '',
    html: `<div style="
        width:16px;height:16px;border-radius:50%;
        background:${color};
        border:2.5px solid ${ring};
        box-shadow:0 0 0 2px #0008, 0 0 8px ${color}99;
      "></div>`,
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });
}

ITEMS.forEach(item => {
  const marker = L.marker([item.lat, item.lon], { icon: makeIcon(item) }).addTo(map);

  const badgeLabel = item.status === 'current' ? 'CURRENT' : 'OLDER';
  marker.bindTooltip(`
    <div class="tt-place">${item.place} <span style="color:${colorFor(item.status)};font-size:10px;font-weight:700;">● ${badgeLabel}</span></div>
    <div class="tt-headline">${item.headline}</div>
    <div class="tt-desc">${item.desc}</div>
    <div class="tt-meta">${item.source} · ${item.date}</div>
  `, { direction: 'top', offset: [0, -10], opacity: 0.97 });

  marker.bindPopup(`
    <div class="popup-place">${item.place}</div>
    <div class="popup-headline">${item.headline}</div>
    <div class="popup-desc">${item.desc}</div>
    <div class="popup-meta">${item.source} · ${item.date}${item.kind === 'video' ? ' · Official meeting video' : ''}</div>
    <a class="popup-link" href="${item.url}" target="_blank" rel="noopener">View source →</a>
  `);

  markersById[item.id] = marker;
});

// ---------------------------------------------------------------------
// SIDEBAR
// ---------------------------------------------------------------------
const listEl = document.getElementById('list');

function renderGroup(title, items) {
  if (!items.length) return '';
  let html = `<div class="group-title">${title} (${items.length})</div>`;
  items.forEach(item => {
    const badgeClass = item.status === 'current' ? 'current' : 'older';
    const badgeLabel = item.status === 'current' ? 'Current' : 'Older';
    html += `
      <div class="row" data-id="${item.id}">
        <div class="place">
          <span class="badge ${badgeClass}">${badgeLabel}</span>
          ${item.kind === 'video' ? '<span class="badge video">Video</span>' : ''}
          ${item.place}
        </div>
        <div class="headline">${item.headline}</div>
        <div class="meta">${item.region} · ${item.source} · ${item.date}</div>
      </div>`;
  });
  return html;
}

const current = ITEMS.filter(i => i.status === 'current');
const older = ITEMS.filter(i => i.status === 'older');

listEl.innerHTML =
  renderGroup('Past 24 Hours (Current)', current) +
  renderGroup('Older / Background', older);

listEl.innerHTML += `<div id="empty-video-note">📹 ${NO_OTHER_VIDEOS_NOTE}</div>`;

listEl.querySelectorAll('.row').forEach(row => {
  row.addEventListener('click', () => {
    const item = ITEMS.find(i => i.id === row.dataset.id);
    if (!item) return;
    map.flyTo([item.lat, item.lon], 9, { duration: 0.9 });
    const marker = markersById[item.id];
    setTimeout(() => marker.openPopup(), 500);
  });
});
</script>
</body>
</html>
