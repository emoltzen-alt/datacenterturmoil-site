<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f1419;--panel:#141b22;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;--accent:#4ea1ff;--current:#2ea043;--older:#e0a012}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{display:flex;height:100vh;width:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}
  aside{flex:0 0 340px;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);height:100%;overflow:hidden}
  aside header{flex:0 0 auto;padding:12px 14px;border-bottom:1px solid var(--line)}
  aside header h1{font-size:14px;margin:0 0 4px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .swatch{width:10px;height:10px;border-radius:50%;display:inline-block}
  .sw-current{background:var(--current)}
  .sw-older{background:var(--older)}
  .list{flex:1 1 auto;overflow-y:auto}
  .group-label{position:sticky;top:0;background:var(--panel);padding:8px 14px;font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);z-index:2}
  .row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:#1b2430}
  .row .place{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
  .row .headline{font-size:12.5px;color:var(--ink);margin-top:3px}
  .row .meta{font-size:11px;color:var(--muted);margin-top:3px}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .leaflet-popup-content{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:260px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#4ea1ff}
  .tt{font:12.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:230px}
  .tt b{display:block;font-size:13px;margin-bottom:2px}
  .badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:3px;margin-bottom:4px}
  .badge-current{background:rgba(46,160,67,.22);color:#4fd166}
  .badge-older{background:rgba(224,160,18,.22);color:#f0b429}
  @media (max-width:820px){
    .wrap{flex-direction:column}
    #map{flex:0 0 55vh}
    aside{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="map"></div>
  <aside>
    <header>
      <h1>Data Center Community Response</h1>
      <div class="legend">
        <span><i class="swatch sw-current"></i>Past 24 hours (current)</span>
        <span><i class="swatch sw-older"></i>Older / background</span>
      </div>
    </header>
    <div class="list" id="list"></div>
  </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var sites = [{"place":"Tucson (Pima County), AZ","lat":32.2226,"lng":-110.9747,"status":"CURRENT","headline":"Pima County Supervisors approve 120-day data center moratorium","desc":"Board of Supervisors voted 3-2 to impose a temporary ban on new data center permits while the county drafts zoning regulations for large-scale facilities.","source":"AZ Luminaria / AZPM","date":"2026-09-23","url":"https://azluminaria.org/2026/09/23/pima-county-supervisors-approve-data-center-moratorium/"},{"place":"Prince William County (Manassas), VA","lat":38.7509,"lng":-77.4753,"status":"CURRENT","headline":"Supervisors end by-right data center development countywide","desc":"The Board of County Supervisors voted 8-0 to approve a landmark zoning text amendment ending by-right data center development, with a 90-day grace period for pending applications.","source":"WTOP News","date":"2026-09-23","url":"https://wtop.com/virginia/2026/09/prince-william-co-supervisors-vote-to-end-by-right-data-center-development-countywide/"},{"place":"Oakland, CA","lat":37.8044,"lng":-122.2711,"status":"CURRENT","headline":"Council committee advances 45-day data center moratorium","desc":"Oakland's Life Enrichment Committee unanimously approved a temporary freeze on new data center projects to study energy, water and noise impacts; full council votes Oct. 6.","source":"Oaklandside / NBC Bay Area","date":"2026-09-22","url":"https://oaklandside.org/2026/09/23/oakland-data-center-moratorium-committee-appoval/"},{"place":"Adair County (Greenfield), IA","lat":41.3042,"lng":-94.4586,"status":"CURRENT","headline":"Supervisors hold public hearing on data center ordinance","desc":"The Adair County Board of Supervisors held a public hearing on Ordinance #41, which would regulate siting, construction, operation and decommissioning of data centers and crypto-mining facilities.","source":"Western Iowa Today (KSOM/KS95.7)","date":"2026-09-23","url":"https://westerniowatoday.com/2026/09/23/adair-county-supervisors-hold-public-hearing-on-data-center-ordinance/"},{"place":"Franklin County (Brookville), IN","lat":39.4231,"lng":-85.0116,"status":"CURRENT","headline":"Planning commission continues data-center zoning hearing","desc":"The county planning commission continued its public hearing on a proposed data-center zoning draft to Sept. 23 amid ongoing resident questions about the rules.","source":"Citizen Portal","date":"2026-09-23","url":"https://citizenportal.ai/articles/9913571/indiana/franklin-county/planning-commission-continues-datacenter-hearing-to-sept-23"},{"place":"Hanover Township (Washington County), PA","lat":40.1673,"lng":-80.2462,"status":"CURRENT","headline":"Engineer testifies on Starpointe data center's gas power plant","desc":"At a continued conditional-use hearing, an engineer testified on power generation for the proposed Starpointe data center campus and its attached 450 MW gas-fired plant on reclaimed mine land.","source":"Observer-Reporter","date":"2026-09-23","url":"https://www.observer-reporter.com/news/local-news/2026/sep/23/engineer-testifies-on-starpointe-data-center-power-generation/"},{"place":"Leesburg (Loudoun County), VA","lat":38.7967,"lng":-77.6412,"status":"OLDER","headline":"Planning Commission rejects 3M-sq-ft data center campus","desc":"The Loudoun County Planning Commission rejected the 'Innovation Gateway' proposal near Dulles Airport, which paired apartments with 700,000 sq ft of data center space.","source":"Loudoun Now","date":"2026-09","url":"https://www.loudounnow.com/news/loudoun-planning-commission-rejects-3m-square-foot-data-center-campus/article_35f01dc9-af58-4afb-a364-e93b96b50e43.html"},{"place":"Ellenwood (DeKalb County), GA","lat":33.649,"lng":-84.1876,"status":"OLDER","headline":"Commissioners reject $1.6B data center plan","desc":"DeKalb County commissioners unanimously rejected a 1-million-sq-ft data center proposed for 95 acres in Ellenwood after months of resident opposition over water, electricity and property values.","source":"Decaturish","date":"2026-09","url":"https://www.decaturish.com/news/dekalb/dekalb-commissioners-reject-1-6b-data-center-plan/article_764ca039-a089-40fc-b75a-528c4da075a0.html"},{"place":"Kansas City, MO","lat":39.0997,"lng":-94.5786,"status":"OLDER","headline":"Plan Commission denies downtown 20-story data center","desc":"The Kansas City Plan Commission unanimously voted to deny a Miami-based developer's proposal for a 20-story downtown data center.","source":"KSHB / FOX4KC","date":"2026-09","url":"https://www.kshb.com/news/local-news/missouri/kansas-city/kcmo-city-plan-commission-votes-to-deny-application-for-proposed-downtown-data-center"},{"place":"Allen Park, MI","lat":42.2506,"lng":-83.2094,"status":"OLDER","headline":"Planners reject 26MW Solstice Data project near school","desc":"Allen Park's Planning Commission voted 7-2 to reject a data center proposed near homes and a high school, with one commissioner saying residents would 'celebrate with one eye open.'","source":"Planet Detroit","date":"2026-06","url":"https://planetdetroit.org/2026/06/allen-park-planners-reject-data-center/"},{"place":"Clayton (St. Louis County), MO","lat":38.627,"lng":-90.1994,"status":"OLDER","headline":"Residents rail against any data centers in zoning hearing","desc":"At a public hearing on proposed data-center zoning rules, residents asked the county for a temporary or permanent ban on the developments.","source":"St. Louis Public Radio","date":"2026-08","url":"https://www.stlpr.org/government-politics-issues/2026-08-11/we-dont-want-them-st-louis-county-residents-push-back-on-zoning-rules-data-center-projects"},{"place":"Towson (Baltimore County), MD","lat":39.4015,"lng":-76.6019,"status":"OLDER","headline":"County extends data center moratorium through 2027","desc":"After a packed public hearing where most speakers opposed development, Baltimore County voted to extend its data center moratorium through at least the end of 2027.","source":"CBS Baltimore","date":"2026-09","url":"https://www.cbsnews.com/baltimore/news/baltimore-county-residents-speak-out-against-data-centers/"},{"place":"Nephi (Juab County), UT","lat":39.8088,"lng":-111.8666,"status":"OLDER","headline":"Residents challenge $10B data center approval","desc":"Residents near Mona are appealing a permit decision for a $10 billion data center campus, saying the approval hearing lasted only four minutes with inadequate public notice.","source":"Hoodline / Salt Lake Tribune","date":"2026-09-16","url":"https://www.sltrib.com/news/2026/09/16/utah-residents-challenge-juab/"},{"place":"Moville (Woodbury County), IA","lat":42.4794,"lng":-96.07,"status":"OLDER","headline":"Residents voice data center concerns at meeting","desc":"Woodbury County residents raised concerns about a proposed data center's impact on water supplies, property values and the surrounding rural environment.","source":"KTIV","date":"2026-09-22","url":"https://www.ktiv.com/2026/09/22/woodbury-county-residents-voice-data-center-concerns-moville/"},{"place":"Martinsville (Henry County), VA","lat":36.6862,"lng":-79.8867,"status":"OLDER","headline":"Board pulls data centers from zoning proposal after outcry","desc":"The Henry County board removed data centers from a pending zoning proposal after large-scale public opposition at recent hearings.","source":"Citizen Portal","date":"2026-09","url":"https://citizenportal.ai/articles/9242073/virginia/henry-county/henry-county-board-pulls-data-centers-from-zoning-proposal-after-large-public-outcry"},{"place":"South Whitehall Township (Lehigh County), PA","lat":40.5934,"lng":-75.5316,"status":"OLDER","headline":"Data center fight escalates; residents demand hearing","desc":"Residents are demanding a formal public hearing as opposition grows to a proposed data center in South Whitehall Township.","source":"Hoodline","date":"2026-09","url":"https://hoodline.com/2026/09/south-whitehall-data-center-fight-grows-as-residents-demand-public-hearing/"},{"place":"Rincon (Effingham County), GA","lat":32.2938,"lng":-81.2354,"status":"OLDER","headline":"Second lawsuit filed over OpenAI's $20B data center campus","desc":"Residents and environmental advocates filed a second lawsuit challenging the county's handling of OpenAI's data center campus, citing public-input, environmental and electricity-cost concerns.","source":"Inside Climate News / AJC","date":"2026-09-22","url":"https://insideclimatenews.org/news/22092026/georgia-residents-sue-over-openai-data-center/"},{"place":"Farmington (Davis County), UT","lat":40.9805,"lng":-111.8877,"status":"OLDER","headline":"Residents sue city over $5B data center park","desc":"Farmington residents filed suit against the city, saying they were 'completely ignored' in the approval process for a $5 billion data center park.","source":"Yahoo News","date":"2026-09","url":"https://www.yahoo.com/news/were-completely-ignored-farmington-residents-224600852.html"},{"place":"Colorado Springs, CO","lat":38.8339,"lng":-104.8214,"status":"OLDER","headline":"Final data center vote delayed after raucous hearing","desc":"Colorado Springs city council delayed a final vote on a data center project after a contentious public hearing drew strong opposition.","source":"Colorado Sun","date":"2026-09-17","url":"https://coloradosun.com/2026/09/17/colorado-springs-data-center-final-vote-delay/"},{"place":"Castle Rock (Douglas County), CO","lat":39.3722,"lng":-104.8608,"status":"OLDER","headline":"County grants $19M tax break to controversial data center","desc":"Douglas County commissioners approved a large tax break for a data center over objections; critics say 'the math doesn't make sense.'","source":"CBS Colorado","date":"2026-09","url":"https://www.cbsnews.com/colorado/news/colorado-county-grant-19-million-tax-break-controversial-data-center/"},{"place":"Hillsboro (Washington County), OR","lat":45.5229,"lng":-122.9898,"status":"OLDER","headline":"Residents sue county and city over data center tax breaks","desc":"Residents and organizations sued Washington County and the City of Hillsboro, alleging they overstepped authority in approving tax breaks for 17 data centers before a moratorium.","source":"KOIN / The Cool Down","date":"2026-09","url":"https://www.koin.com/news/oregon/corporate-handouts-washington-county-hillsboro-face-lawsuit-over-data-center-tax-breaks/"},{"place":"Richmond, CA","lat":37.9358,"lng":-122.3477,"status":"OLDER","headline":"City Council approves 45-day data center moratorium","desc":"Richmond's City Council agreed to a 45-day moratorium on data centers, giving the city time to study potential regulations.","source":"Contra Costa News","date":"2026-09-16","url":"https://contracosta.news/2026/09/16/richmond-city-council-agrees-to-45-day-moratorium-on-data-centers/"},{"place":"San Francisco, CA","lat":37.7749,"lng":-122.4194,"status":"OLDER","headline":"Supervisors weigh 45-day data center freeze","desc":"San Francisco supervisors considered a 45-day moratorium on data centers, targeting projects like NOVVA's expansion in Bayview.","source":"Hoodline","date":"2026-09-15","url":"https://hoodline.com/2026/09/san-francisco-weighs-45-day-freeze-on-data-centers-as-bayview-feels-the-heat/"},{"place":"Normal, IL","lat":40.5142,"lng":-88.9906,"status":"OLDER","headline":"Town proposes 6-month extension of data center moratorium","desc":"The Town of Normal is looking to extend its data center moratorium through May 2027 to give officials more time on regulations.","source":"WGLT","date":"2026-09-18","url":"https://www.wglt.org/local-news/2026-09-18/normal-proposes-6-month-extension-to-data-center-moratorium"},{"place":"Las Cruces (Do\u00f1a Ana County), NM","lat":32.3199,"lng":-106.7637,"status":"OLDER","headline":"Confrontation at commission meeting over Project Jupiter","desc":"Two opponents of the $165B Project Jupiter data center bonds were cited for disorderly conduct at a county commission meeting marking the deal's one-year anniversary; the county livestream was intermittently cut during the confrontation.","source":"Searchlight New Mexico / Santa Fe New Mexican","date":"2026-09","url":"https://searchlightnm.org/two-project-jupiter-foes-accused-of-disorderly-contact-at-commission-meeting/"},{"place":"North Port, FL","lat":27.0442,"lng":-82.2359,"status":"OLDER","headline":"City OKs 18-month data center moratorium after 7-hour hearing","desc":"North Port commissioners approved an 18-month moratorium 4-1 after a marathon meeting with about 400 public comments opposing a proposed 896,000-sq-ft data center complex.","source":"WGCU / Your Sun","date":"2026-09","url":"https://www.wgcu.org/government-politics/2026-09-04/seven-hours-400-comments-packed-city-hall-north-port-moves-to-halt-data-centers"},{"place":"Murdock (Cass County), NE","lat":40.8858,"lng":-96.2686,"status":"OLDER","headline":"Farmers and Sierra Club unite against data center project","desc":"An unlikely coalition of conservative farmers and environmental groups opposes data center development over farmland loss, water supplies and electricity bills; neighboring Cass County approved a 12-month moratorium.","source":"Nebraska Examiner","date":"2026-09-22","url":"https://nebraskaexaminer.com/2026/09/22/data-center-opposition-is-growing-with-nebraskans-crossing-party-lines-in-protest/"},{"place":"Leavenworth County, KS","lat":39.3111,"lng":-94.9224,"status":"OLDER","headline":"County adopts 90-day data center moratorium","desc":"Leavenworth County commissioners adopted a 90-day moratorium on further development of the Project Bluestem data center and other proposed data/crypto/battery storage facilities.","source":"Leavenworth County Government","date":"2026-09","url":"https://files.leavenworthcounty.gov/Department/Commission/Schedule/Admin%20Packets/Admin%20Packet_5-20-26.pdf"}];

var map = L.map('map', {scrollWheelZoom:true}).setView([39.5, -96.5], 4.4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

var colors = {CURRENT:'#2ea043', OLDER:'#e0a012'};
var markers = {};

sites.forEach(function(s, i){
  var color = colors[s.status] || '#4ea1ff';
  var m = L.circleMarker([s.lat, s.lng], {
    radius: s.status === 'CURRENT' ? 9 : 7,
    color: color, fillColor: color, fillOpacity: 0.85, weight: 2
  }).addTo(map);

  var badgeClass = s.status === 'CURRENT' ? 'badge-current' : 'badge-older';
  var badgeText = s.status === 'CURRENT' ? 'CURRENT' : 'OLDER';

  m.bindTooltip(
    '<div class="tt"><span class="badge ' + badgeClass + '">' + badgeText + '</span>' +
    '<b>' + s.place + '</b>' + s.headline + '<br>' + s.desc +
    '<div style="margin-top:4px;color:#9aa7b4">' + s.source + ' &middot; ' + s.date + '</div></div>',
    {direction:'top', offset:[0,-8], sticky:true}
  );

  m.bindPopup(
    '<span class="badge ' + badgeClass + '">' + badgeText + '</span><br>' +
    '<b>' + s.place + '</b><br>' + s.headline + '<br><br>' +
    s.desc + '<br><br>' +
    '<a href="' + s.url + '" target="_blank" rel="noopener">' + s.source + ' — ' + s.date + '</a>'
  );

  markers[i] = m;
});

function buildList(){
  var list = document.getElementById('list');
  var current = [], older = [];
  sites.forEach(function(s,i){ (s.status==='CURRENT'?current:older).push(i); });

  function section(title, idxs){
    var h = document.createElement('div');
    h.className = 'group-label';
    h.textContent = title + ' (' + idxs.length + ')';
    list.appendChild(h);
    idxs.forEach(function(i){
      var s = sites[i];
      var row = document.createElement('div');
      row.className = 'row';
      var dotColor = colors[s.status] || '#4ea1ff';
      row.innerHTML = '<div class="place"><span class="dot" style="background:' + dotColor + '"></span>' + s.place + '</div>' +
        '<div class="headline">' + s.headline + '</div>' +
        '<div class="meta">' + s.source + ' &middot; ' + s.date + '</div>';
      row.addEventListener('click', function(){
        map.flyTo([s.lat, s.lng], 8, {duration:0.8});
        markers[i].openPopup();
      });
      list.appendChild(row);
    });
  }

  section('Past 24 Hours (Current)', current);
  section('Older / Background', older);
}
buildList();
</script>
</body>
</html>
