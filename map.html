<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map (last 24 hours)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f1419;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;--current:#2ea043;--older:#d9a441}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{display:flex;height:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}
  #sidebar{flex:0 0 340px;height:100%;overflow-y:auto;border-left:1px solid var(--line);background:#131a20}
  #sidebar h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:0;padding:12px 14px 8px;position:sticky;top:0;background:#131a20;border-bottom:1px solid var(--line)}
  .row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:#1b242c}
  .row .badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;
    padding:2px 6px;border-radius:3px;margin-bottom:4px;color:#0f1419}
  .badge.current{background:var(--current)}
  .badge.older{background:var(--older)}
  .row .place{font-weight:600;font-size:13.5px}
  .row .headline{color:var(--muted);font-size:12.5px;margin-top:2px}
  #legend{position:absolute;bottom:18px;left:12px;z-index:1000;background:rgba(19,26,32,.92);
    border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:12.5px;color:var(--ink)}
  #legend div{display:flex;align-items:center;gap:6px;margin:3px 0}
  #legend span.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .leaflet-tooltip.dc-tip{background:#131a20;color:#e6edf3;border:1px solid var(--line);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:260px;padding:8px 10px}
  .leaflet-tooltip.dc-tip b{font-size:13.5px}
  .leaflet-tooltip.dc-tip .tbadge{font-size:10px;font-weight:700;letter-spacing:.04em;color:#0f1419;
    padding:1px 5px;border-radius:3px;display:inline-block;margin-bottom:4px}
  .leaflet-popup-content-wrapper{background:#131a20;color:#e6edf3}
  .leaflet-popup-tip{background:#131a20}
  .leaflet-popup-content{font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:12px 14px}
  .leaflet-popup-content a{color:#4ea1ff}
  @media (max-width:820px){
    #app{flex-direction:column}
    #map{flex:0 0 55vh}
    #sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="sidebar">
    <h2>Past 24 Hours (Current)</h2>
    <div id="list-current"></div>
    <h2>Older / Background</h2>
    <div id="list-older"></div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var sites = [
  {place:"Wilkinsburg, PA", lat:40.4406, lon:-79.8814, status:"current",

   source:"Trib Total Media via Yahoo News", date:"Sep 18, 2026",
   url:"https://www.yahoo.com/news/articles/tech-company-scheduled-hear-public-031427986.html"},
  {place:"Normal, IL", lat:40.5142, lon:-88.9906, status:"current",

   source:"WGLT", date:"Sep 18, 2026",
   url:"https://www.wglt.org/local-news/2026-09-18/normal-proposes-6-month-extension-to-data-center-moratorium"},
  {place:"Dallas, TX (Joppa)", lat:32.6853, lon:-96.7663, status:"current",
   headline:"Joppa residents call new data center noise a “slap in the face”",
   desc:"Residents of the historically Black Joppa neighborhood, already burdened by decades of industrial pollution, say a newly opened data center sounds like a jet about to take off and worry about noise, water use and electricity costs.",
   source:"KERA News", date:"Sep 18, 2026",
   url:"https://www.keranews.org/energy-environment/2026-09-18/slap-in-the-face-joppa-residents-raise-concerns-over-noisy-new-data-center"},
  {place:"Eureka, CA", lat:40.8021, lon:-124.1637, status:"current",
   headline:"Council signals openness to smaller data centers",
   desc:"Eureka councilmembers expressed support for an ordinance option that would permit smaller-scale data centers in industrial-zoned areas after community debate over the technology's local footprint.",
   source:"Redheaded Blackbelt", date:"Sep 19, 2026",
   url:"https://kymkemp.com/2026/09/19/eureka-open-to-allowing-smaller-data-centers/"},

  {place:"Massena, NY", lat:44.9284, lon:-74.8907, status:"older",
   headline:"Town board votes down data center moratorium, 3-2",
   desc:"Residents raised concerns about AI power and water consumption, but the board's split vote clears the way for NCCS's proposed 400 MW data center facility.",
   source:"North Country Now / WCAX", date:"Sep 17, 2026",
   url:"https://www.northcountrynow.com/stories/massena-votes-down-proposed-data-center-moratorium-in-split-vote-clears-way-for-nccss-400-mw,391015"},
  {place:"Spotsylvania County, VA", lat:38.1965, lon:-77.5972, status:"older",
   headline:"Planning commission recommends 555-acre AWS data center campus",
   desc:"The commission voted 4-2 to recommend a special-use permit for an Amazon Web Services campus in the Lee Hill District; the Board of Supervisors will make the final call.",
   source:"Fredericksburg Free Press", date:"Sep 17, 2026",
   url:"http://www.fredericksburgfreepress.com/2026/09/17/spotsylvania-planning-commission-recommends-approval-of-555-acre-data-center-campus/"},
  {place:"Okaloosa County, FL", lat:30.7619, lon:-86.5705, status:"older",
   headline:"Commissioners reject 12-month data center moratorium, 3-2",
   desc:"After hours of public opposition, the board rejected a proposed moratorium and instead voted unanimously to have staff draft a regulatory framework within 60 days.",
   source:"Mid Bay News", date:"Sep 15-17, 2026",
   url:"https://midbaynews.com/post/okaloosa-commissioners-reject-12-month-data-center-moratorium-3-2-after-hours-of-public-opposition"},
  {place:"Frederick County, MD", lat:39.4143, lon:-77.4105, status:"older",
   headline:"County executive rejects data center developer benefit agreement",
   desc:"Amid public outcry over water, power and land-use impacts, County Executive Jessica Fitzwater declined to move forward with a proposed community-benefit agreement with a data center developer.",
   source:"WYPR", date:"Sep 15, 2026",
   url:"https://www.wypr.org/wypr-news/2026-09-15/frederick-county-rejects-agreement-with-data-center-developer-amidst-public-outcry"},
  {place:"Spokane County, WA", lat:47.6588, lon:-117.4260, status:"older",
   headline:"Public hearing turns into “pandemonium” over data center rules",
   desc:"Residents repeatedly interrupted a county commission meeting, criticizing what they call a lack of transparency and public input into proposed large-scale data center regulations.",
   source:"The Spokesman-Review", date:"Sep 15, 2026",
   url:"https://www.spokesman.com/stories/2026/sep/15/spokane-county-commission-meeting-site-of-public-h/"},
  {place:"Colorado Springs, CO", lat:38.8339, lon:-104.8214, status:"older",
   headline:"Council delays vote on contested Garden of the Gods-area data center",
   desc:"After a raucous, daylong hearing with residents shouting down the “Project Taurus” proposal, City Council postponed a final decision until at least April.",
   source:"Colorado Sun", date:"Sep 17, 2026",
   url:"https://coloradosun.com/2026/09/17/colorado-springs-data-center-final-vote-delay/"},
  {place:"Nottingham, NH", lat:43.1195, lon:-71.1084, status:"older",
   headline:"Voters approve 12-month data center moratorium, 1,335-143",
   desc:"Residents overwhelmingly passed a town-wide moratorium on any new data center development at a town vote.",
   source:"New Hampshire Public Radio", date:"Sep 9, 2026",
   url:"https://www.nhpr.org/politics/2026-09-09/nottingham-voters-approve-moratorium-data-centers-nh-newhampshire"},
  {place:"Indianapolis (Marion County), IN", lat:39.7684, lon:-86.1581, status:"older",
   headline:"City-County Council bars new data centers through 2027",
   desc:"Councilors voted 23-1 to enact a binding pause on new data center construction while finalizing noise, water-management and electrical-capacity rules.",
   source:"Mirror Indy", date:"Aug 10, 2026",
   url:"https://mirrorindy.org/indianapolis-city-county-council-data-center-moratorium-approval/"},
  {place:"Ferguson, MO", lat:38.7442, lon:-90.2951, status:"older",
   headline:"City council rejects $1.8 billion data center proposal",
   desc:"After weeks of debate and strong community pushback, the council voted down the project on a 3-3-1 result following extended discussion.",
   source:"FOX 2 St. Louis", date:"2026",
   url:"https://fox2now.com/news/missouri/ferguson-city-council-rejects-1-8-billion-data-center-proposal/"},
  {place:"Lake County, IL (Grayslake)", lat:42.3456, lon:-88.0334, status:"older",
   headline:"Residents sue to block 472-acre data center campus",
   desc:"A group of residents and a corporation filed suit seeking to block development of the T5 @ Chicago IV data center campus, calling it a “project of unprecedented scale.”",
   source:"Lake & McHenry County Scanner", date:"Aug 8, 2026",
   url:"https://www.lakemchenryscanner.com/2026/08/08/project-of-unprecedented-scale-lake-county-residents-file-lawsuit-to-block-472-acre-data-center-campus-in-grayslake/"},
  {place:"Sturtevant, WI", lat:42.6975, lon:-87.8987, status:"older",
   headline:"Class-action lawsuit over Microsoft data center noise",
   desc:"Residents near Microsoft's $7.3B Fairwater data center allege unreasonable and excessive noise, plus construction noise and light pollution, audible over a mile away.",
   source:"Tom's Hardware", date:"Jul 1, 2026",
   url:"https://www.tomshardware.com/tech-industry/data-centers/wisconsin-residents-file-class-action-lawsuit-against-microsofts-worlds-most-powerful-ai-data-center-due-to-data-center-noise-plaintiffs-also-mention-construction-noise-and-extreme-light-pollution-from-usd7-3-billion-facility"},
  {place:"Coweta County, GA", lat:33.3809, lon:-84.7997, status:"older",
   headline:"County passes 180-day data center moratorium",
   desc:"Commissioners approved a temporary ban on new data center proposals, with residents describing new projects as landing “on our doorstep.”",
   source:"Yahoo News", date:"2026",
   url:"https://www.yahoo.com/news/doorstep-coweta-county-passes-180-175558126.html"},
  {place:"Mona, UT (Juab County)", lat:39.8083, lon:-111.8666, status:"older",
   headline:"Residents question how $10B data center got approved",
   desc:"Juab County residents say the public hearing that cleared the way for a proposed $10 billion data center lasted only four minutes, with little opportunity for input.",
   source:"Hoodline", date:"Sep 2026",
   url:"https://hoodline.com/2026/09/mona-residents-say-four-minute-hearing-waved-through-10b-data-center/"},
  {place:"Henry County, VA", lat:36.6912, lon:-79.8725, status:"older",
   headline:"Board pulls data centers from zoning proposal after public outcry",
   desc:"More than 100 residents packed a hearing citing water, noise, health and habitat concerns; supervisors removed data centers from proposed zoning changes and sent staff back to add safeguards.",
   source:"Cardinal News / Citizen Portal", date:"Jul 29 - Sep 1, 2026",
   url:"https://cardinalnews.org/2026/07/29/crowd-packs-hearing-as-henry-county-goes-back-to-the-drawing-board-on-data-center-regulations/"}
];

var map = L.map('map', {zoomControl:true}).setView([39.5, -96.5], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

var markers = {};
sites.forEach(function(s, i){
  var color = s.status === 'current' ? '#2ea043' : '#d9a441';
  var m = L.circleMarker([s.lat, s.lon], {
    radius: 9, color: color, fillColor: color, fillOpacity: 0.85, weight: 2
  }).addTo(map);

  var badgeLabel = s.status === 'current' ? 'CURRENT' : 'OLDER';
  var tip = '<span class="tbadge" style="background:'+color+'">'+badgeLabel+'</span><br>'+
            '<b>'+s.place+'</b><br>'+s.headline+'<br>'+
            '<span style="color:#9aa7b4">'+s.desc+'</span><br>'+
            '<span style="color:#9aa7b4">'+s.source+' &middot; '+s.date+'</span>';
  m.bindTooltip(tip, {className:'dc-tip', direction:'top', offset:[0,-6]});

  var popup = '<b>'+s.place+'</b><br>'+s.headline+'<br>'+
              '<span style="color:#9aa7b4">'+s.source+' &middot; '+s.date+'</span><br>'+
              '<a href="'+s.url+'" target="_blank" rel="noopener">Read source &rarr;</a>';
  m.bindPopup(popup);

  markers[i] = m;
});

function buildList(containerId, status){
  var el = document.getElementById(containerId);
  var items = sites.map(function(s,i){return {s:s,i:i};}).filter(function(o){return o.s.status===status;});
  if(items.length === 0){
    el.innerHTML = '<div class="row" style="cursor:default;color:#9aa7b4">None found in this window.</div>';
    return;
  }
  items.forEach(function(o){
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<span class="badge '+o.s.status+'">'+(o.s.status==='current'?'CURRENT':'OLDER')+'</span><br>'+
                     '<div class="place">'+o.s.place+'</div>'+
                     '<div class="headline">'+o.s.headline+'</div>';
    row.addEventListener('click', function(){
      map.flyTo([o.s.lat, o.s.lon], 9, {duration:0.8});
      markers[o.i].openPopup();
    });
    el.appendChild(row);
  });
}
buildList('list-current', 'current');
buildList('list-older', 'older');
</script>
</body>
</html>
