<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:#0f1419;--panel:#141b22;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;
        --accent:#4ea1ff;--current:#2ea043;--older:#d29922}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg)}
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
       display:flex;height:100vh;overflow:hidden}

  #map{flex:1 1 auto;height:100%;min-width:0;background:#0b0f14}

  #sidebar{flex:0 0 320px;display:flex;flex-direction:column;background:var(--panel);
            border-left:1px solid var(--line);height:100%;min-width:0}
  #sidebar h2{font-size:14px;margin:0;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
  #legend{padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  #legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:10px;height:10px;border-radius:50%;display:inline-block}
  .swatch.current{background:var(--current)}
  .swatch.older{background:var(--older)}

  #list{flex:1 1 auto;overflow-y:auto}
  .group-title{position:sticky;top:0;background:var(--panel);padding:10px 14px 6px;font-size:11px;
               text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);z-index:2}
  .row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
  .row:hover{background:#1b232c}
  .row.active{background:#1c2a22}
  .row .rh{display:flex;align-items:center;gap:7px;margin-bottom:3px}
  .row .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .row .dot.current{background:var(--current)}
  .row .dot.older{background:var(--older)}
  .row .place{font-weight:600;font-size:12.5px}
  .row .headline{color:var(--muted);font-size:12px;line-height:1.4}

  /* Leaflet popup / tooltip theming */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip{background:var(--panel);color:var(--ink)}
  .leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.5}
  .leaflet-popup-content a{color:var(--accent)}
  .leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
  .card-badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
              padding:2px 6px;border-radius:3px;margin-bottom:6px}
  .card-badge.current{background:rgba(46,160,67,.2);color:#4fd873}
  .card-badge.older{background:rgba(210,153,34,.2);color:#e6b93a}
  .card-place{font-weight:700;font-size:13px;margin-bottom:2px}
  .card-headline{font-weight:600;margin-bottom:4px}
  .card-desc{color:var(--muted);font-size:12px;margin-bottom:6px}
  .card-meta{color:var(--muted);font-size:11px;margin-bottom:6px}
  .card-link{color:var(--accent);font-size:12px;text-decoration:none}
  .card-link:hover{text-decoration:underline}

  .leaflet-tooltip.dc-tip{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;font-size:12px;padding:8px 10px;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .leaflet-tooltip.dc-tip:before{border-right-color:var(--line)}

  @media (max-width:760px){
    body{flex-direction:column;overflow:auto}
    #map{height:55vh;flex:0 0 55vh}
    #sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line);height:auto}
  }
</style>
</head>
<body>

      <span><i class="swatch older"></i>Older / Background</span>
    </div>
    <div id="list"></div>
  </div>

const map = L.map('map', {zoomControl:true, worldCopyJump:false, minZoom:3, maxZoom:12})
  .setView([39.5, -98.35], 4);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const markers = {};

function colorFor(status){ return status === 'current' ? '#2ea043' : '#d29922'; }

ITEMS.forEach(item => {
  const marker = L.circleMarker([item.lat, item.lon], {
    radius: item.status === 'current' ? 9 : 7,
    fillColor: colorFor(item.status),
    color: '#0f1419',
    weight: 2,
    fillOpacity: 0.92
  }).addTo(map);

  const badge = item.status === 'current' ? 'Current' : 'Older';
  const tipHtml = `
    <div class="card-badge ${item.status}">${badge}</div>
    <div class="card-place">${item.place}</div>
    <div class="card-headline">${item.headline}</div>
    <div class="card-desc">${item.desc}</div>
    <div class="card-meta">${item.source} · ${item.date}</div>
  `;
  marker.bindTooltip(tipHtml, {direction:'top', offset:[0,-6], className:'dc-tip', opacity:1});

  const popupHtml = `
    <div class="card-badge ${item.status}">${badge}</div>
    <div class="card-place">${item.place}</div>
    <div class="card-headline">${item.headline}</div>
    <div class="card-desc">${item.desc}</div>
    <div class="card-meta">${item.source} · ${item.date}</div>
    <a class="card-link" href="${item.url}" target="_blank" rel="noopener">Read source &rarr;</a>
  `;
  marker.bindPopup(popupHtml);

  markers[item.id] = marker;
});

// Sidebar list
const listEl = document.getElementById('list');
function renderGroup(title, status){
  const group = ITEMS.filter(i => i.status === status);
  const titleEl = document.createElement('div');
  titleEl.className = 'group-title';
  titleEl.textContent = `${title} (${group.length})`;
  listEl.appendChild(titleEl);

  group.forEach(item => {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.id = item.id;
    row.innerHTML = `
      <div class="rh"><span class="dot ${item.status}"></span><span class="place">${item.place}</span></div>
      <div class="headline">${item.headline}</div>
    `;
    row.addEventListener('click', () => {
      document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
      row.classList.add('active');
      const m = markers[item.id];
      map.flyTo([item.lat, item.lon], 8, {duration:0.8});
      setTimeout(() => m.openPopup(), 700);
    });
    listEl.appendChild(row);
  });
}
renderGroup('Past 24 Hours (Current)', 'current');
renderGroup('Older / Background', 'older');
