  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .dot.current{background:var(--current)}
  .dot.older{background:var(--older)}

  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#1a6ed8}
  @media (max-width:760px){
    #app{flex-direction:column}
    #sidebar{flex:0 0 46vh;border-left:0;border-top:1px solid var(--line);width:100%}
    #map{flex:1 1 54vh}

  );

var listEl = document.getElementById('list');
function renderGroup(label, filterFn){
  var groupItems = sites.map(function(s,i){return {s:s,i:i};}).filter(function(o){return filterFn(o.s);});
  if(!groupItems.length) return;
  var h = document.createElement('div');
  h.className = 'group-label';
  h.textContent = label;
  listEl.appendChild(h);
  groupItems.forEach(function(o){
    var row = document.createElement('div');
    row.className = 'row';
    var badgeClass = o.s.current ? 'current' : 'older';
    row.innerHTML = '<span class="badge ' + badgeClass + '">' + (o.s.current ? 'NEW' : 'BG') + '</span>' +
      '<span class="rp">' + o.s.place + '</span><div class="rh">' + o.s.headline + '</div>';
    row.addEventListener('click', function(){
      map.flyTo([o.s.lat, o.s.lon], 9, {duration: 0.8});
      markers[o.i].openPopup();
    });
    listEl.appendChild(row);
  });
}
renderGroup('Past 24 Hours (Current)', function(s){return s.current;});
renderGroup('Older / Background', function(s){return !s.current;});
