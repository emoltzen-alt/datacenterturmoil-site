<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#0f1419; --panel:#161d26; --ink:#e6edf3; --muted:#9aa7b4; --line:#2a333d;
    --accent:#4ea1ff; --current:#2ea043; --older:#d29922;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  .app{display:flex;height:100%}
  .mapwrap{flex:1 1 auto;position:relative;min-width:0}
  #map{height:100%;width:100%;background:#0a0e13}

  .legend{position:absolute;bottom:14px;left:14px;z-index:500;background:rgba(22,29,38,.92);
    border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .legend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
  .legend .sw{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .legend .sw.current{background:var(--current)} .legend .sw.older{background:var(--older)}

  .sidebar{flex:0 0 360px;display:flex;flex-direction:column;border-left:1px solid var(--line);
    background:var(--panel);min-width:0}
  .sidebar header{flex:0 0 auto;padding:14px 16px;border-bottom:1px solid var(--line)}
  .sidebar h1{font-size:15px;margin:0 0 3px}
  .sidebar .sub{color:var(--muted);font-size:11.5px}
  .sidebar .scroll{flex:1 1 auto;overflow-y:auto;padding:10px 12px 24px}
  .grp-title{display:flex;align-items:center;gap:7px;font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted);margin:16px 4px 8px}
  .grp-title .dot{width:9px;height:9px;border-radius:50%}
  .grp-title .dot.current{background:var(--current)} .grp-title .dot.older{background:var(--older)}
  .row-item{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:7px;
    background:#121821;transition:border-color .15s,background .15s}
  .row-item:hover{border-color:var(--accent);background:#152232}
  .row-item.active{border-color:var(--accent);background:#152232}
  .row-item .h{font-weight:600;font-size:13px;margin-bottom:2px}
  .row-item .l{color:var(--accent);font-size:11.5px}
  .row-item .d{color:#aab4c0;font-size:11.5px;margin-top:4px}
  .row-item .m{color:var(--muted);font-size:10.5px;margin-top:4px}

  .leaflet-tooltip.dc-tip{background:#161d26;color:#e6edf3;border:1px solid #2a333d;border-radius:8px;
    padding:9px 12px;font-size:12.5px;max-width:250px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .leaflet-tooltip.dc-tip .tbadge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;padding:1px 6px;border-radius:20px;margin-bottom:5px}
  .leaflet-tooltip.dc-tip .tbadge.current{background:#123321;color:#5fe085}
  .leaflet-tooltip.dc-tip .tbadge.older{background:#3a2c0d;color:#f0c04d}
  .leaflet-tooltip.dc-tip .th{font-weight:600;margin-bottom:3px}
  .leaflet-tooltip.dc-tip .tl{color:#7fb8ff;font-size:11.5px;margin-bottom:3px}
  .leaflet-tooltip.dc-tip .td{color:#aab4c0}
  .leaflet-tooltip.dc-tip .tm{color:#9aa7b4;font-size:10.5px;margin-top:4px}

  .leaflet-popup-content-wrapper{background:#161d26;color:#e6edf3;border-radius:8px}
  .leaflet-popup-tip{background:#161d26}
  .leaflet-popup-content{font-size:13px;line-height:1.5}
  .leaflet-popup-content a{color:var(--accent)}

  @media (max-width:820px){
    .app{flex-direction:column}
    .sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line);order:2}
    .mapwrap{flex:0 0 55vh;order:1}
  }
</style>
</head>
<body>
<div class="app">
  <div class="mapwrap">
    <div id="map"></div>
    <div class="legend">
      <div class="row"><span class="sw current"></span> Current — past 24–72 hrs</div>
      <div class="row"><span class="sw older"></span> Older / background</div>
    </div>
  </div>
  <div class="sidebar">
    <header>
      <h1>Data Center Community Response</h1>
      <div class="sub">U.S. local reaction · window: past 24–72 hrs as of Sept 5, 2026</div>
    </header>
    <div class="scroll" id="scroll"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  {name:"Westover, AL", lat:33.3487, lng:-86.5522, status:"OLDER",

   loc:"Westover, AL",

var map = L.map('map', {zoomControl:true}).setView([39.5, -95.0], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19, subdomains:'abcd'
}).addTo(map);

var markers = {};
sites.forEach(function(s, i){
  var isCurrent = s.status === "CURRENT";
  var color = isCurrent ? "#2ea043" : "#d29922";
  var m = L.circleMarker([s.lat, s.lng], {
    radius: isCurrent ? 10 : 8, color: "#0f1419", weight: 2,
    fillColor: color, fillOpacity: 0.9
  }).addTo(map);

  var tipHtml = '<div class="tbadge '+(isCurrent?'current':'older')+'">'+s.status+'</div>'
    + '<div class="th">'+s.headline+'</div>'
    + '<div class="tl">'+s.loc+'</div>'
    + '<div class="td">'+s.desc+'</div>'
    + '<div class="tm">'+s.source+' · '+s.date+'</div>';
  m.bindTooltip(tipHtml, {className:'dc-tip', direction:'top', offset:[0,-6], opacity:1});

  var popHtml = '<b>'+s.headline+'</b><br>'+s.loc+'<br><br>'+s.desc
    + '<br><br><a href="'+s.url+'" target="_blank" rel="noopener">'+s.source+' · '+s.date+' →</a>';
  m.bindPopup(popHtml, {maxWidth:280});

  markers[i] = m;
});

function flyTo(i){
  var s = sites[i];
  map.flyTo([s.lat, s.lng], 8, {duration:0.8});
  markers[i].openPopup();
}

function renderSidebar(){
  var el = document.getElementById('scroll');
  var html = '';
  html += '<div class="grp-title"><span class="dot current"></span> Past 24 Hours (Current)</div>';
  sites.forEach(function(s, i){
    if (s.status !== "CURRENT") return;
    html += rowHtml(s, i);
  });
  html += '<div class="grp-title"><span class="dot older"></span> Older / Background</div>';
  sites.forEach(function(s, i){
    if (s.status !== "OLDER") return;
    html += rowHtml(s, i);
  });
  el.innerHTML = html;

  Array.prototype.forEach.call(el.querySelectorAll('.row-item'), function(row){
    row.addEventListener('click', function(){
      Array.prototype.forEach.call(el.querySelectorAll('.row-item'), function(r){ r.classList.remove('active'); });
      row.classList.add('active');
      flyTo(parseInt(row.getAttribute('data-i'), 10));
    });
  });
}

function rowHtml(s, i){
  return '<div class="row-item" data-i="'+i+'">'
    + '<div class="h">'+s.headline+'</div>'
    + '<div class="l">'+s.loc+'</div>'
    + '<div class="d">'+s.desc+'</div>'
    + '<div class="m">'+s.source+' · '+s.date+'</div>'
    + '</div>';
}

renderSidebar();
</script>
</body>
</html>
