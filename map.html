<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map (last 24 hours)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f1419;--panel:#151b22;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;--current:#2ea043;--older:#d29922;--link:#6cb6ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  #app{display:flex;height:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}
  #sidebar{flex:0 0 340px;height:100%;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel)}
  #sidebar .head{flex:0 0 auto;padding:12px 14px;border-bottom:1px solid var(--line)}
  #sidebar .head h1{font-size:14px;margin:0 0 6px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .swatch{width:10px;height:10px;border-radius:50%;display:inline-block}
  .swatch.current{background:var(--current)}
  .swatch.older{background:var(--older)}
  #list{flex:1 1 auto;overflow-y:auto}
  .group-label{position:sticky;top:0;background:var(--panel);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 14px 6px;border-bottom:1px solid var(--line);z-index:2}
  .row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:rgba(255,255,255,.04)}
  .row .rloc{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
  .row .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .row .dot.current{background:var(--current)}
  .row .dot.older{background:var(--older)}
  .row .rhead{color:#c7d0d9;font-size:12.5px;margin:3px 0 2px}
  .row .rmeta{color:var(--muted);font-size:11px}
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink)}
  .leaflet-popup-tip{background:var(--panel)}
  .leaflet-popup-content{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:10px 12px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:var(--link)}
  .tt{font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:230px}
  .tt b{font-size:12.5px;display:block;margin-bottom:2px}
  .tt .badge{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;padding:1px 5px;border-radius:8px;margin-bottom:4px}
  .tt .badge.current{background:rgba(46,160,67,.25);color:#7ee2a0}
  .tt .badge.older{background:rgba(210,153,34,.25);color:#f0c563}
  .tt .desc{color:#333;margin:2px 0}
  .tt .src{color:#666;font-size:11px}
  @media (max-width:820px){
    #app{flex-direction:column}
    #map{flex:0 0 55vh}
    #sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>

      <h1>Data Center Community Response</h1>
      <div class="legend">
        <span><span class="swatch current"></span>Past 24 hours</span>
        <span><span class="swatch older"></span>Older / background</span>
      </div>
    </div>
    <div id="list"></div>
  </div>
</div>

// Official meeting livestreams (government/board-recorded only): none confirmed for the past 24h window.
var officialVideos = [];

var COLORS = {current:"#2ea043", older:"#d29922"};

var map = L.map('map', {scrollWheelZoom:true}).setView([39.5, -96.5], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 19
}).addTo(map);

var markers = [];

sites.forEach(function(s, i){
  var color = COLORS[s.status];
  var marker = L.circleMarker([s.lat, s.lon], {
    radius: s.status === "current" ? 10 : 8,
    color: color, fillColor: color, fillOpacity: 0.85, weight: 2
  }).addTo(map);

  var badgeLabel = s.status === "current" ? "CURRENT" : "OLDER";
  var tooltipHtml =
    '<div class="tt"><span class="badge ' + s.status + '">' + badgeLabel + '</span>' +
    '<b>' + s.loc + '</b>' +
    '<div class="desc">' + s.headline + '</div>' +
    '<div class="desc">' + s.desc + '</div>' +
    '<div class="src">' + s.source + ' · ' + s.date + '</div></div>';
  marker.bindTooltip(tooltipHtml, {direction:'top', offset:[0,-6]});

  var popupHtml =
    '<b>' + s.loc + '</b><br>' +
    s.headline + '<br>' +
    '<span style="color:#9aa7b4">' + s.desc + '</span><br>' +
    '<span style="color:#9aa7b4">' + s.source + ' · ' + s.date + '</span><br>' +
    '<a href="' + s.url + '" target="_blank" rel="noopener">Read source →</a>';
  marker.bindPopup(popupHtml);

  markers.push(marker);
});

function renderList(){
  var list = document.getElementById('list');
  var current = sites.map(function(s,i){return {s:s,i:i};}).filter(function(o){return o.s.status==="current";});
  var older = sites.map(function(s,i){return {s:s,i:i};}).filter(function(o){return o.s.status==="older";});

  function rowHtml(o){
    var s = o.s;
    return '<div class="row" data-idx="'+o.i+'">' +
      '<div class="rloc"><span class="dot '+s.status+'"></span>'+s.loc+'</div>' +
      '<div class="rhead">'+s.headline+'</div>' +
      '<div class="rmeta">'+s.source+' · '+s.date+'</div>' +
      '</div>';
  }

  var html = '';
  html += '<div class="group-label">Past 24 Hours (Current) — ' + current.length + '</div>';
  html += current.length ? current.map(rowHtml).join('') : '<div class="row" style="cursor:default;color:#9aa7b4;font-style:italic">Nothing new confirmed in this window.</div>';
  html += '<div class="group-label">Older / Background — ' + older.length + '</div>';
  html += older.map(rowHtml).join('');

  list.innerHTML = html;

  list.querySelectorAll('.row[data-idx]').forEach(function(row){
    row.addEventListener('click', function(){
      var idx = parseInt(row.getAttribute('data-idx'), 10);
      var s = sites[idx];
      map.flyTo([s.lat, s.lon], 9, {duration:0.6});
      markers[idx].openPopup();
    });
  });
}
renderList();
</script>
</body>
</html>
