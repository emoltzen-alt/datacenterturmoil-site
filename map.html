<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Community Response — Map (last 24 hours), September 7, 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#0f1419; --card:#1a2129; --ink:#e6edf3; --muted:#9aa7b4;
    --accent:#4ea1ff; --current:#2ea043; --older:#b08800; --line:#2a333d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #app{display:flex;height:100%;width:100%}
  #sidebar{width:340px;min-width:340px;height:100%;overflow-y:auto;background:var(--card);
    border-right:1px solid var(--line);padding:16px}
  #sidebar h1{font-size:17px;margin:0 0 4px}
  #sidebar .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  #map{flex:1;height:100%}
  .legend{display:flex;gap:14px;align-items:center;margin-bottom:14px;font-size:12px;color:var(--muted)}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .legend .cur{background:var(--current)}
  .legend .old{background:var(--older)}
  .group-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    border-bottom:1px solid var(--line);padding-bottom:5px;margin:18px 0 8px}
  .group-title:first-of-type{margin-top:0}
  .row{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;
    padding:8px 10px;margin-bottom:8px;cursor:pointer;background:#141b22;transition:background .15s}
  .row:hover{background:#1f2833}
  .row.cur{border-left-color:var(--current)}
  .row.old{border-left-color:var(--older)}
  .row .place{font-weight:700;font-size:13px}
  .row .headline{color:var(--ink);font-size:12px;margin-top:2px}
  .row .meta{color:var(--muted);font-size:11px;margin-top:3px}
  .empty-note{color:var(--muted);font-size:12px;font-style:italic;border:1px dashed var(--line);
    border-radius:6px;padding:8px 10px;margin-bottom:8px}
  .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:1px 6px;border-radius:10px;margin-left:6px}
  .badge.cur{background:var(--current);color:#02160a}
  .badge.old{background:var(--older);color:#1a1400}
  .tt{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:260px}
  .tt b{font-size:13px}
  .tt .loc{color:#9aa7b4;font-size:11px}
  .leaflet-popup-content{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:260px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#4ea1ff}
  @media (max-width:720px){
    #app{flex-direction:column}
    #sidebar{width:100%;min-width:0;height:45%;order:2;border-right:none;border-top:1px solid var(--line)}
    #map{height:55%;order:1}
  }
</style>
</head>
<body>

    <h1>Data Center Community Response</h1>
    <div class="sub">Generated Monday, Sept 7, 2026 · prior 24h + background</div>
    <div class="legend">
      <span><span class="dot cur"></span>Current (24h)</span>
      <span><span class="dot old"></span>Older / Background</span>
    </div>
    <div id="listCurrent"></div>
    <div id="listOlder"></div>
  </div>
  <div id="map"></div>
</div>

  var map = L.map('map', {scrollWheelZoom:true}).setView([39.5, -96.0], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
  }).addTo(map);

  var markers = {};
  sites.forEach(function(s, i){
    var color = s.status === 'current' ? '#2ea043' : '#b08800';
    var m = L.circleMarker([s.lat, s.lng], {
      radius: s.status === 'current' ? 9 : 7,
      color: color, fillColor: color, fillOpacity: 0.85, weight: 2
    }).addTo(map);

    var badge = s.status === 'current' ? 'CURRENT' : 'OLDER';
    var tooltipHtml = '<div class="tt"><b>'+s.place+'</b> <span style="color:'+color+';font-weight:700;font-size:10px">'+badge+'</span>' +
      '<div class="loc">'+s.headline+'</div>' +
      '<div style="margin-top:4px">'+s.desc+'</div>' +
      '<div class="loc" style="margin-top:4px">'+s.source+' · '+s.date+'</div></div>';
    m.bindTooltip(tooltipHtml, {sticky:true, direction:'top', opacity:0.97});

    var popupHtml = '<b>'+s.place+'</b><br>'+s.headline+'<br>' +
      '<span style="color:#9aa7b4">'+s.desc+'</span><br>' +
      '<span style="color:#9aa7b4">'+s.source+' · '+s.date+'</span><br>' +
      '<a href="'+s.url+'" target="_blank" rel="noopener">Open source ↗</a>';
    m.bindPopup(popupHtml);

    markers[i] = m;
  });

  function buildList(containerId, status, title){
    var container = document.getElementById(containerId);
    var heading = document.createElement('div');
    heading.className = 'group-title';
    heading.textContent = title;
    container.appendChild(heading);

    var items = sites.map(function(s,i){ return {s:s, i:i}; }).filter(function(o){ return o.s.status === status; });
    if(items.length === 0){
      var note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = 'No qualifying items.';
      container.appendChild(note);
      return;
    }
    items.forEach(function(o){
      var s = o.s;
      var row = document.createElement('div');
      row.className = 'row ' + (status === 'current' ? 'cur' : 'old');
      row.innerHTML = '<div class="place">'+s.place+
        '<span class="badge '+(status==='current'?'cur':'old')+'">'+(status==='current'?'Current':'Older')+'</span>' +
        (s.video ? '<span class="badge old" style="background:#4ea1ff;color:#06121e">Video</span>' : '') + '</div>' +
        '<div class="headline">'+s.headline+'</div>' +
        '<div class="meta">'+s.source+' · '+s.date+'</div>';
      row.addEventListener('click', function(){
        map.flyTo([s.lat, s.lng], 8, {duration: 0.8});
        markers[o.i].openPopup();
      });
      container.appendChild(row);
    });
  }

  buildList('listCurrent', 'current', 'Past 24 Hours (Current)');
  buildList('listOlder', 'older', 'Older / Background');

</body>
</html>
