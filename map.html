  #app{display:flex;height:100%;width:100%}
  #map{flex:1 1 auto;height:100%}
  #sidebar{width:340px;flex:0 0 340px;height:100%;overflow-y:auto;background:#141b22;border-left:1px solid #2a333d;box-sizing:border-box}

  .dot.cur{background:#2ea043}
  .dot.old{background:#b08800}

  .row.cur{border-left-color:#2ea043}
  .row.old{border-left-color:#b08800}

  .row .meta{font-size:11px;color:#8592a0}
  .tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:10px;margin-left:6px;vertical-align:middle}
  .tag.cur{background:#2ea043;color:#02160a}
  .tag.old{background:#b08800;color:#1a1400}
  .legend{position:absolute;bottom:20px;left:12px;z-index:500;background:rgba(20,27,34,.92);border:1px solid #2a333d;border-radius:8px;padding:10px 14px;font-size:12px;color:#e6edf3}

  .legend .sw{width:12px;height:12px;border-radius:50%;display:inline-block}
  .tt{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .tt b{font-size:13.5px}
  .tt .tbadge{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:10px;margin-left:6px}
  .tt .tbadge.cur{background:#2ea043;color:#02160a}
  .tt .tbadge.old{background:#b08800;color:#1a1400}
  .tt .src{color:#666;font-size:11.5px;margin-top:4px}
  .leaflet-popup-content{font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .leaflet-popup-content b{font-size:15px}
  @media (max-width:760px){
    #app{flex-direction:column}
    #sidebar{width:100%;flex:0 0 42%;order:2;border-left:none;border-top:1px solid #2a333d}
    #map{order:1;height:58%}

  }).addTo(map);

  var listCur = document.getElementById('list-cur');
  var listOld = document.getElementById('list-old');
  var markers = [];

  sites.forEach(function(s, i){
    var color = s.status === 'current' ? '#2ea043' : '#b08800';
    var badgeText = s.status === 'current' ? 'Current' : 'Older';
    var marker = L.circleMarker([s.lat, s.lng], {
      radius: 9, color: color, fillColor: color, fillOpacity: 0.85, weight: 2
    }).addTo(map);

    var ttHtml = '<div class="tt"><b>' + s.place + '</b><span class="tbadge ' + s.status.slice(0,3) + '">' + badgeText + '</span>'

      + '<div style="margin-top:2px">' + s.desc + '</div>'
      + '<div class="src">' + s.source + ' · ' + s.date + '</div></div>';
    marker.bindTooltip(ttHtml, {direction:'top', sticky:true, opacity:0.97});

    var popupHtml = '<b>' + s.place + '</b><br>' + s.headline + '<br><br>'
      + s.desc + '<br><br><a href="' + s.url + '" target="_blank" rel="noopener">' + s.source + ' (' + s.date + ') &#8594;</a>';
    marker.bindPopup(popupHtml);

    markers.push(marker);

    var row = document.createElement('div');
    row.className = 'row ' + s.status.slice(0,3);
    row.innerHTML = '<div class="place">' + s.place + '<span class="tag ' + s.status.slice(0,3) + '">' + badgeText + '</span></div>'

      + '<div class="meta">' + s.source + ' · ' + s.date + '</div>';

      marker.openPopup();
    });
