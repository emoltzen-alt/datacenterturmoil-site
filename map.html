<style>
  :root{--bg:#0f1419;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a333d;--accent:#4ea1ff;--current:#2ea043;--older:#d29922}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  #app{display:flex;height:100%}
  #map{flex:1 1 auto;height:100%;min-width:0}
  #sidebar{flex:0 0 340px;height:100%;overflow-y:auto;border-left:1px solid var(--line);background:#0b0f13}
  #sidebar h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    margin:0;padding:12px 14px 8px;position:sticky;top:0;background:#0b0f13;border-bottom:1px solid var(--line)}
  .row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:#141b22}
  .row .badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;
    padding:2px 6px;border-radius:3px;margin-bottom:4px}
  .badge.CURRENT{background:rgba(46,160,67,.18);color:#3fb950}
  .badge.OLDER{background:rgba(210,153,34,.18);color:#e3b341}
  .row .place{font-weight:600;font-size:13px}
  .row .headline{color:var(--muted);font-size:12px;margin-top:2px}
  .legend-box{position:absolute;bottom:18px;left:18px;z-index:1000;background:rgba(15,20,25,.92);
    border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--ink)}
  .legend-box div{display:flex;align-items:center;gap:6px;margin:3px 0}
  .sw{width:10px;height:10px;border-radius:50%;display:inline-block}
  .leaflet-popup-content{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content a{color:#6cb6ff}
  .tt{font-size:12px;line-height:1.4}
  .tt b{font-size:13px}
  .tt .b2{font-weight:700;font-size:10px;letter-spacing:.04em}
  @media (max-width:820px){
    #app{flex-direction:column}
    #map{flex:0 0 55vh}
    #sidebar{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>

    + it.desc + '<br><span style="color:#9aa7b4">'+it.source+' &middot; '+it.date+'</span><br>'
