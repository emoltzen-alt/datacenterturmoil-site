<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Turmoil — Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel-2: #171b26;
    --border: #262b38;
    --text: #e6e8ee;
    --muted: #9aa2b1;
    --green: #35d07f;
    --amber: #f5a623;
    --link: #7ab8ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    display: flex;
    height: 100vh;
    width: 100vw;
  }
  #sidebar {
    width: 360px;
    min-width: 300px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar-header h1 {
    font-size: 1.05rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  #sidebar-header .sub {
    color: var(--muted);
    font-size: 0.75rem;
  }
  #sidebar-list {
    overflow-y: auto;
    flex: 1;
    padding: 10px 10px 20px;
  }
  .group-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 700;
    margin: 14px 8px 6px;
  }
  .row {
    padding: 10px 10px;
    border-radius: 7px;
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 4px;
    transition: background 0.15s;
  }
  .row:hover {
    background: var(--panel-2);
    border-color: var(--border);
  }
  .row .rtitle {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .row .rloc {
    font-size: 0.72rem;
    color: var(--muted);
  }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .dot.current { background: var(--green); }
  .dot.older { background: var(--amber); }
  #map { flex: 1; height: 100%; }
  .legend {
    position: absolute;
    bottom: 24px;
    left: 380px;
    z-index: 1000;
    background: rgba(18,21,29,0.92);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.78rem;
    color: var(--text);
    backdrop-filter: blur(4px);
  }
  .legend-item { display: flex; align-items: center; margin-bottom: 4px; }
  .legend-item:last-child { margin-bottom: 0; }
  .legend-swatch {
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-right: 8px;
    display: inline-block;
    border: 2px solid #0b0d12;
  }
  .legend-swatch.current { background: var(--green); }
  .legend-swatch.older { background: var(--amber); }
  .legend-swatch.video { background: #c86bff; }

  .leaflet-tooltip.dc-tooltip {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.78rem;
    max-width: 260px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5);
  }
  .leaflet-tooltip.dc-tooltip::before { border-top-color: var(--border); }
  .tt-badge {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 5px;
  }
  .tt-badge.current { background: #1f6b46; color: var(--green); }
  .tt-badge.older { background: #7a5518; color: var(--amber); }
  .tt-headline { font-weight: 700; margin-bottom: 3px; }
  .tt-loc { color: var(--muted); margin-bottom: 4px; }
  .tt-desc { color: #cbd1de; margin-bottom: 4px; }
  .tt-src { color: var(--muted); font-size: 0.72rem; }

  .leaflet-popup-content-wrapper {
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .leaflet-popup-tip { background: var(--panel); }
  .popup-title { font-weight: 700; margin-bottom: 4px; font-size: 0.92rem; }
  .popup-loc { color: var(--muted); font-size: 0.78rem; margin-bottom: 6px; }
  .popup-desc { font-size: 0.82rem; color: #cbd1de; margin-bottom: 8px; }
  .popup-link { color: var(--link); font-size: 0.8rem; text-decoration: none; font-weight: 600; }
  .popup-link:hover { text-decoration: underline; }

  @media (max-width: 720px) {
    #sidebar { width: 100%; height: 40%; position: absolute; z-index: 900; }
    #app { flex-direction: column; }
    #map { height: 60%; margin-top: 40%; }
    .legend { left: 12px; bottom: 12px; }
  }
</style>
</head>

const map = L.map('map', { zoomControl: true }).setView([39.5, -96], 4.4);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

function markerColor(item) {
  if (item.isVideo) return '#c86bff';
  return item.current ? '#35d07f' : '#f5a623';
}

function makeIcon(item) {
  const color = markerColor(item);
  const html = `<div style="
    width:16px;height:16px;border-radius:50%;
    background:${color};
    border:2px solid #0b0d12;
    box-shadow:0 0 0 1px ${color}55;
  "></div>`;
  return L.divIcon({ html, className: '', iconSize: [16, 16], iconAnchor: [8, 8] });
}

const markerById = {};

ITEMS.forEach((item, idx) => {
  const marker = L.marker([item.lat, item.lon], { icon: makeIcon(item) }).addTo(map);
  const badgeClass = item.current ? 'current' : 'older';
  const badgeLabel = item.current ? 'CURRENT' : 'OLDER';

  const tooltipHtml = `
    <div class="tt-badge ${badgeClass}">${badgeLabel}${item.isVideo ? ' · VIDEO' : ''}</div>
    <div class="tt-headline">${item.headline}</div>
    <div class="tt-loc">${item.location}</div>
    <div class="tt-desc">${item.desc}</div>
    <div class="tt-src">${item.source} · ${item.date}</div>
  `;
  marker.bindTooltip(tooltipHtml, { className: 'dc-tooltip', direction: 'top', offset: [0, -8] });

  const popupHtml = `
    <div class="popup-title">${item.headline}</div>
    <div class="popup-loc">${item.location} · ${item.source}, ${item.date}</div>
    <div class="popup-desc">${item.desc}</div>
    <a class="popup-link" href="${item.url}" target="_blank" rel="noopener">Read source →</a>
  `;
  marker.bindPopup(popupHtml);

  markerById[idx] = marker;
});

// Sidebar
const listEl = document.getElementById('sidebar-list');

function renderGroup(title, items) {
  const label = document.createElement('div');
  label.className = 'group-label';
  label.textContent = title + ` (${items.length})`;
  listEl.appendChild(label);

  items.forEach(({ item, idx }) => {
    const row = document.createElement('div');
    row.className = 'row';
    const dotClass = item.current ? 'current' : 'older';
    row.innerHTML = `
      <div class="rtitle"><span class="dot ${dotClass}"></span>${item.headline}</div>
      <div class="rloc">${item.location}${item.isVideo ? ' · 🎥 official video' : ''}</div>
    `;
    row.addEventListener('click', () => {
      map.flyTo([item.lat, item.lon], 9, { duration: 0.9 });
      const marker = markerById[idx];
      setTimeout(() => marker.openPopup(), 950);
    });
    listEl.appendChild(row);
  });
}

const currentItems = ITEMS.map((item, idx) => ({ item, idx })).filter(x => x.item.current);
const olderItems = ITEMS.map((item, idx) => ({ item, idx })).filter(x => !x.item.current);

renderGroup('Past 24 Hours (Current)', currentItems);
renderGroup('Older / Background', olderItems);
</script>
