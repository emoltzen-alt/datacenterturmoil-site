<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Turmoil — Community Response Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0b0e14; --panel:#12161f; --panel2:#171c28; --border:#262c3a;
    --text:#e8ebf2; --muted:#93a0b8; --current:#3ddc84; --older:#f2b84b;
    --accent:#5b9dff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #app{display:flex;height:100vh;width:100vw;overflow:hidden;}
  #sidebar{
    width:380px;min-width:280px;max-width:45vw;height:100%;background:var(--panel);
    border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;
  }
  #sidebar header{padding:16px 18px 12px;border-bottom:1px solid var(--border);}
  #sidebar h1{font-size:16px;margin:0 0 4px;letter-spacing:.2px;}
  #sidebar .sub{font-size:12px;color:var(--muted);}
  #legend{display:flex;gap:14px;padding:10px 18px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .dot.cur{background:var(--current);box-shadow:0 0 6px var(--current);}
  .dot.old{background:var(--older);box-shadow:0 0 6px var(--older);}
  #list{flex:1;overflow-y:auto;padding:6px 0 40px;}
  .group-title{
    position:sticky;top:0;background:var(--panel);z-index:2;
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    padding:12px 18px 6px;
  }
  .row{
    padding:10px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;
  }
  .row:hover{background:var(--panel2);}
  .row .rtop{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
  .row .place{font-weight:600;font-size:13px;}
  .row .headline{font-size:12.5px;color:#c7cee0;line-height:1.4;margin:2px 0 4px;}
  .row .meta{font-size:11px;color:var(--muted);}
  a.src-link{color:var(--accent);text-decoration:none;}
  a.src-link:hover{text-decoration:underline;}
  #map{flex:1;height:100%;}
  .badge{
    display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;
    padding:2px 6px;border-radius:3px;text-transform:uppercase;
  }
  .badge.cur{background:rgba(61,220,132,.15);color:var(--current);border:1px solid rgba(61,220,132,.4);}
  .badge.old{background:rgba(242,184,75,.15);color:var(--older);border:1px solid rgba(242,184,75,.4);}
  .leaflet-tooltip.dct-tip{
    background:var(--panel2);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;font-family:inherit;font-size:12px;max-width:260px;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
  }
  .leaflet-tooltip.dct-tip::before{display:none;}
  .tip-place{font-weight:700;font-size:13px;margin-bottom:2px;}
  .tip-headline{color:#c7cee0;margin:4px 0;line-height:1.4;}
  .tip-meta{color:var(--muted);font-size:11px;margin-top:4px;}
  .leaflet-popup-content-wrapper{background:var(--panel2);color:var(--text);border-radius:8px;border:1px solid var(--border);}
  .leaflet-popup-tip{background:var(--panel2);}
  .leaflet-popup-content a{color:var(--accent);}
  .leaflet-container{background:var(--bg);}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  @media (max-width: 720px){
    #app{flex-direction:column;}
    #sidebar{width:100%;max-width:100%;height:42vh;border-right:none;border-bottom:1px solid var(--border);}
    #map{height:58vh;}
  }
</style>
</head>
<body>
<div id="app">

    <header>
      <h1>Data Center Turmoil — Community Response Map</h1>
      <div class="sub">U.S. local reaction to data center development</div>
    </header>
    <div id="legend">
      <span><span class="dot cur"></span>Past 24 Hours (Current)</span>
      <span><span class="dot old"></span>Older / Background</span>
    </div>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  {status:"older",place:"Independence, MO",lat:39.0911,lng:-94.4155,

   desc:"Residents sued after the council approved a tax incentive plan for a proposed data center, disputing how a referendum petition was handled.",

   headline:"Council members push for data center zoning overhaul",

];

const map = L.map('map', {zoomControl:true}).setView([39.5, -98.35], 4.4);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const markers = [];

function makeIcon(status){
  const color = status === 'current' ? '#3ddc84' : '#f2b84b';
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #0b0e14;box-shadow:0 0 8px ${color};"></div>`,
    iconSize: [14,14],
    iconAnchor: [7,7]
  });
}

DATA.forEach((item, i) => {
  const icon = makeIcon(item.status);
  const marker = L.marker([item.lat, item.lng], {icon}).addTo(map);

  const badge = item.status === 'current'
    ? '<span class="badge cur">Current</span>'
    : '<span class="badge old">Older</span>';

  marker.bindTooltip(
    `<div class="tip-place">${item.place} ${badge}</div>
     <div class="tip-headline">${item.headline}</div>
     <div class="tip-meta">${item.desc}</div>
     <div class="tip-meta">${item.source} — ${item.date}</div>`,
    {className: 'dct-tip', direction: 'top', offset: [0,-8], sticky: true}
  );

  marker.bindPopup(
    `<div style="max-width:240px;">
       <div style="font-weight:700;margin-bottom:4px;">${item.place}</div>
       <div style="margin-bottom:6px;">${item.headline}</div>
       <div style="font-size:12px;color:#93a0b8;margin-bottom:8px;">${item.desc}</div>
       <div style="font-size:11px;color:#93a0b8;margin-bottom:6px;">${item.source} — ${item.date}</div>
       <a href="${item.url}" target="_blank" rel="noopener noreferrer">Read source →</a>
     </div>`
  );

  markers.push(marker);
});

function renderList(){
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';

  const groups = [
    {key:'current', title:'Past 24 Hours (Current)'},
    {key:'older', title:'Older / Background'}
  ];

  groups.forEach(g => {
    const items = DATA.map((d,i)=>({...d, idx:i})).filter(d => d.status === g.key);
    if(items.length === 0) return;
    const h = document.createElement('div');
    h.className = 'group-title';
    h.textContent = `${g.title} (${items.length})`;
    listEl.appendChild(h);

    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'row';
      const badge = item.status === 'current'
        ? '<span class="badge cur">Current</span>'
        : '<span class="badge old">Older</span>';
      row.innerHTML = `
        <div class="rtop">${badge}<span class="place">${item.place}</span></div>
        <div class="headline">${item.headline}</div>
        <div class="meta">${item.source} — ${item.date} · <a class="src-link" href="${item.url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">source</a></div>
      `;
      row.addEventListener('click', () => {
        map.flyTo([item.lat, item.lng], 9, {duration: 0.9});
        markers[item.idx].openPopup();
      });
      listEl.appendChild(row);
    });
  });
}

renderList();
</script>
</body>
</html>
